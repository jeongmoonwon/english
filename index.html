<head>

<meta name="theme-color" content="#F5F5F7" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#000000" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="mooni의 단어장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/mooni-180.png">
<link rel="icon" href="icons/mooni-192.png">
<title>mooni의 단어장</title>
<script>
  // 화면 모드·글자 크기 (설정 탭). 그리기 전에 적용
  try {
    const p = JSON.parse(localStorage.getItem('freedom-prefs')) || {};
    if (p.theme === 'light' || p.theme === 'dark') document.documentElement.dataset.theme = p.theme;
    if (p.size && p.size !== 'normal') document.documentElement.dataset.size = p.size;
    const font = p.design === 3 && p.font && p.font !== 'Hi Melody' ? p.font : 'NanumSquareRound';
    document.documentElement.style.setProperty('--kfont', `"${font}"`);
    if (p.engFont === 'same') document.documentElement.dataset.eng = 'same';
  } catch {}
</script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Poor+Story&family=Gowun+Dodum&family=Gaegu&family=Gamja+Flower&family=Jua&display=swap">
<style>
/* 나눔스퀘어라운드 (기본 글씨체): 보통·굵게·아주 굵게 */
@font-face { font-family: 'NanumSquareRound'; font-weight: 400; font-display: swap; src: url(https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/NanumSquareRoundR.woff2) format('woff2'); }
@font-face { font-family: 'NanumSquareRound'; font-weight: 700; font-display: swap; src: url(https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/NanumSquareRoundB.woff2) format('woff2'); }
@font-face { font-family: 'NanumSquareRound'; font-weight: 800; font-display: swap; src: url(https://cdn.jsdelivr.net/gh/innks/NanumSquareRound@master/NanumSquareRoundEB.woff2) format('woff2'); }
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --ink: #1B2430;
  --muted: #657080;
  --line: #D5DBE2;
  --accent: #4B4FD6;
  --accent-ink: #FFFFFF;
  --soft: #E3E6F8;
  --caption-bg: rgba(16, 20, 26, 0.88);
  --caption-ink: #FFFFFF;
  --again: #CC453C;
  --hard: #B97A10;
  --good: #218B5B;
  --easy: #3470C9;
  --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
  color-scheme: light dark;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13161B; --surface: #1D2229; --ink: #E7EBF0; --muted: #97A1AD; --line: #2B323B;
    --accent: #8C8FF5; --accent-ink: #11131A; --soft: #262B45; --caption-bg: rgba(0, 0, 0, 0.72);
    --again: #F07068; --hard: #E0A23A; --good: #4CC08A; --easy: #6FA2F0;
  }
}
:root[data-theme="dark"] {
  --bg: #13161B; --surface: #1D2229; --ink: #E7EBF0; --muted: #97A1AD; --line: #2B323B;
  --accent: #8C8FF5; --accent-ink: #11131A; --soft: #262B45; --caption-bg: rgba(0, 0, 0, 0.72);
  --again: #F07068; --hard: #E0A23A; --good: #4CC08A; --easy: #6FA2F0;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--sans);
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all; overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }
img { max-width: 100%; }

/* ---------- 앱 뼈대 ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
.view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
[hidden] { display: none !important; }

.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px 10px;
}
.topbar h1 { flex: 1; margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.count { color: var(--muted); font-size: 14px; }
.pill {
  border: 0; border-radius: 999px; padding: 7px 14px;
  background: var(--soft); color: var(--accent); font-weight: 600; font-size: 15px;
}
.pill.solid { background: var(--accent); color: var(--accent-ink); }

.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 20px 28px; }
.actions { padding: 12px 20px; border-top: 1px solid var(--line); background: var(--bg); }

.tabbar {
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  flex: 1; border: 0; background: none; padding: 8px 0 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; color: var(--muted);
}
.tab svg { width: 24px; height: 24px; }
.tab { position: relative; }
.tab-dot { position: absolute; top: 6px; left: calc(50% + 10px); width: 8px; height: 8px; border-radius: 50%; background: var(--hard); }
#settings-main .field + .field { margin-top: 0; }
/* 설정 화면: 글씨와 간격을 한 단계 촘촘하게 */
#settings-main { font-size: 15px; }
#settings-main .set-row { padding: 10px 14px; gap: 11px; }
#settings-main .set-txt b { font-size: 15px; }
#settings-main .set-txt small { font-size: 12px; }
#settings-main .set-go { font-size: 18px; }
#settings-main .set-icon { width: 30px; height: 30px; border-radius: 9px; }
#settings-main .set-icon svg { width: 17px; height: 17px; }
#settings-main .field { padding: 14px; gap: 9px; margin-bottom: 12px; border-radius: 20px; }
#settings-main .field h3 { font-size: 14px; }
#settings-main .field label.sub { font-size: 12px; margin-bottom: -3px; }
#settings-main .sync-line { font-size: 13px; line-height: 1.45; }
#settings-main .seg { gap: 6px; }
#settings-main .seg-btn, #settings-main .seg-btn.small { font-size: 14px; padding: 8px 4px; border-radius: 12px; }
#settings-main .btn { padding: 11px 14px; font-size: 15px; border-radius: 12px; }
#settings-main .cat { font-size: 13px; padding: 6px 12px; }
#settings-main .chips { gap: 6px; }
#settings-main .font-list { gap: 6px; }
#settings-main .font-opt { font-size: 15px; padding: 8px 10px; border-radius: 12px; }
#settings-main .font-opt small { font-size: 12px; }
#settings-main :is(input.text, textarea, select) { font-size: 16px; padding: 9px 12px; }
#settings-main .usage-meter { height: 8px; }
#settings-main .version { margin-top: 18px; font-size: 12px; }
.version a { color: inherit; }
/* 복습 글자 크기 (설정) */
:root[data-size="small"] .face-text { font-size: 21px; }
:root[data-size="small"] .prompt-text { font-size: 19px; }
:root[data-size="small"] .face-text.serif { font-size: 23px; }
:root[data-size="large"] :is(.prompt-text, .face-text) { font-size: 28px; }
:root[data-size="large"] .face-text.serif { font-size: 31px; }
:root[data-size="xlarge"] :is(.prompt-text, .face-text) { font-size: 32px; }
:root[data-size="xlarge"] .face-text.serif { font-size: 36px; }
/* ---------- 플래시카드 (앞면 → 뒤집으면 뒷면) ---------- */
/* 카드가 남는 화면 높이를 채움 (내용이 더 길면 그만큼 늘어나고 스크롤) */
:is(#review-main, #practice-body):has(.flash) { display: flex; flex-direction: column; }
.flash { perspective: 1200px; flex: 1 0 auto; display: flex; flex-direction: column; }
.flash .face { flex: 1 0 auto; min-height: 340px; }
#practice-body .chip { align-self: flex-start; }
.face.out { animation: flip-out .17s ease-in forwards; }
.face.in { animation: flip-in .32s cubic-bezier(.2, .8, .3, 1.25); }
@keyframes flip-out { to { transform: rotateY(90deg) scale(.97); } }
@keyframes flip-in { from { transform: rotateY(-90deg) scale(.97); } }
.face {
  position: relative; min-height: 260px; padding: 40px 22px 26px;
  display: flex; flex-direction: column; justify-content: center; align-items: center; gap: 14px; text-align: center;
  background: var(--surface); border: 1px solid var(--line); border-radius: 18px;
}
.face.front { cursor: pointer; }
.face.back { background: color-mix(in srgb, var(--soft) 45%, var(--surface)); }
.face .shots { width: 100%; }
.face-tag { position: absolute; top: 14px; left: 16px; padding: 2px 10px; border-radius: 999px; background: var(--soft); color: var(--accent); font-size: 13px; font-weight: 700; }
.face-text { margin: 0; font-size: 26px; line-height: 1.45; font-weight: 650; white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere; }
.face-text.serif { font-family: var(--serif); font-weight: 500; font-size: 29px; }
.face-ask { margin: 4px 0 0; padding-top: 12px; border-top: 1px dashed var(--line); color: var(--muted); font-size: 15px; width: 100%; }
.flip-hint { position: absolute; bottom: 12px; color: var(--muted); font-size: 13px; }
.face .speak-row { margin-top: 0; }
@media (prefers-reduced-motion: reduce) { .face.out, .face.in { animation: none; } }
/* 읽어 주기 버튼 */
.speak { border: 0; background: var(--soft); color: var(--accent); border-radius: 999px; width: 40px; height: 40px; font-size: 19px; line-height: 40px; padding: 0; flex: none; }
.speak-row { display: flex; justify-content: center; margin-top: 12px; }
.prompt .speak-row { justify-content: flex-start; }
.seg.three { grid-template-columns: repeat(3, 1fr); }
.seg.four { grid-template-columns: repeat(4, 1fr); }
.field label.sub { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: -4px; }
.seg-btn.small { font-size: 15px; padding: 10px 6px; }
.size-sample { margin: 0; text-align: center; font-family: var(--serif); }
.font-list { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.font-opt { border: 1px solid var(--line); border-radius: 16px; padding: 10px 12px; background: var(--bg); color: var(--ink); text-align: left; font-size: 18px; display: flex; flex-direction: column; gap: 2px; }
.font-opt small { font-size: 14px; color: var(--muted); }
.font-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); color: var(--accent); }
.eng-sample { font-size: 22px; }
.set-list { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; overflow: hidden; }
.set-row { display: flex; align-items: center; gap: 12px; width: 100%; border: 0; background: none; text-align: left; padding: 14px 16px; color: var(--ink); position: relative; }
.set-row + .set-row { border-top: 1px solid var(--line); }
.set-icon { font-size: 22px; width: 30px; text-align: center; }
.set-txt { flex: 1; min-width: 0; display: flex; flex-direction: column; }
.set-txt b { font-size: 16px; font-weight: 600; }
.set-txt small { color: var(--muted); font-size: 13px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.set-go { color: var(--muted); font-size: 22px; }
.tab-dot.static { position: static; flex: none; }
.back-btn { border: 0; background: var(--soft); color: var(--accent); width: 38px; height: 38px; border-radius: 50%; font-size: 26px; line-height: 34px; padding: 0; flex: none; }
.mode-line { display: flex; align-items: center; gap: 6px; }
.mode-remove { margin: -2px 0 6px; padding: 14px; border-radius: 16px; border: 1.5px solid var(--again); background: color-mix(in srgb, var(--again) 8%, var(--surface)); display: flex; flex-direction: column; gap: 8px; }
.mode-remove p { margin: 0; font-size: 14px; line-height: 1.5; color: var(--ink); }
.btn.danger-fill { background: var(--again); color: #fff; }
.mode-line .x-mini { border: 0; background: none; color: var(--muted); font-size: 16px; padding: 8px; }
[data-act="mode-create"] small { display: block; font-size: 13px; font-weight: 500; opacity: .85; margin-top: 2px; }
.mode-pill { border: 0; background: var(--soft); color: var(--accent); border-radius: 999px; padding: 6px 12px; font-size: 14px; font-weight: 600; white-space: nowrap; }
.head-mode { display: block; font-size: 12px; font-weight: 500; color: var(--muted); }
.pop { position: fixed; inset: 0; z-index: 30; }
.pop-dim { position: absolute; inset: 0; background: rgba(40, 25, 20, .35); animation: fade .2s; }
.pop-card { position: absolute; left: 0; right: 0; bottom: 0; max-height: 80%; overflow-y: auto; background: var(--surface); border-radius: 26px 26px 0 0;
  padding: 12px 18px calc(env(safe-area-inset-bottom, 0px) + 20px); display: flex; flex-direction: column; gap: 8px; animation: slideup .24s ease-out; }
.pop-card h3 { margin: 0 0 4px; font-size: 17px; }
.grab { width: 40px; height: 5px; border-radius: 9px; background: var(--line); margin: 0 auto 6px; }
@keyframes fade { from { opacity: 0; } }
.mode-opt { display: flex; align-items: center; gap: 12px; width: 100%; text-align: left; border: 1px solid var(--line); border-radius: 16px; padding: 11px 14px; background: var(--bg); color: var(--ink); }
.mode-opt[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
.mode-opt .flag { font-size: 24px; }
.mode-opt .txt { flex: 1; display: flex; flex-direction: column; }
.mode-opt small { color: var(--muted); font-size: 13px; }
.mode-opt .n { color: var(--muted); font-size: 13px; }
select.select {
  width: 100%; font: 17px/1.4 var(--sans); color: var(--ink); background-color: var(--bg);
  border: 1px solid var(--line); border-radius: 14px; padding: 11px 36px 11px 12px;
  appearance: none; -webkit-appearance: none; cursor: pointer; padding-right: 36px;
  background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%);
  background-position: calc(100% - 20px) 55%, calc(100% - 14px) 55%; background-size: 6px 6px; background-repeat: no-repeat;
}
.custom-lang { display: flex; gap: 8px; }
.custom-lang .flag-input { flex: none; width: 64px; text-align: center; font-size: 24px; padding: 6px; caret-color: transparent; cursor: pointer; }
/* 누르면 🌐 안내를 지우고 테두리로 '여기에 넣는 중'을 보여 줌 (이모지 하나만 넣는 칸이라 커서는 숨김) */
.custom-lang .flag-input:focus { border-color: var(--accent); box-shadow: 0 0 0 3px color-mix(in srgb, var(--accent) 25%, transparent); outline: none; }
.custom-lang .flag-input:focus::placeholder { color: transparent; }
.custom-lang input:not(.flag-input) { flex: 1; min-width: 0; }
.small-note { font-size: 13px; margin-top: -4px; }
.usage-row { padding: 10px 14px; display: flex; flex-direction: column; gap: 6px; }
.usage-row + .usage-row { border-top: 1px solid var(--line); }
.usage-head { display: flex; align-items: baseline; justify-content: space-between; gap: 8px; font-size: 14px; }
.usage-head span { color: var(--muted); font-size: 12px; }
.usage-head span b { color: var(--ink); }
#settings-main .usage-box { padding: 2px 0; gap: 0; margin: 4px 0 12px; }
#settings-main .usage-box + .sync-line, #usage-box > .sync-line:first-child { margin-top: 2px; }
.usage-box .usage-meter { height: 6px; }
.usage-meter { height: 10px; border-radius: 999px; background: var(--soft); overflow: hidden; }
.usage-meter i { display: block; height: 100%; background: var(--accent); border-radius: inherit; }
.tab[aria-selected="true"] { color: var(--accent); }

/* ---------- 카드 앞면(뜻) / 뒷면(자막) ---------- */
.prompt {
  background: var(--surface); border-radius: 18px; padding: 22px 20px;
  border: 1px solid var(--line);
}
.prompt-text {
  margin: 0; font-size: 22px; line-height: 1.45; font-weight: 650;
  white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere;
}
.shots { display: flex; flex-direction: column; gap: 10px; }
.shots img { display: block; width: 100%; height: auto; border-radius: 10px; }
.prompt .shots + .prompt-text { margin-top: 16px; }
.prompt-text.serif { font-family: var(--serif); font-weight: 500; }
.answer-text { margin-top: 16px; text-align: center; }

.answer { margin-top: 22px; }
.answer .shots { margin-bottom: 4px; }
.caption {
  margin: 16px 0 0; text-align: center;
  font-family: var(--serif); font-size: 25px; line-height: 1.7;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.caption span {
  background: var(--caption-bg); color: var(--caption-ink);
  padding: 5px 12px; border-radius: 6px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.reveal { animation: rise 0.22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 버튼 ---------- */
.btn {
  appearance: none; border: 0; border-radius: 12px; padding: 14px 18px;
  font-weight: 650; font-size: 16px; line-height: 1.2;
  background: var(--soft); color: var(--accent);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.wide { width: 100%; }
.btn.danger { background: transparent; color: var(--again); border: 1px solid var(--line); }

.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades.two { grid-template-columns: 1fr 1fr; gap: 10px; }
.grade {
  --c: var(--accent);
  border: 0; border-radius: 12px; padding: 15px 4px;
  background: var(--surface);
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
  color: var(--c);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.grade span { font-size: 16px; font-weight: 700; }
.grade.again { --c: var(--again); }
.grade.hard { --c: var(--hard); }
.grade.good { --c: var(--good); }
.grade.easy { --c: var(--easy); }

/* ---------- 빈 화면 ---------- */
.empty { padding: 48px 8px 0; text-align: center; }
.empty h2 { margin: 0 0 6px; font-size: 20px; }
.empty p { margin: 0 0 22px; color: var(--muted); }

/* ---------- 카드 목록 ---------- */
.card-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 18px; border: 1px solid var(--line); overflow: hidden; }
.card-list li + li .row { border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  border: 0; background: none; text-align: left; padding: 13px 16px;
}
.thumb { position: relative; flex: none; width: 52px; height: 52px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
.thumb b {
  position: absolute; right: 3px; bottom: 3px; font-size: 11px; line-height: 1;
  padding: 3px 5px; border-radius: 999px; background: rgba(0,0,0,.62); color: #fff;
}
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-kor, .row-eng { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-kor { font-weight: 600; }
.row-eng { font-family: var(--serif); color: var(--muted); }
.row-meta { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 2px; }
.row-meta .due-now { color: var(--accent); font-weight: 600; }
/* 카드 목록: 한 단계 작게 */
#cards-main .row { padding: 11px 14px; gap: 10px; }
#cards-main .row-kor { font-size: 15px; }
#cards-main .row-eng { font-size: 14px; }
#cards-main .row-meta { font-size: 11px; gap: 10px; }
#cards-main .thumb { width: 46px; height: 46px; }

/* ---------- 전체화면 시트 (편집, 연습, 백업) ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  display: flex; flex-direction: column;
  animation: slideup 0.24s ease-out;
}
@keyframes slideup { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head {
  display: flex; align-items: center; gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.sheet-head h2 { flex: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 700; }
.link { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 8px 10px; min-width: 70px; }
.link.strong { font-weight: 700; }
.link.end { text-align: right; }
.link.start { text-align: left; }
.head-note { min-width: 70px; text-align: right; padding-right: 10px; color: var(--muted); font-size: 14px; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px calc(env(safe-area-inset-bottom, 0px) + 28px); }
.sheet .actions { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }

.field { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 12px; }
.field h3 { margin: 0; font-size: 15px; font-weight: 700; }
.field h3 span { color: var(--muted); font-weight: 500; margin-left: 6px; }
textarea {
  width: 100%; min-height: 3.4em; resize: vertical;
  font: 18px/1.45 var(--sans); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
textarea.eng { font-family: var(--serif); }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; }
.thumbs figure { position: relative; flex: none; width: 96px; height: 96px; margin: 0; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
.thumbs figcaption {
  position: absolute; left: 4px; bottom: 4px; font-size: 11px; line-height: 1;
  padding: 3px 6px; border-radius: 999px; background: rgba(0,0,0,.62); color: #fff;
}
.thumbs .x {
  position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.62); color: #fff; font-size: 18px; line-height: 26px; padding: 0;
}
.hint { color: var(--muted); font-size: 14px; margin: -6px 0 16px; }
.found { display: flex; flex-direction: column; gap: 8px; }
.found-item {
  text-align: left; border: 1px solid var(--line); border-radius: 12px; padding: 10px 12px;
  background: var(--bg); color: var(--ink); display: flex; flex-direction: column; gap: 2px;
}
.found-item b { font-family: var(--serif); font-size: 17px; font-weight: 600; }
.found-item span { color: var(--muted); font-size: 15px; }
.fill-btns { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
.fill-btns .btn { display: flex; flex-direction: column; align-items: center; gap: 2px; padding: 14px 8px; font-size: 17px; }
.fill-btns .btn small { font-size: 12px; font-weight: 500; opacity: .75; }
.fill-btns .btn[aria-pressed="true"] { border-color: var(--accent); color: var(--accent); }
.ask-row { display: flex; gap: 8px; align-items: stretch; margin-top: 8px; }
.ask-row textarea { flex: 1; min-width: 0; }
.ask-row textarea::placeholder { font-size: 14px; }
.ask-row .btn { flex: none; }
.heard { margin: 0; padding: 8px 12px; border-radius: 12px; background: var(--bg); color: var(--muted); font-size: 14px; }
.rec { display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; padding: 6px 0; }
.rec b { font-size: 17px; }
.rec-btn { position: relative; width: 96px; height: 96px; border-radius: 50%; border: 0; margin: 10px 0 4px; background: var(--again); display: grid; place-items: center;
  box-shadow: 0 0 0 0 color-mix(in srgb, var(--again) 40%, transparent); animation: rec-pulse 1.4s ease-out infinite; }
.rec-square { width: 30px; height: 30px; border-radius: 8px; background: #fff; }
@keyframes rec-pulse { 0% { box-shadow: 0 0 0 0 color-mix(in srgb, var(--again) 45%, transparent); } 100% { box-shadow: 0 0 0 26px transparent; } }
.rec-time { margin: 0; font-variant-numeric: tabular-nums; color: var(--muted); display: flex; align-items: center; gap: 6px; }
.rec-dot { width: 9px; height: 9px; border-radius: 50%; background: var(--again); animation: blink 1s infinite; }
.rec-actions { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; width: 100%; margin-top: 6px; }
.center-note { text-align: center; }
/* 복숭아와 대화하기 */
#talk-actions { display: flex; flex-direction: column; gap: 8px; }
.talk-hero { display: flex; flex-direction: column; align-items: center; text-align: center; gap: 8px; padding: 12px 0 4px; }
.talk-hero .mascot { width: 120px; height: 116px; }
.talk-hero.live .mascot { animation: talk-bob 1.1s ease-in-out infinite; }
.talk-hero.speaking .mascot { animation: talk-bob .45s ease-in-out infinite; }
@keyframes talk-bob { 0%, 100% { transform: translateY(0); } 50% { transform: translateY(-6px); } }
.talk-hero b { font-size: 19px; }
.talk-hero p { margin: 0; color: var(--muted); }
.talk-log { display: flex; flex-direction: column; gap: 8px; margin-top: 14px; }
.bubble { max-width: 85%; padding: 10px 14px; border-radius: 18px; font-size: 16px; line-height: 1.4; }
.bubble.mooni { align-self: flex-start; background: var(--surface); border: 1px solid var(--line); border-bottom-left-radius: 6px; }
.bubble.me { align-self: flex-end; background: var(--accent); color: var(--accent-ink); border-bottom-right-radius: 6px; }
.bubble.wait { opacity: .6; }
.talk-said { display: block; color: var(--muted); font-size: 14px; text-decoration: line-through; }
.talk-said.plain { text-decoration: none; }
.talk-group { margin: 14px 0 8px; font-size: 15px; font-weight: 700; }
.row-meta .from-talk { color: var(--accent); }
/* 달력: 날마다 세 겹 링 */
.day.ring-day { aspect-ratio: auto; height: 56px; flex-direction: column; gap: 2px; padding: 3px 0 4px; background: transparent; border-radius: 12px; }
.day.ring-day .dnum { font-size: 11px; line-height: 1; color: var(--muted); font-weight: 600; }
.day.ring-day.today .dnum { color: var(--ink); font-weight: 800; }
.day.ring-day.today { box-shadow: none; background: color-mix(in srgb, var(--soft) 70%, transparent); }
.day.ring-day .rings-blank { width: 34px; height: 34px; }
/* 구슬 키우기 */
.orb-card { display: flex; align-items: center; gap: 8px; padding: 2px 14px 2px 2px; margin: 4px 0 10px; border-radius: 24px; background: var(--glass, var(--surface)); box-shadow: 0 6px 22px rgba(30, 20, 60, .05); }
.orb-card .orb-svg { width: 92px; height: 92px; flex: none; overflow: visible; animation: bob 3s ease-in-out infinite; }
.orb-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.orb-head { display: flex; align-items: baseline; gap: 6px; }
.orb-text small { font-size: 12px; font-weight: 800; color: transparent; background-image: var(--gtext, linear-gradient(var(--accent), var(--accent))); -webkit-background-clip: text; background-clip: text; }
.orb-text .orb-head b { font-size: 15px; font-weight: 800; letter-spacing: -0.02em; }
.orb-text span { font-size: 11px; color: var(--muted); }
.orb-text span b { color: var(--ink); }
.orb-warn { color: var(--again) !important; font-weight: 600; }
.orb-warn.soft { color: var(--hard) !important; }
.orb-bar { height: 6px; border-radius: 4px; background: color-mix(in srgb, var(--muted) 15%, transparent); overflow: hidden; }
.orb-bar i { display: block; height: 100%; border-radius: 4px; background: var(--g2, var(--accent)); }
.orb-party { position: fixed; inset: 0; z-index: 60; display: grid; place-items: center; padding: 24px; background: rgba(20, 16, 40, .45); animation: fade .25s ease-out; }
.orb-party-card { width: min(340px, 100%); padding: 26px 22px 20px; border-radius: 30px; background: var(--surface); text-align: center; display: flex; flex-direction: column; align-items: center; gap: 6px; box-shadow: 0 20px 60px rgba(30, 20, 60, .3); animation: party-pop .5s cubic-bezier(.3, 1.6, .5, 1); }
.orb-party-art { width: 170px; height: 170px; display: grid; place-items: center; animation: party-glow 1.6s ease-in-out infinite; }
.orb-party-art .orb-svg { width: 170px; height: 170px; overflow: visible; animation: party-spin .9s cubic-bezier(.3, 1.6, .5, 1); }
.orb-party-card small { font-weight: 800; color: var(--accent); }
.orb-party-card h2 { margin: 0; font-size: 22px; font-weight: 800; letter-spacing: -0.02em; }
.orb-party-card p { margin: 0 0 10px; color: var(--muted); font-size: 14px; line-height: 1.5; }
@keyframes fade { from { opacity: 0; } }
@keyframes party-pop { from { transform: scale(.7); opacity: 0; } }
@keyframes party-spin { from { transform: scale(.3) rotate(-25deg); opacity: 0; } }
@keyframes party-glow { 0%, 100% { filter: drop-shadow(0 0 0 rgba(197, 174, 250, 0)); } 50% { filter: drop-shadow(0 0 18px rgba(197, 174, 250, .9)); } }
@media (prefers-reduced-motion: reduce) { .orb-card .orb-svg, .orb-party-art, .orb-party-art .orb-svg, .orb-party-card { animation: none; } }
/* 오늘의 대화 카드 (홈·대화 탭) */
.talk-card { padding: 18px; margin-bottom: 12px; border-radius: 24px; background: var(--glass, var(--surface)); box-shadow: 0 6px 22px rgba(30, 20, 60, .05); display: flex; flex-direction: column; gap: 8px; text-align: left; }
.talk-card h3 { margin: 0; font-size: 18px; font-weight: 800; letter-spacing: -0.02em; }
.talk-card p { margin: 0; color: var(--muted); font-size: 13px; line-height: 1.45; }
.talk-card .btn { margin-top: 2px; }

.topic-exprs { display: flex; flex-direction: column; gap: 6px; }
.topic-expr { display: flex; align-items: baseline; gap: 8px; width: 100%; text-align: left; border: 0; border-radius: 12px; padding: 7px 10px; background: color-mix(in srgb, var(--muted) 9%, transparent); font: inherit; color: var(--ink); }
.topic-expr b { font-family: var(--serif); font-size: 15px; }
.topic-expr span { flex: 1; color: var(--muted); font-size: 13px; }
.topic-expr i { font-style: normal; color: var(--accent); font-weight: 800; }
.topic-expr.saved i { color: var(--good); }
.topic-foot { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.topic-src { color: var(--muted); font-size: 12px; text-decoration: none; }
.topic-votes { display: flex; gap: 4px; }
.topic-vote { border: 0; background: none; font-size: 15px; padding: 2px 4px; opacity: .45; filter: grayscale(1); }
.topic-vote.on { opacity: 1; filter: none; }
.talk-card.tap { cursor: pointer; transition: transform .15s ease; }
.talk-card.tap:active { transform: scale(.98); }
.talk-go { align-self: flex-end; display: inline-flex; align-items: center; gap: 5px; margin-top: 2px; font-size: 14px; font-weight: 700; color: transparent; background-image: var(--gtext, linear-gradient(var(--accent), var(--accent))); -webkit-background-clip: text; background-clip: text; }
.talk-go .ico { color: #9C7AEE; }
.talk-tag { font-size: 12px; font-weight: 700; color: transparent; background-image: var(--gtext, linear-gradient(var(--accent), var(--accent))); -webkit-background-clip: text; background-clip: text; }
.talk-hero.small { padding-top: 0; }
.talk-hero.small .mascot { width: 84px; height: 82px; }
.talk-topic-chip { display: block; width: fit-content; margin: 0 auto 4px; padding: 5px 12px; border-radius: 999px; background: var(--soft); color: var(--accent); font-size: 13px; font-weight: 700; }
.talk-swipe { display: flex; gap: 10px; overflow-x: auto; scroll-snap-type: x mandatory; margin: 0 -20px; padding: 0 20px 2px; scrollbar-width: none; }
.talk-swipe::-webkit-scrollbar { display: none; }
.talk-swipe > .talk-card { flex: 0 0 calc(100% - 26px); scroll-snap-align: center; margin-bottom: 0; }
.talk-dots { display: flex; justify-content: center; gap: 5px; margin: 8px 0 12px; }
.talk-dots i { width: 6px; height: 6px; border-radius: 3px; background: color-mix(in srgb, var(--muted) 30%, transparent); transition: width .2s; }
.talk-dots i.on { width: 16px; background: var(--g2, var(--accent)); }
#review-actions { display: flex; flex-direction: column; gap: 8px; }
.today-mini { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 12px; }
.today-mini .btn { display: flex; align-items: center; justify-content: center; gap: 6px; padding: 12px; font-size: 14px; background: var(--glass, var(--surface)); color: var(--ink); box-shadow: 0 0 0 .5px var(--line) inset; }
.today-streak-line { display: flex; align-items: center; gap: 8px; margin-top: 6px; font-size: 12px; font-weight: 800; }
.today-streak-line .week { display: flex; gap: 3px; }
.today-streak-line .week i { width: 9px; height: 9px; border-radius: 50%; background: color-mix(in srgb, var(--muted) 18%, transparent); }
.today-streak-line .week i.on { background: var(--g2, var(--accent)); }
.today-streak-line .week i.now { box-shadow: 0 0 0 1.5px color-mix(in srgb, var(--accent) 55%, transparent); }
.opt-badge { margin-left: 4px; padding: 1px 6px; border-radius: 6px; background: var(--soft); color: var(--accent); font-size: 10px; font-weight: 700; vertical-align: 1px; }
/* 오늘 홈 */
.today-hero { display: flex; align-items: center; gap: 16px; padding: 18px; margin: 4px 0 12px; border-radius: 24px; background: var(--glass, var(--surface)); box-shadow: 0 6px 22px rgba(30, 20, 60, .05); }
.today-hero .rings { flex: none; }
.today-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 3px; }
.today-text > b { font-size: 17px; font-weight: 800; letter-spacing: -0.02em; }
.today-text > span { color: var(--muted); font-size: 13px; }
.today-rings { list-style: none; margin: 6px 0 0; padding: 0; display: flex; flex-direction: column; gap: 3px; font-size: 12px; color: var(--muted); }
.today-rings li { display: flex; align-items: center; gap: 6px; }
.today-rings i { width: 7px; height: 7px; border-radius: 50%; }
.today-rings b { color: var(--ink); font-weight: 700; }
.today-links { margin-bottom: 12px; }
.today-links .set-row { padding: 11px 14px; gap: 11px; }
.today-links .set-txt b { font-size: 15px; }
.today-links .set-txt small { font-size: 12px; }
.today-streak { display: flex; align-items: center; justify-content: space-between; padding: 14px 16px; margin-bottom: 12px; border-radius: 20px; background: var(--glass, var(--surface)); box-shadow: 0 6px 22px rgba(30, 20, 60, .05); font-weight: 800; }
.today-streak .week { display: flex; gap: 5px; }
.today-streak .week i { width: 24px; height: 24px; border-radius: 50%; display: grid; place-items: center; font-style: normal; font-size: 10px; font-weight: 700; color: var(--muted); background: color-mix(in srgb, var(--muted) 12%, transparent); }
.today-streak .week i.on { color: var(--on-g, #fff); background: var(--g2, var(--accent)); }
.today-streak .week i.now { box-shadow: 0 0 0 2px color-mix(in srgb, var(--accent) 45%, transparent); }
.ring-detail { display: flex; align-items: center; gap: 18px; }
.ring-detail .rings { flex: none; }
.ring-rows { list-style: none; margin: 0; padding: 0; flex: 1; display: flex; flex-direction: column; gap: 10px; }
.ring-rows li { display: flex; align-items: center; gap: 8px; font-size: 15px; }
.ring-rows i { width: 10px; height: 10px; border-radius: 50%; flex: none; }
.ring-rows span { flex: 1; color: var(--muted); }
.ring-rows b { font-variant-numeric: tabular-nums; font-size: 17px; }
.ring-rows b small { font-size: 13px; color: var(--muted); font-weight: 500; }
.ring-msg { margin: 0; }
.wheels { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; }
.wheel-col { display: flex; flex-direction: column; align-items: center; gap: 6px; min-width: 0; }
.wheel-name { font-size: 13px; font-weight: 700; color: var(--muted); }
.wheel-wrap { position: relative; width: 100%; }
.wheel-wrap::before { content: ''; position: absolute; left: 0; right: 0; top: 64px; height: 32px; border-radius: 12px; background: var(--soft); pointer-events: none; }
.wheel { position: relative; list-style: none; margin: 0; padding: 64px 0; height: 160px; overflow-y: auto; scroll-snap-type: y mandatory; scrollbar-width: none; overscroll-behavior: contain;
  -webkit-mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); mask-image: linear-gradient(transparent, #000 35%, #000 65%, transparent); }
.wheel::-webkit-scrollbar { display: none; }
.wheel li { height: 32px; display: flex; align-items: center; justify-content: center; gap: 2px; scroll-snap-align: center; font-size: 15px; font-variant-numeric: tabular-nums; color: var(--muted); cursor: pointer; transition: color .15s, transform .15s; }
.wheel li small { font-size: 11px; }
.wheel li.on { color: var(--ink); font-weight: 700; }
.goal-edit { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px solid var(--line); }
.legend .ring-key { display: inline-flex; align-items: center; gap: 4px; margin-left: 10px; }
.legend .ring-key i { width: 8px; height: 8px; border-radius: 50%; }
.day .talk-mark { position: absolute; top: 4px; right: 4px; width: 6px; height: 6px; border-radius: 50%; background: linear-gradient(120deg, #7E9DFF, #A888F5 55%, #F09BC8); }
.legend .talk-dot { display: inline-block; width: 7px; height: 7px; border-radius: 50%; background: linear-gradient(120deg, #7E9DFF, #A888F5 55%, #F09BC8); }
.missing { color: var(--muted); font-size: 15px; }
.found-item { flex-direction: row; align-items: flex-start; gap: 10px; }
.found-item .check {
  flex: none; width: 22px; height: 22px; margin-top: 2px; border-radius: 7px; border: 2px solid var(--line);
  display: grid; place-items: center; color: var(--accent-ink); font-size: 14px; font-weight: 800; line-height: 1;
}
.found-item[aria-pressed="true"] { border-color: var(--accent); background: var(--soft); }
.found-item[aria-pressed="true"] .check { background: var(--accent); border-color: var(--accent); }
.found-item .txt { display: flex; flex-direction: column; gap: 2px; min-width: 0; }
.found-item small { color: var(--muted); font-size: 13px; line-height: 1.45; margin-top: 2px; }
.entry h3 { display: flex; align-items: center; }
.entry h3 .x-mini { margin-left: auto; border: 0; background: none; color: var(--muted); font-size: 14px; padding: 2px 4px; }
.entry label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: -6px; }
.entry .entry-cats label { margin-bottom: -2px; }
.entry-cats { display: flex; flex-direction: column; gap: 8px; padding-top: 4px; border-top: 1px dashed var(--line); }
.entry-cats label { margin: 6px 0 -2px; }
.new-cat { display: flex; gap: 8px; align-items: center; }
.new-cat input { flex: 1; min-width: 0; }
.new-cat .btn { flex: none; }
.cat.pop { animation: pop .45s cubic-bezier(.3, 1.6, .5, 1); }
@keyframes pop { 0% { transform: scale(.4); opacity: 0; } 100% { transform: none; opacity: 1; } }
.entry-note { margin: 0; padding: 10px 12px; border-radius: 12px; background: var(--soft); font-size: 14px; line-height: 1.5; }
.btn.add-entry { background: none; border: 2px dashed color-mix(in srgb, var(--accent) 45%, var(--line)); margin-bottom: 18px; }
.btn.small { padding: 10px 14px; font-size: 15px; }
/* 사진 읽는 중: 빙글빙글 도는 고리 + 통통 튀는 카드 캐릭터 */
.scan-wait { display: flex; flex-direction: column; align-items: center; gap: 6px; padding: 10px 0 4px; text-align: center; }
.spinner { position: relative; width: 92px; height: 92px; display: grid; place-items: center; margin-bottom: 6px; }
.spinner::before {
  content: ''; position: absolute; inset: 0; border-radius: 50%;
  border: 6px solid var(--soft); border-top-color: var(--accent); border-right-color: var(--accent);
  animation: spin 0.9s linear infinite;
}
.spinner .mascot { width: 52px; animation: bob 1.1s ease-in-out infinite; }
.scan-wait b { font-size: 17px; }
.dots i { font-style: normal; animation: blink 1.2s infinite; }
.dots i:nth-child(2) { animation-delay: .2s; }
.dots i:nth-child(3) { animation-delay: .4s; }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes bob { 0%, 100% { transform: translateY(2px) rotate(-6deg); } 50% { transform: translateY(-5px) rotate(6deg); } }
@keyframes blink { 0%, 100% { opacity: .15; } 40% { opacity: 1; } }
.mascot { display: block; height: auto; }
.chip { display: inline-block; margin-bottom: 12px; padding: 3px 11px; border-radius: 999px; background: var(--soft); color: var(--accent); font-size: 13px; font-weight: 600; }

/* ---------- 학습 방향 / 카테고리 칩 ---------- */
.filters { display: flex; gap: 8px; padding: 2px 20px 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.sheet .filters { padding-top: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cat {
  flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px;
  background: var(--surface); color: var(--ink); font-size: 14px; line-height: 1.3; white-space: nowrap;
}
.cat small { margin-left: 5px; opacity: 0.7; }
.cat[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.cat.dim:not([aria-pressed="true"]) { opacity: .45; }
.cat:disabled { cursor: default; }
.cat.ghost { background: none; border-style: dashed; color: var(--muted); }
.cat.ghost.danger { color: var(--again); }
.cat-tools { display: flex; align-items: center; gap: 8px; margin: 0 0 12px; }
.cat-tools span { flex: 1; min-width: 0; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg-btn {
  border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px;
  background: var(--bg); color: var(--ink); text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 17px; font-weight: 700;
}
.seg-btn small { font-size: 12px; font-weight: 500; color: var(--muted); }
.seg-btn[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); }
.seg-btn[aria-pressed="true"] small { color: var(--accent); }
.setup-title { margin: 8px 0 14px; font-size: 20px; font-weight: 750; }
/* 복습할 카드가 있을 때 위쪽의 복숭아 */
.review-hero { display: flex; flex-direction: column; align-items: center; text-align: center; padding: 8px 0 2px; }
.review-hero .mascot { width: 104px; margin-bottom: 4px; animation: bob 2.4s ease-in-out infinite; }
.review-hero .setup-title { margin: 6px 0 16px; }
.setup-note { margin: -8px 0 16px; color: var(--muted); }
.summary { flex: 1; min-width: 0; align-self: center; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ---------- 기록(캘린더) ---------- */
.streak { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 2px; }
.streak b { font-size: 26px; font-weight: 800; line-height: 1.2; }
.streak small, .tile small { color: var(--muted); font-size: 14px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; }
.tile b { font-size: 21px; font-weight: 750; }
/* 기록 탭 위쪽 카드: 한 단계 작게 */
#stats-main .streak { padding: 11px 14px; border-radius: 18px; margin-bottom: 8px; }
#stats-main .streak b { font-size: 19px; }
#stats-main .streak small, #stats-main .tile small { font-size: 12px; }
#stats-main .tiles { gap: 8px; margin-bottom: 8px; }
#stats-main .tile { padding: 9px 12px; border-radius: 16px; }
#stats-main .tile b { font-size: 17px; }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px 14px; margin-bottom: 10px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.cal-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.cal-nav { border: 0; background: none; color: var(--accent); font-size: 26px; line-height: 1; width: 44px; height: 40px; border-radius: 10px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0 4px; }
.day {
  position: relative; aspect-ratio: 1; border: 0; border-radius: 8px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums;
}
.day.l1 { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.day.l2 { background: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.day.l3 { background: color-mix(in srgb, var(--accent) 70%, var(--surface)); }
.day.l4 { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.day.future { opacity: 0.35; }
.day.today { box-shadow: inset 0 0 0 2px var(--ink); }
.day[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.day .add-dot { position: absolute; bottom: 4px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--muted); }
.legend { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 4px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.legend i.l1 { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.legend i.l2 { background: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.legend i.l3 { background: color-mix(in srgb, var(--accent) 70%, var(--surface)); }
.legend i.l4 { background: var(--accent); }
.legend .gap { width: 10px; }
.legend i.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.day-rows { list-style: none; margin: 0; padding: 0; }
.day-rows li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); }
.day-rows li:first-child { border-top: 0; }
.day-rows b { font-variant-numeric: tabular-nums; }
input.text {
  width: 100%; font: 17px/1.4 var(--sans); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
input.text:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.backup-text { color: var(--muted); margin: 0 0 18px; }
.version { margin: 28px 0 0; text-align: center; color: var(--muted); font-size: 13px; }
.section-title { margin: 26px 0 8px; font-size: 15px; font-weight: 700; }
.sync-line { margin: 0; color: var(--muted); font-size: 15px; }
.sync-line.warn { color: var(--hard); }
.pill .dot { display: inline-block; width: 7px; height: 7px; margin-left: 5px; border-radius: 50%; background: var(--hard); vertical-align: 2px; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%);
  z-index: 40; max-width: calc(100% - 40px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
}

/* ---------- 말랑 피치 테마 (data-skin="peach") ---------- */
:root[data-skin="peach"] {
  --bg: #FFF6EE; --surface: #FFFFFF; --ink: #3D2B26; --muted: #9C8178; --line: #F4DED2;
  --accent: #FF7A59; --accent-ink: #FFFFFF; --soft: #FFE8DD;
  --again: #E5534B; --hard: #E0901A; --good: #36A66B; --easy: #4C8BE0;
}
/* 설정에서 '항상 어둡게'를 고른 경우 */
:root[data-skin="peach"][data-theme="dark"] { --bg: #221A17; --surface: #2E2420; --ink: #F8EAE4; --muted: #BFA59C; --line: #47372F; --accent: #FF9A7E; --accent-ink: #2A1510; --soft: #4A2E25; }
@media (prefers-color-scheme: dark) {
  :root[data-skin="peach"]:not([data-theme="light"]) { --bg: #221A17; --surface: #2E2420; --ink: #F8EAE4; --muted: #BFA59C; --line: #47372F; --accent: #FF9A7E; --accent-ink: #2A1510; --soft: #4A2E25; }
}
/* 동글동글, 부드러운 그림자, 둥근 글꼴(주아체), 눌리면 통통 */
:root[data-skin] {
  --kfont: "NanumSquareRound";   /* 본문 글씨체 (설정에서 바꿈) */
  --round: "Jua", var(--sans);
  --sans: var(--kfont), -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Noto Sans KR", system-ui, sans-serif;
  /* 영어 표현은 명조(세리프)로 두되, 한글이 섞이면 본문 글씨체로 */
  --serif: "New York", "Iowan Old Style", Georgia, var(--kfont), "Apple SD Gothic Neo", serif;
}
/* 설정에서 '영어 표현도 같은 글씨체'를 고른 경우 */
:root[data-skin][data-eng="same"] { --serif: var(--sans); }
textarea::placeholder { font-family: var(--sans); }
textarea:is(.kor, .eng)::placeholder { font-size: 14px; }
:root[data-skin="peach"] body {
  background-image: radial-gradient(color-mix(in srgb, var(--accent) 13%, transparent) 1.2px, transparent 1.3px);
  background-size: 22px 22px;
}
:root[data-skin="peach"] .field, :root[data-skin="peach"] .prompt, :root[data-skin="peach"] .card-list, :root[data-skin="peach"] .face, :root[data-skin="peach"] .set-list,
:root[data-skin="peach"] .streak, :root[data-skin="peach"] .tile, :root[data-skin="peach"] .cal {
  border-radius: 26px; border-color: transparent;
  box-shadow: 0 6px 20px color-mix(in srgb, var(--accent) 13%, transparent), 0 1px 3px color-mix(in srgb, var(--ink) 6%, transparent);
}
:root[data-skin="peach"] .btn, :root[data-skin="peach"] .grade, :root[data-skin="peach"] .seg-btn { border-radius: 18px; }
:root[data-skin="peach"] .btn.primary, :root[data-skin="peach"] .pill.solid { box-shadow: 0 4px 0 color-mix(in srgb, var(--accent) 60%, #000); }
:root[data-skin] textarea, :root[data-skin] input.text { border-radius: 14px; }
:root[data-skin="peach"] .topbar h1, :root[data-skin="peach"] .sheet-head h2, :root[data-skin="peach"] .empty h2,
:root[data-skin="peach"] .setup-title, :root[data-skin="peach"] .streak b, :root[data-skin="peach"] .tile b,
:root[data-skin="peach"] .cal-head h2, :root[data-skin="peach"] .grade span, :root[data-skin="peach"] .field h3,
:root[data-skin="peach"] .btn, :root[data-skin="peach"] .pill, :root[data-skin="peach"] .tab, :root[data-skin="peach"] .scan-wait b {
  font-family: var(--round); font-weight: 400; letter-spacing: 0;
}
:root[data-skin="peach"] .tabbar { background: color-mix(in srgb, var(--surface) 92%, transparent); }
:root[data-skin="peach"] .tab[aria-selected="true"] svg { background: var(--soft); border-radius: 12px; padding: 2px 10px; width: 44px; box-sizing: content-box; }
:root[data-skin="peach"] .grade { padding: 10px 4px 12px; gap: 3px; }
:root[data-skin="peach"] .grade::before { font-size: 22px; line-height: 1; }
:root[data-skin="peach"] .grade.again::before { content: '😵'; }
:root[data-skin="peach"] .grade.hard::before { content: '🤔'; }
:root[data-skin="peach"] .grade.good::before { content: '🙂'; }
:root[data-skin="peach"] .grade.easy::before { content: '😆'; }
:root[data-skin="peach"] :is(.btn, .grade, .pill, .cat, .seg-btn, .row, .tab, .day, .found-item) { transition: transform .12s cubic-bezier(.3, 1.6, .5, 1); }
:root[data-skin="peach"] :is(.btn, .grade, .pill, .cat, .seg-btn, .row, .tab, .day, .found-item):active { transform: scale(.94); }
:root[data-skin="peach"] .day { border-radius: 12px; }

/* ---------- 파스텔 그라데이션 테마 (data-skin="pastel", 기본) ----------
   파랑 → 보라 → 분홍 → 복숭아 그라데이션은 주 버튼·진행·선택에만, 나머지는 흰 여백·반투명 유리·큰 제목 */
:root[data-skin="pastel"] {
  --bg: #F5F5F7; --surface: #FFFFFF; --ink: #1D1D1F; --muted: #6E6E73; --line: #E5E5EA;
  --accent: #6B5BD6; --accent-ink: #FFFFFF; --soft: #EFEAFE;
  --again: #E5534B; --hard: #D9822B; --good: #1E9E62; --easy: #3D7BE0;
  --g: linear-gradient(120deg, #A7BEFF 0%, #C5AEFA 45%, #FAB9DB 80%, #FFD0BD 100%);
  --g2: linear-gradient(120deg, #A7BEFF, #C5AEFA 55%, #FAB9DB);
  --gtext: linear-gradient(120deg, #6B8CF5, #9C7AEE 55%, #E886B8);
  --on-g: #2B2A4C;            /* 그라데이션 위 글자 */
  /* 그라데이션 버튼 윗부분 빛 반사: 가운데 위에서 둥글게 번지게 (가로 줄처럼 보이지 않게) */
  --sheen: radial-gradient(70% 90% at 50% 0%, rgba(255, 255, 255, .32), rgba(255, 255, 255, 0) 70%);
  --sheen-edge: 0 0 0 transparent;   /* 위쪽 흰 선은 쓰지 않음 */
  --glass: rgba(255, 255, 255, .74);
  --glow1: rgba(197, 174, 250, .32); --glow2: rgba(167, 190, 255, .26); --glow3: rgba(250, 185, 219, .22);
}
:root[data-skin="pastel"][data-theme="dark"] {
  --bg: #000000; --surface: #1C1C1E; --ink: #F5F5F7; --muted: #A1A1A6; --line: #2C2C2E;
  --accent: #B9A8FF; --accent-ink: #1D1D1F; --soft: #2A2540;
  --again: #FF7A72; --hard: #F0A54A; --good: #4CC08A; --easy: #7FA8F5;
  --gtext: linear-gradient(120deg, #A7BEFF, #C5AEFA 55%, #FAB9DB);
  --glass: rgba(28, 28, 30, .7);
  --glow1: rgba(197, 174, 250, .2); --glow2: rgba(167, 190, 255, .14); --glow3: rgba(250, 185, 219, .12);
}
@media (prefers-color-scheme: dark) {
  :root[data-skin="pastel"]:not([data-theme="light"]) {
    --bg: #000000; --surface: #1C1C1E; --ink: #F5F5F7; --muted: #A1A1A6; --line: #2C2C2E;
    --accent: #B9A8FF; --accent-ink: #1D1D1F; --soft: #2A2540;
    --again: #FF7A72; --hard: #F0A54A; --good: #4CC08A; --easy: #7FA8F5;
    --gtext: linear-gradient(120deg, #A7BEFF, #C5AEFA 55%, #FAB9DB);
    --glass: rgba(28, 28, 30, .7);
    --glow1: rgba(197, 174, 250, .2); --glow2: rgba(167, 190, 255, .14); --glow3: rgba(250, 185, 219, .12);
  }
}
:root[data-skin="pastel"] body {
  background:
    radial-gradient(420px 360px at 105% -6%, var(--glow1), transparent 70%),
    radial-gradient(380px 340px at -18% 22%, var(--glow2), transparent 70%),
    radial-gradient(420px 380px at 110% 92%, var(--glow3), transparent 70%),
    var(--bg);
  letter-spacing: -0.012em;
}
/* 유리 카드 */
:root[data-skin="pastel"] :is(.field, .prompt, .card-list, .face, .set-list, .streak, .tile, .cal) {
  background: var(--glass); border-color: transparent; border-radius: 24px;
  -webkit-backdrop-filter: blur(22px) saturate(1.6); backdrop-filter: blur(22px) saturate(1.6);
  box-shadow: 0 6px 22px rgba(30, 20, 60, .05);
}
:root[data-skin="pastel"] .face.back { background: var(--glass); }
/* 플래시카드: 테두리 없이 둥글게 */
:root[data-skin="pastel"] .face { border-radius: 30px; }
:root[data-skin="pastel"] .face-tag { background: none; padding: 0; color: transparent; background-image: var(--gtext); -webkit-background-clip: text; background-clip: text; font-size: 14px; top: 18px; left: 22px; }
/* 큰 제목 */
:root[data-skin="pastel"] .topbar h1 { font-size: 21px; font-weight: 700; letter-spacing: -0.025em; }
/* 탭마다 제목 줄 높이를 같게 (오른쪽 버튼 크기가 달라도) */
:root[data-skin="pastel"] .topbar { min-height: calc(env(safe-area-inset-top, 0px) + 62px); }
:root[data-skin="pastel"] :is(.setup-title, .empty h2) { font-weight: 800; letter-spacing: -0.03em; }
/* 버튼 */
:root[data-skin="pastel"] .btn { border-radius: 16px; font-weight: 700; }
/* 그라데이션은 테두리 자리까지 한 번만 칠함 (테두리 칸에 반대쪽 끝이 반복돼 줄처럼 보이지 않게) */
:root[data-skin="pastel"] :is(.btn.primary, .pill.solid, .cat[aria-pressed="true"], .seg-btn[aria-pressed="true"], .grade.good, .bubble.me, .set-icon) {
  background-origin: border-box; background-repeat: no-repeat;
}
:root[data-skin="pastel"] :is(.btn.primary, .pill.solid) {
  background: var(--sheen), var(--g2); color: var(--on-g); border-radius: 999px;
  box-shadow: var(--sheen-edge), 0 8px 20px rgba(195, 170, 255, .4);
}
:root[data-skin="pastel"] .actions .btn.wide { min-height: 54px; border-radius: 999px; }
/* 오늘·대화 탭 아래 큰 버튼은 한 단계 작게 */
:root[data-skin="pastel"] :is(#review-actions, #talk-actions) .btn.wide { min-height: 46px; padding: 11px 16px; font-size: 15px; }
:root[data-skin="pastel"] :is(#review-actions, #talk-actions) { padding-top: 8px; padding-bottom: 8px; }
:root[data-skin="pastel"] .actions { background: transparent; border-top: 0; }
:root[data-skin="pastel"] .pill { background: var(--glass); color: var(--ink); box-shadow: 0 0 0 .5px var(--line) inset; }
:root[data-skin="pastel"] .mode-pill { background: var(--glass); color: var(--ink); box-shadow: 0 0 0 .5px var(--line) inset; }
/* 칩·선택 */
:root[data-skin="pastel"] .cat { background: var(--glass); border: 0; padding: 7px 14px; box-shadow: 0 0 0 .5px var(--line) inset; }
:root[data-skin="pastel"] .cat.ghost { background: none; border: 1px dashed var(--line); padding: 6px 13px; box-shadow: none; }
:root[data-skin="pastel"] .cat[aria-pressed="true"] { background: var(--sheen), var(--g2); color: var(--on-g); border-color: transparent; box-shadow: var(--sheen-edge), 0 4px 12px rgba(195, 170, 255, .35); }
:root[data-skin="pastel"] .seg-btn { background: var(--glass); border: 0; padding: 13px 11px; border-radius: 16px; box-shadow: 0 0 0 .5px var(--line) inset; }
:root[data-skin="pastel"] .seg-btn.small { padding: 11px 7px; }
:root[data-skin="pastel"] .seg-btn[aria-pressed="true"] { background: var(--sheen), var(--g2); color: var(--on-g); border-color: transparent; box-shadow: var(--sheen-edge), 0 6px 16px rgba(195, 170, 255, .35); }
:root[data-skin="pastel"] .seg-btn[aria-pressed="true"] small { color: var(--on-g); opacity: .75; }
:root[data-skin="pastel"] :is(textarea, input.text) { border-radius: 14px; background: color-mix(in srgb, var(--surface) 70%, transparent); }
/* 평가 버튼: 흰 바탕 + 색 글자, '알맞음'만 그라데이션 */
:root[data-skin="pastel"] .fill-btns .btn {
  padding: 9px 4px; font-size: 15px; gap: 1px;
  background: var(--sheen), var(--g2); background-origin: border-box; color: #4A3D9E; border: 0; border-radius: 14px;
  box-shadow: 0 6px 16px rgba(195, 170, 255, .32);
}
:root[data-skin="pastel"] .fill-btns .btn small { color: #6A5FB8; opacity: 1; font-size: 11px; }
:root[data-skin="pastel"] .fill-btns .btn .ico { width: 19px; height: 19px; margin-bottom: 1px; }
:root[data-skin="pastel"] .fill-btns .btn[aria-pressed="true"] { color: #4A3D9E; outline: 2px solid #A888F5; outline-offset: 2px; }
:root[data-skin="pastel"] .fill-note { text-align: center; font-size: 13px; }
:root[data-skin="pastel"] .grade { background: var(--glass); border-radius: 14px; padding: 10px 4px; box-shadow: 0 2px 10px rgba(30, 20, 60, .05); }
:root[data-skin="pastel"] .grade span { font-size: 15px; line-height: 1.3; }
:root[data-skin="pastel"] .grade { background: color-mix(in srgb, var(--c) 11%, var(--surface)); color: var(--c); }
/* 떠 있는 탭 바 */
:root[data-skin="pastel"] .tabbar {
  margin: 0 14px calc(env(safe-area-inset-bottom, 0px) + 8px); padding: 6px 4px; border: 0; border-radius: 999px;
  background: var(--glass); -webkit-backdrop-filter: blur(30px) saturate(1.8); backdrop-filter: blur(30px) saturate(1.8);
  box-shadow: 0 8px 30px rgba(30, 20, 60, .08), 0 0 0 .5px var(--line);
}
:root[data-skin="pastel"] .tab { color: #AEAEB2; font-weight: 600; font-size: 10.5px; }
:root[data-skin="pastel"] .tab[aria-selected="true"] { color: var(--ink); }
:root[data-skin="pastel"] .tab[aria-selected="true"] svg { stroke: url(#g-stroke); }
/* 설정 목록 아이콘: 그라데이션 타일 */
:root[data-skin="pastel"] .set-icon { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; background: var(--sheen), var(--g2); color: var(--on-g); font-size: 0; flex: none; }
:root[data-skin="pastel"] .set-icon svg { width: 19px; height: 19px; }
/* 대화 말풍선 */
:root[data-skin="pastel"] .bubble { border-radius: 22px; }
:root[data-skin="pastel"] .bubble.mooni { background: var(--glass); border: 0; box-shadow: 0 0 0 .5px var(--line) inset; }
:root[data-skin="pastel"] .bubble.me { background: var(--sheen), var(--g2); color: var(--on-g); box-shadow: var(--sheen-edge); }
/* 그라데이션 글자 */
:root[data-skin="pastel"] .gtext { color: transparent; background-image: var(--gtext); -webkit-background-clip: text; background-clip: text; }
:root[data-skin="pastel"] .streak b { color: transparent; background-image: var(--gtext); -webkit-background-clip: text; background-clip: text; }
/* 눌렀을 때 살짝 */
:root[data-skin="pastel"] :is(.btn, .grade, .pill, .cat, .seg-btn, .row, .tab, .day, .found-item, .set-row) { transition: transform .15s ease; }
:root[data-skin="pastel"] :is(.btn, .grade, .pill, .cat, .seg-btn, .row, .tab, .day, .found-item, .set-row):active { transform: scale(.97); }
:root[data-skin="pastel"] .day { border-radius: 12px; }
/* 선 아이콘 (버튼 안) */
.ico { width: 1.15em; height: 1.15em; vertical-align: -0.2em; flex: none; }
.fill-btns .btn .ico { width: 24px; height: 24px; margin-bottom: 2px; }

.empty .mascot { display: none; }
:root[data-skin] .empty .mascot { display: block; width: 128px; margin: 0 auto 16px; animation: bob 2.4s ease-in-out infinite; }

@media (prefers-reduced-motion: reduce) {
  .reveal, .sheet { animation: none; }

      if (!d.objectStoreNames.contains('reviews')) {
        const s = d.createObjectStore('reviews', { keyPath: 'id', autoIncrement: true });

      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if (!d.objectStoreNames.contains('activity')) d.createObjectStore('activity', { keyPath: 'id' });
    };
    req.onsuccess = () => {
      const d = req.result;
      d.onversionchange = () => d.close();
      resolve(d);
    };
    req.onerror = () => reject(req.error);
  });
}

  const minutes = Math.max(0, toDate(due) - now) / 60000;
  if (minutes < 60) return `${Math.max(1, Math.round(minutes))}분`;
  const hours = minutes / 60;
  if (hours < 24) return `${Math.round(hours)}시간`;
  const days = hours / 24;
  if (days < 30) return `${Math.round(days)}일`;

/** 사진을 긴 변 IMAGE_MAX 이하 JPEG로 줄이기 */
function compressImage(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, IMAGE_MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => resolve(blob || file), 'image/jpeg', IMAGE_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

/** 입력한 글자 중 첫 이모지 하나 (국기는 두 글자짜리라 글자 묶음 단위로 셈). 없으면 '' */

}
const targetLang = (m = prefs.mode) => langInfo(modeParts(m).target) || LANGS.en;
const nativeLang = (m = prefs.mode) => langInfo(modeParts(m).native) || LANGS.ko;
/** 받침에 맞춰 '로'/'으로' (ㄹ 받침은 '로') */
const ro = (word) => {

/** 공부하는 언어: "🇺🇸 영어 공부" */
const studyLabel = (m = prefs.mode) => `${targetLang(m).flag} ${targetLang(m).name} 공부`;
/** 뜻 언어: "한국어로 뜻 보기" */

/** 쓸 수 있는 모드: 카드가 있는 모드 + 이 기기에서 만든 빈 모드 + 지금 모드 */
function modeList() {
  const counts = new Map();
  for (const c of cards) counts.set(modeOf(c), (counts.get(modeOf(c)) || 0) + 1);
  const all = new Set([...counts.keys(), ...prefs.modes, prefs.mode]);
  if (!all.size) all.add(DEFAULT_MODE);   // 모두 지웠으면 영어 공부로 시작
  return [...all].map((m) => ({ mode: m, count: counts.get(m) || 0 }));
}

// ================= 카테고리 =================
const catKey = (c) => c.category || DEFAULT_CATEGORY;
const catName = (key) => catNames.get(key) ?? key;
const catOf = (c) => catName(catKey(c));

/** 이름으로 카테고리 키 찾기. 없으면 새 키를 만들고, 키와 이름이 다르면 이름도 저장 */
async function keyForName(name) {
  // 같은 이름이라도 다른 언어 모드의 카테고리와는 따로 (지금 모드 안에서만 찾음)
  const mine = [...new Set(modeCards().map(catKey))];
  const found = mine.find((k) => catName(k) === name);
  if (found) return found;
  const keys = new Set([...cards.map(catKey), ...catNames.keys()]);
  const key = keys.has(name) ? `${name}~${uid().slice(0, 8)}` : name;
  if (key !== name) {
    const updatedAt = Date.now();
    await putCategoryNames([{ key, name, updatedAt }]);
    catNames.set(key, name);
    catStamps.set(key, updatedAt);
  }
  return key;
}

function categoryList() {
  const counts = new Map();
  modeCards().forEach((c) => counts.set(catOf(c), (counts.get(catOf(c)) || 0) + 1));
  return [...counts.keys()]
    .sort((a, b) => (a === DEFAULT_CATEGORY ? -1 : b === DEFAULT_CATEGORY ? 1 : a.localeCompare(b, 'ko')))
    .map((name) => ({ name, count: counts.get(name) }));
}

/** 복습·자유 연습에 고른 카테고리 (지금 있는 것만). 비어 있으면 전체 */

function studyCards() {

async function renameCategory(from, name) {
  ui.renaming = null;
  if (!name || name === from) { renderCards(); return; }
  const keys = [...new Set(modeCards().map(catKey))].filter((k) => catName(k) === from);
  const updatedAt = Date.now();
  await putCategoryNames(keys.map((key) => ({ key, name, updatedAt })));
  keys.forEach((key) => { catNames.set(key, name); catStamps.set(key, updatedAt); });
  markChanged();
  if (study.cats) {
    study.cats = [...new Set(study.cats.map((c) => (c === from ? name : c)))];
    saveStudy();
  }
  ui.cardsCat = name;
  renderAll();
  toast(`카테고리 이름을 '${name}'(으)로 바꿨어요.`);
}

/** 카테고리 삭제: move = 카드는 to 카테고리로 옮김, all = 카드와 복습 기록까지 삭제 */
async function deleteCategory(name, mode, to) {
  ui.deleting = null;
  const targets = modeCards().filter((c) => catOf(c) === name);
  const t = Date.now();
  if (mode === 'all') {
    if (!confirm(`'${name}'의 카드 ${targets.length}장과 복습 기록을 모두 삭제할까요? 되돌릴 수 없어요.`)) { renderCards(); return; }
    for (const c of targets) {
      await removeCard(c.id);
      syncMeta.deleted[c.id] = t;
    }
    const gone = new Set(targets.map((c) => c.id));
    cards = cards.filter((c) => !gone.has(c.id));
  } else {
    const key = await keyForName(to);
    for (const c of targets) {
      Object.assign(c, { category: key, contentAt: t, updatedAt: Math.max(t, studyAt(c)) });
      await putCard(c);
    }
  }
  if (study.cats) {
    study.cats = study.cats.filter((c) => c !== name);
    saveStudy();
  }
  ui.cardsCat = null;
  markChanged();
  renderAll();
  toast(mode === 'all' ? `'${name}' 카테고리와 카드 ${targets.length}장을 삭제했어요.` : `'${name}' 카테고리를 삭제하고 카드 ${targets.length}장은 '${to}'(으)로 옮겼어요.`);
}

const prefs = (() => {

  const base = { theme: 'system', size: 'normal', speak: false, rate: 0.9, font: 'NanumSquareRound', engFont: 'serif', mode: 'en>ko', modes: [], talkVoice: 'marin', talkName: '', talkBotName: '', design: 3, goalReview: 20, goalAdd: 3, goalTalk: 5, calendar: false, interests: [] };
  let saved = null;
  try { saved = JSON.parse(localStorage.getItem(PREFS_KEY)); } catch {}
  if (saved && saved.design !== 3) { saved.font = base.font; saved.design = 3; try { localStorage.setItem(PREFS_KEY, JSON.stringify(saved)); } catch {} }
  return { ...base, ...saved };
})();
function setPref(key, value) {
  // 하루 목표를 바꾸면 오늘부터 적용 (지난날은 그때 목표 그대로)
  if (['goalReview', 'goalAdd', 'goalTalk'].includes(key) && prefs[key] !== value) {
    const hist = [...(prefs.goalHistory || [])];
    if (!hist.length) hist.push({ from: '0000-00-00', review: prefs.goalReview, add: prefs.goalAdd, talk: prefs.goalTalk });
    const today = dayKey(new Date());
    const g = { ...goalsOn(today), from: today, [{ goalReview: 'review', goalAdd: 'add', goalTalk: 'talk' }[key]]: value };
    prefs.goalHistory = [...hist.filter((h) => h.from !== today), g].sort((a, b) => (a.from < b.from ? -1 : 1));
  }
  prefs[key] = value;
  try { localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); } catch {}
  applyPrefs();
}
const THEME_BG = { light: '#F5F5F7', dark: '#000000' };
const FONTS = [['NanumSquareRound', '나눔스퀘어라운드'], ['Pretendard Variable', '프리텐다드'], ['Poor Story', '푸어스토리'], ['Gowun Dodum', '고운돋움'], ['Gaegu', '개구'], ['Gamja Flower', '감자꽃'], ['Jua', '주아']];
function applyPrefs() {
  const root = document.documentElement;
  if (prefs.theme === 'system') delete root.dataset.theme; else root.dataset.theme = prefs.theme;
  if (prefs.size === 'normal') delete root.dataset.size; else root.dataset.size = prefs.size;
  root.style.setProperty('--kfont', `"${prefs.font}"`);
  if (prefs.engFont === 'same') root.dataset.eng = 'same'; else delete root.dataset.eng;
  // 휴대폰 위쪽 상태 표시줄 색
  document.querySelectorAll('meta[name="theme-color"]').forEach((m) => {
    const dark = m.media.includes('dark');
    m.content = prefs.theme === 'system' ? THEME_BG[dark ? 'dark' : 'light'] : THEME_BG[prefs.theme];
  });
}

const canSpeak = 'speechSynthesis' in window;
/** 글자로 언어 짐작 (기기 음성 고르기용) */
function speechLang(t) {
  if (/[\u3040-\u30ff]/.test(t)) return 'ja-JP';
  if (/[\u4e00-\u9fff]/.test(t)) return 'zh-CN';
  if (/[\u0400-\u04ff]/.test(t)) return 'ru-RU';
  if (/[¿¡ñ]/i.test(t)) return 'es-ES';
  if (/[àâçèêëîïôûùœ]/i.test(t)) return 'fr-FR';
  if (/[äöüß]/i.test(t)) return 'de-DE';
  return 'en-US';
}
function speak(text, lang) {
  if (!canSpeak || !text) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(text);
  u.lang = lang || speechLang(text);
  const voices = speechSynthesis.getVoices();
  const voice = voices.find((v) => v.lang.replace('_', '-') === u.lang) || voices.find((v) => v.lang.startsWith(u.lang.slice(0, 2)));
  if (voice) u.voice = voice;
  u.rate = prefs.rate;
  speechSynthesis.speak(u);
}
const speakHTML = (text, lang = targetLang().speech) => (canSpeak && text ? `<div class="speak-row"><button class="speak" data-act="speak" data-text="${esc(text)}" data-lang="${lang}" aria-label="소리로 듣기">🔊</button></div>` : '');
/** '자동으로 읽기'를 켰으면, 표현 면이 처음 보일 때 한 번 읽음 */
let spokenKey = '';
function autoSpeak(key, card, shown) {
  if (!prefs.speak || !card?.engText) return;
  const engFirst = DIRECTIONS[study.dir].sides[0] === 'eng';
  if (!engFirst && !shown) return;
  if (key === spokenKey) return;
  spokenKey = key;
  speak(card.engText, targetLang(modeOf(card)).speech);
}

const imagesHTML = (list) => list.map((b) => `<img src="${blobURL(b)}" alt="">`).join('');
const sideOf = (card, side) => ({ side, text: card[`${side}Text`], images: card[`${side}Images`] });
// 사진만 있던 면을 다른 기기에서 받은 경우 (사진은 동기화하지 않음)

function faceBody(s) {

    ${s.text ? `<p class="face-text${s.side === 'eng' ? ' serif' : ''}">${esc(s.text)}</p>` : ''}
    ${s.side === 'eng' ? speakHTML(s.text) : ''}
    ${missingHTML(s)}`;
}
/** 플래시카드 한 장: 정답 전에는 앞면(문제), 뒤집으면 뒷면(정답). 면마다 자기 내용만큼의 크기 */
function flashHTML(card, shown, revealAct) {
  const [a, b] = DIRECTIONS[study.dir].sides;
  const front = sideOf(card, a), back = sideOf(card, b);
  const tag = (side) => `<span class="face-tag">${side === 'kor' ? '뜻' : '표현'}</span>`;
  return `<div class="flash">${shown
    ? `<section class="face back">${tag(b)}${faceBody(back)}${front.text ? `<p class="face-ask">${esc(front.text)}</p>` : ''}</section>`
    : `<section class="face front" data-act="${revealAct}" role="button" aria-label="뒤집어서 정답 보기">${tag(a)}${faceBody(front)}<span class="flip-hint">↻ 눌러서 뒤집기</span></section>`
  }</div>`;
}
const reducedMotion = () => matchMedia('(prefers-reduced-motion: reduce)').matches;
/** 앞면이 옆으로 돌아 사라진 뒤(반 바퀴) done()으로 뒷면을 그림 */
function flipOut(scope, done) {
  const face = $(`${scope} .face.front`);
  if (!face || reducedMotion()) { done(); return; }
  face.classList.add('out');
  setTimeout(done, 170);
}
/** 방금 뒤집었으면 뒷면이 돌아 나오는 모습 */
function flipIn(scope) {
  if (!reducedMotion()) $(`${scope} .face.back`)?.classList.add('in');
}

function dueCards(now) {
  return studyCards()
    .filter((c) => toDate(c.srs.due) <= now)
    .sort((a, b) => toDate(a.srs.due) - toDate(b.srs.due));
}

function renderReview() {
  const now = new Date();
  const due = dueCards(now);
  ui.reviewSig = due.map((c) => c.id).join(',');
  $('#due-count').textContent = ui.reviewStarted && due.length ? `${due.length}장 남음` : '';
  $('#practice-open').disabled = modeCards().length === 0;
  const main = $('#review-main'), bar = $('#review-actions'), filters = $('#review-filters');
  if (!due.length) ui.reviewStarted = false;
  // 복습 중에는 '자유 연습' 대신 '그만하기'
  $('#practice-open').hidden = true;   // 자유 연습은 오늘 홈의 바로가기로
  $('#review-quit').hidden = !ui.reviewStarted;

  if (!modeCards().length) {
    filters.hidden = true;
    main.innerHTML = `<div class="empty">${MASCOT}
      <h2>아직 표현이 없어요</h2>
      <p>카드 탭에서 유튜브에서 본 표현을 추가해 보세요.</p>
      <button class="btn primary" data-act="add">카드 추가하기</button>
    </div>`;
    bar.hidden = true; bar.innerHTML = '';
    return;
  }

  $('#review-title').textContent = ui.reviewStarted ? '복습' : '오늘';
  // 복습 시작을 누른 뒤: 방향·카테고리를 고르고 시작
  if (!ui.reviewStarted && ui.reviewSetup) {
    ui.reviewShow = false; ui.reviewCardId = null;
    filters.hidden = true;
    $('#review-title').textContent = '복습';
    const allDue = modeCards().filter((c) => toDate(c.srs.due) <= now);
    if (!allDue.length) { ui.reviewSetup = false; renderReview(); return; }
    const dueByCat = new Map();
    for (const c of allDue) dueByCat.set(catOf(c), (dueByCat.get(catOf(c)) || 0) + 1);
    main.innerHTML = `<div class="review-hero">${MASCOT}<h2 class="setup-title">${due.length ? `복습할 카드 ${due.length}장` : '고른 카테고리에는 복습할 카드가 없어요'}</h2>
      ${due.length ? '' : '<p class="setup-note">아래에서 다른 카테고리를 골라 주세요.</p>'}</div>${setupHTML(dueByCat)}`;
    bar.hidden = false;
    bar.innerHTML = `<button class="btn primary wide" data-act="review-start" ${due.length ? '' : 'disabled'}>${due.length ? `이대로 시작 · ${due.length}장` : '복습할 카드가 있는 카테고리를 골라 주세요'}</button>
      <button class="btn wide" data-act="review-setup-cancel">돌아가기</button>`;
    return;
  }
  // 시작 전: 오늘 홈 (오늘 링 · 오늘의 대화 · 바로가기, 복습 설정은 복습 시작을 누른 뒤)
  if (!ui.reviewStarted) {
    ui.reviewShow = false; ui.reviewCardId = null;
    filters.hidden = true;
    // 카테고리와 상관없이 지금 복습할 카드 (카테고리별 장수)
    const allDue = modeCards().filter((c) => toDate(c.srs.due) <= now);
    const dueByCat = new Map();
    for (const c of allDue) dueByCat.set(catOf(c), (dueByCat.get(catOf(c)) || 0) + 1);
    const next = modeCards().map((c) => toDate(c.srs.due)).filter((d) => d > now).sort((a, b) => a - b)[0];
    const days = dailyActivity();
    const today = days.get(dayKey(now));
    const name = prefs.talkName ? `${esc(prefs.talkName)}님, ` : '';
    const left = Math.max(0, goalsOn().review - solvedOf(today));
    let line1, line2;
    if (!allDue.length) { line1 = `${name}오늘 복습 끝! ✨`; line2 = next ? `다음 복습은 ${intervalText(next, now)} 뒤예요.` : '새 표현을 추가해 보세요.'; }
    else if (!due.length) { line1 = `${name}복습할 카드 ${allDue.length}장`; line2 = '고른 카테고리에는 없어요. 복습 시작에서 카테고리를 바꿔 보세요.'; }
    else { line1 = `${name}복습할 카드 ${due.length}장`; line2 = left ? `오늘 목표까지 ${left}장 남았어요.` : '오늘 복습 목표는 채웠어요! 👏'; }

async function gradeCard(rating) {
  const card = cards.find((c) => c.id === ui.reviewCardId);
  if (!card) return;
  const now = new Date();
  const { card: next, log } = scheduler.next(card.srs, now, rating);
  card.srs = next;
  card.studyAt = card.updatedAt = Date.now();
  await putCard(card);
  await addReview({ cardId: card.id, ...log });
  ui.sessionDone += 1;
  await recordActivity([reviewActivity(card.id, now)]);
  markChanged();
  ui.reviewShow = false;
  renderReview();
  $('#review-main').scrollTop = 0;
  if (!ui.reviewStarted) toast(`지금 복습할 카드를 다 끝냈어요! ${ui.sessionDone}장 복습했어요 ✨`);
}

// ================= 자유 연습 =================
function pickPractice() {
  const studyList = studyCards();
  if (!studyList.length) { practice.currentId = null; return; }
  const n = Math.min(PRACTICE.recentExclude, studyList.length - 1);
  const recent = practice.recent.filter((id) => studyList.some((c) => c.id === id));
  const excluded = new Set(n > 0 ? recent.slice(-n) : []);
  const candidates = studyList.filter((c) => !excluded.has(c.id));
  const lowest = Math.min(...candidates.map((c) => c.practiceScore));
  const pool = candidates.filter((c) => c.practiceScore === lowest);
  practice.currentId = pool[Math.floor(Math.random() * pool.length)].id;
}

function openPractice() {
  practice.recent = []; practice.solved = 0; practice.show = false; practice.open = true; practice.started = false;
  const el = $('#practice');
  el.innerHTML = `<header class="sheet-head">
      <button class="link start" data-act="practice-close">끝내기</button>
      <h2>자유 연습</h2>
      <span class="head-note" id="practice-solved"></span>
    </header>
    <div class="filters" id="practice-filters"></div>
    <div class="sheet-body" id="practice-body"></div>
    <div class="actions" id="practice-actions"></div>`;
  el.hidden = false;
  renderPractice();
}
function closePractice() {
  if (practice.solved) toast(`${practice.solved}장 연습했어요. 수고했어요!`);
  practice.open = false;
  $('#practice').hidden = true;
  $('#practice').innerHTML = '';
  renderAll();
}

function renderPractice() {
  const card = cards.find((c) => c.id === practice.currentId);
  const body = $('#practice-body'), bar = $('#practice-actions'), filters = $('#practice-filters');
  $('#practice-solved').textContent = practice.solved ? `${practice.solved}장 풀었어요` : '';
  if (!practice.started) {
    filters.hidden = true;
    body.innerHTML = `<h2 class="setup-title">연습할 카드 ${studyCards().length}장</h2>` + setupHTML();
    bar.hidden = false;
    bar.innerHTML = '<button class="btn primary wide" data-act="practice-start">연습 시작</button>';
    return;
  }
  filters.hidden = false;
  filters.innerHTML = studySummaryHTML('practice-stop');
  if (!card) {
    body.innerHTML = `<div class="empty">${MASCOT}<h2>연습할 카드가 없어요</h2><p>카드 탭에서 표현을 먼저 추가해 주세요.</p></div>`;
    bar.hidden = true;
    return;
  }
  const actions = practice.show
    ? `<div class="grades two">
        <button class="grade again" data-act="practice-answer" data-correct="0"><span>틀림</span></button>
        <button class="grade good" data-act="practice-answer" data-correct="1"><span>맞음</span></button>
      </div>`
    : '<button class="btn primary wide" data-act="practice-reveal">정답 보기</button>';
  const catLabel = categoryList().length > 1 ? `${esc(catOf(card))} · ` : '';
  body.innerHTML = `<span class="chip">${catLabel}연습 점수 ${card.practiceScore}</span>
    ${flashHTML(card, practice.show, 'practice-reveal')}`;
  if (practice.flipNow) { practice.flipNow = false; flipIn('#practice-body'); }
  autoSpeak(`p|${card.id}|${practice.solved}|${practice.show && DIRECTIONS[study.dir].sides[0] !== 'eng'}`, card, practice.show);
  bar.hidden = false;
  bar.innerHTML = actions;
}

async function answerPractice(correct) {
  const card = cards.find((c) => c.id === practice.currentId);
  if (!card) return;
  card.practiceScore += correct ? PRACTICE.correct : PRACTICE.wrong;
  card.practiceCount += 1;
  card.studyAt = card.updatedAt = Date.now();
  await putCard(card);
  await recordActivity([{ id: `p|${card.id}|${card.studyAt}`, at: card.studyAt }]);
  markChanged();
  practice.recent.push(card.id);
  if (practice.recent.length > 10) practice.recent.shift();
  practice.solved += 1;
  practice.show = false;
  pickPractice();
  renderPractice();
  $('#practice-body').scrollTop = 0;
}

function rowHTML(c, now, showCat) {
  const thumb = c.korImages[0] || c.engImages[0];
  const count = c.korImages[0] ? c.korImages.length : c.engImages.length;
  let status;
  if (c.srs.reps === 0) status = '<span>새 카드</span>';
  else if (toDate(c.srs.due) <= now) status = '<span class="due-now">지금 복습</span>';
  else if (toDate(c.srs.due) - now < 86400000) status = `<span>${intervalText(c.srs.due, now)} 뒤 복습</span>`;
  else status = `<span>${formatDay(c.srs.due)} 복습</span>`;
  return `<li><button class="row" data-act="edit" data-id="${c.id}">
    ${thumb ? `<span class="thumb"><img src="${blobURL(thumb)}" alt="">${count > 1 ? `<b>${count}</b>` : ''}</span>` : ''}
    <span class="row-text">
      <span class="row-kor">${sideLabel(c.korText, c.korImages)}</span>

const VOICE_MAX_SEC = 30;

function recMime() {

async function startVoice() {
  const e = editor;

  const mime = recMime();
  const recorder = new MediaRecorder(stream, mime ? { mimeType: mime } : undefined);
  Object.assign(rec, { recorder, stream, chunks: [], start: Date.now(), cancelled: false });

    stream.getTracks().forEach((t) => t.stop());
    clearInterval(rec.timer);
    e.recording = false;
    if (rec.cancelled || editor !== e) { if (editor === e) renderEditor(); return; }
    sendVoice(e, new Blob(rec.chunks, { type: recorder.mimeType || mime || 'audio/mp4' }));
  };

  e.found = null; e.checked = null; e.heard = null; e.asked = null;

const VOICE_ERRORS = {
  401: '로그인이 만료됐어요. 다시 로그인해 주세요.',
  413: '녹음이 너무 길어요. 30초 안으로 말해 주세요.',
  422: '말소리를 알아듣지 못했어요. 조금 더 크고 또렷하게 다시 말해 주세요.',

async function sendVoice(e, blob) {

  try {
    const { target, native } = modeParts(e.mode);

    else if (items.length === 1) { e.found = items; e.checked = new Set([0]); useFound(e); message = `입력칸에 채웠어요. 들린 말: “${e.heard}”`; }
    else { e.found = items; e.checked = new Set(e.cardId ? [] : items.map((_, i) => i)); }
  } catch (err) {
    if (err instanceof ScanError) message = err.message;

// ---------- 복숭아와 대화하기: OpenAI 실시간 음성으로 말로 대화 → 끝나면 Claude가 고칠 말·카드 후보 정리 ----------

const TALK_MAX_SEC = 300;    // 한 번 대화 최대 길이 (실제 길이는 Worker가 오늘 남은 시간에 맞춰 정해 줌)

// 아이폰은 누른 순간에 시작한 소리만 허락하므로, 기다림 없이 그 자리에서 <audio>로 바로 틂 (무음 스위치와 상관없이 들림)
let samplePlayer = null;
// r=2: 예전에 조각(Range) 응답 없이 받아 둔 파일이 브라우저에 남아 있어서 주소를 바꿔 새로 받게 함
