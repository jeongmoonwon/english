        <div class="found">${rows.map(([it, i]) => `<button class="found-item" data-act="talk-toggle" data-index="${i}" aria-pressed="${t.checked.has(i)}">
          <span class="check">${t.checked.has(i) ? '✓' : ''}</span>
          <span class="txt">${it.said ? `<span class="${kind === 'fix' ? 'talk-said' : 'talk-said plain'}">${kind === 'translate' ? '내가 한 말: ' : ''}${esc(it.said)}</span>` : ''}<b>${esc(it.expression)}</b><span>${esc(it.meaning)}</span>${it.note ? `<small>💡 ${esc(it.note)}</small>` : ''}</span>
        </button>`).join('')}</div>`;
    };
    body = t.items.length
      ? `<p class="sync-line">카드로 만들 표현을 고르세요.</p>
        ${group('fix', '✏️ 내가 한 말, 이렇게 고쳐요')}
        ${group('translate', `🌏 이건 ${learnName}로 이렇게 말해요`)}
        ${group('mooni', `💬 ${josa(botName(), '이', '가')} 쓴 좋은 표현`)}
        ${group('topic', `✨ 오늘 화제에서 나온 표현`)}${log}`
      : `<div class="talk-hero">${MASCOT}<b>고칠 데가 없었어요! 👏</b><p>다음엔 조금 더 길게 이야기해 봐요.</p></div>${log}`;
    actions = t.items.length
      ? `<button class="btn primary wide" data-act="talk-cards" ${n ? '' : 'disabled'}>${n ? `고른 ${n}개 카드로 만들기` : '만들 표현을 골라 주세요'}</button>`
      : '<button class="btn primary wide" data-act="talk-reset">새 대화</button>';
    if (t.items.length) actions += '<button class="btn wide" data-act="talk-reset">카드 안 만들고 새 대화</button>';
  }
  if (t.status === 'live') actions += '<button class="btn wide" data-act="talk-reset">그만하기 (정리 안 함)</button>';
  $('#talk-main').innerHTML = body;
  const bar = $('#talk-actions');
  bar.hidden = !actions;
  bar.innerHTML = actions;
  const b = $('#talk-main');
  if (t.status === 'live' || t.status === 'reviewing') b.scrollTop = b.scrollHeight;
}

/** 말소리 → 글자가 순서대로 들어오도록 item_id로 자리를 먼저 잡아 둠 */
function talkTurn(id, role) {
  let x = talk.turns.find((v) => v.id === id);
  if (!x) { x = { id, role, text: '' }; talk.turns.push(x); }
  return x;
}
function onTalkEvent(ev) {
  const t = talk;
  if (ev.type === 'input_audio_buffer.committed') talkTurn(ev.item_id, 'user');   // 순서만 잡아 둠 (글자가 오기 전엔 안 보임)
  else if (ev.type === 'conversation.item.input_audio_transcription.completed') {
    const text = (ev.transcript || '').trim();
    if (text) talkTurn(ev.item_id, 'user').text = text;
    else t.turns = t.turns.filter((v) => v.id !== ev.item_id);   // 소음이었으면 지움
  }
  else if (ev.type === 'conversation.item.input_audio_transcription.failed') t.turns = t.turns.filter((v) => v.id !== ev.item_id);
  else if (ev.type === 'response.output_audio_transcript.delta') { talkTurn(ev.item_id, 'assistant').text += ev.delta || ''; t.speaking = true; }
  else if (ev.type === 'response.output_audio_transcript.done') talkTurn(ev.item_id, 'assistant').text = ev.transcript || '';
  else if (ev.type === 'response.done') t.speaking = false;
  else if (ev.type === 'error') { console.warn('talk error', ev.error); return; }
  else return;
  renderTalk();
}

async function startTalk(topic = null) {
  if (!user || talk.status !== 'idle') return;
  const t = talk;
  t.mode = prefs.mode;
  t.turns = [];
  t.topic = topic;
  // 아이폰: 소리 재생과 마이크는 버튼을 누른 그 순간에 준비해야 함
  t.audio = new Audio();
  t.audio.autoplay = true;
  t.audio.setAttribute('playsinline', '');
  t.status = 'connecting';
  renderTalk();
  try {
    // 에코 제거: 스피커로 나온 복숭아 목소리가 마이크로 다시 들어가 내 말로 잡히지 않게
    try { t.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true, autoGainControl: true } }); }
    catch { throw new ScanError('마이크를 쓸 수 없어요. 휴대폰 설정에서 마이크 권한을 허용해 주세요.'); }
    const { target, native } = modeParts(t.mode);
    // 오늘 복습할 표현을 대화 중에 써 볼 수 있게 함께 보냄
    const practiceList = dueCards(new Date()).filter((c) => modeOf(c) === t.mode).slice(0, 5).map((c) => c.engText);
    const res = await fetch(talkURL('/talk/token'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await user.getIdToken()}` },
      body: JSON.stringify({ target, native, practice: practiceList, voice: prefs.talkVoice, name: prefs.talkName, botName: prefs.talkBotName, topic: t.topic && { ...t.topic, expressions: (t.topic.expressions || []).map((e) => e.expression ?? e) } }),
    });
    const data = await res.json().catch(() => ({}));
    if (typeof data.remainingSec === 'number') talkLeftSec = data.remainingSec;
    if (!res.ok || !data.value) throw new ScanError(TALK_ERRORS[res.status] || `${josa(botName(), '을', '를')} 부르지 못했어요. 잠시 뒤 다시 시도해 주세요.`);
    t.maxSec = Number(data.seconds) || TALK_MAX_SEC;
    t.reservation = data.reservation;
    if (talk !== t) { t.stream.getTracks().forEach((x) => x.stop()); return; }

    const pc = new RTCPeerConnection();
    t.pc = pc;
    pc.ontrack = (ev) => { t.audio.srcObject = ev.streams[0]; t.audio.play().catch(() => {}); };
    pc.addTrack(t.stream.getTracks()[0]);
    const dc = pc.createDataChannel('oai-events');
    t.dc = dc;
    dc.onmessage = (m) => { try { onTalkEvent(JSON.parse(m.data)); } catch {} };
    dc.onopen = () => dc.send(JSON.stringify({ type: 'response.create' }));   // 대화 상대가 먼저 말 걸기
    const offer = await pc.createOffer();
    await pc.setLocalDescription(offer);
    const sdp = await fetch('https://api.openai.com/v1/realtime/calls', {
      method: 'POST', body: offer.sdp,
      headers: { Authorization: `Bearer ${data.value}`, 'Content-Type': 'application/sdp' },
    });
    if (!sdp.ok) throw new Error(`연결 ${sdp.status}`);
    await pc.setRemoteDescription({ type: 'answer', sdp: await sdp.text() });
    if (talk !== t) { hangUp(t); return; }
    t.status = 'live';
    t.start = Date.now();
    t.timer = setInterval(() => {
      const left = t.maxSec - Math.floor((Date.now() - t.start) / 1000);
      const el = $('#talk-left');
      if (el) el.textContent = `${Math.floor(Math.max(0, left) / 60)}:${String(Math.max(0, left) % 60).padStart(2, '0')}`;
      if (left <= 0) endTalk();
    }, 500);
    renderTalk();
  } catch (err) {
    hangUp(t);
    if (talk !== t) return;
    t.status = 'idle';
    renderTalk();
    toast(err instanceof ScanError ? err.message : `${josa(botName(), '을', '를')} 부르지 못했어요. (${errText(err)})`);
  }
}
function hangUp(t = talk) {
  clearInterval(t.timer);
  reportTalkEnd(t);
  try { t.dc?.close(); } catch {}
  try { t.pc?.close(); } catch {}
  t.stream?.getTracks().forEach((x) => x.stop());
  if (t.audio) t.audio.srcObject = null;
  t.pc = t.dc = t.stream = null;
}
/** 대화를 끝내면 실제로 쓴 시간을 서버에 알려 남은 시간을 돌려받음 (한 번만) */
function reportTalkEnd(t) {
  if (!t.reservation || !user) return;
  const reservation = t.reservation;
  t.reservation = null;
  const seconds = t.start ? Math.round((Date.now() - t.start) / 1000) : 0;
  user.getIdToken().then((tok) => fetch(talkURL('/talk/end'), {
    method: 'POST', keepalive: true,
    headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${tok}` },
    body: JSON.stringify({ reservation, seconds }),
  })).then((r) => r.json()).then((d) => { if (typeof d.remainingSec === 'number') { talkLeftSec = d.remainingSec; renderTalk(); } }).catch(() => {});
}
async function endTalk() {
  const t = talk;
  if (t.status !== 'live') return;
  hangUp(t);
  const turns = t.turns.filter((x) => x.text).map((x) => ({ role: x.role, text: x.text }));
  if (!turns.some((x) => x.role === 'user')) { t.status = 'idle'; t.turns = []; renderTalk(); toast('말한 내용이 없어서 정리할 게 없어요.'); return; }
  // 기록 탭 캘린더에 대화한 날로 남김 (t=대화)
  const talkSec = Math.min(t.maxSec || TALK_MAX_SEC, Math.max(1, Math.round((Date.now() - t.start) / 1000)));
  await recordActivity([{ id: `t|${t.start}|${talkSec}`, at: t.start }]);
  markTalked(t.topic);   // 이 일정은 다음부터 다시 묻지 않음
  markChanged();
  t.status = 'reviewing';
  renderTalk();
  try {
    const { target, native } = modeParts(t.mode);
    const res = await fetch(talkURL('/talk/review'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await user.getIdToken()}` },
      body: JSON.stringify({ turns, target, native }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new ScanError(TALK_ERRORS[res.status] || '대화를 정리하지 못했어요.');
    t.items = Array.isArray(data.items) ? data.items : [];
    // 관심사 화제로 한 대화면 화제 카드의 표현도 함께
    if (t.topic?.kind === 'interest') for (const e of t.topic.expressions || []) {
      if (!t.items.some((x) => x.expression.toLowerCase() === e.expression.toLowerCase())) t.items.push({ kind: 'topic', said: '', expression: e.expression, meaning: e.meaning, note: '' });
    }
    t.checked = new Set(t.items.map((_, i) => i));
  } catch (err) {
    t.items = [];
    t.checked = new Set();
    toast(err instanceof ScanError ? err.message : `대화를 정리하지 못했어요. (${errText(err)})`);
  }
  if (talk !== t) return;
  t.status = 'result';
  renderTalk();
}
/** 고른 표현으로 새 표현 화면을 채워서 엶 (카테고리 고르고 저장은 평소처럼) */
function talkToCards() {
  const t = talk;
  const items = t.items.filter((_, i) => t.checked.has(i)).map((it) => ({ expression: it.expression, meaning: it.meaning, note: it.note }));
  if (!items.length) return;
  talk = { status: 'idle', turns: [] };
  renderTalk();
  openEditor();
  editor.source = 'talk';   // 저장하면 카드에 '대화에서' 표시
  editor.found = items;
  editor.checked = new Set(items.map((_, i) => i));
  useFound(editor);
  renderEditor();
}

// ---------- 구글 캘린더 (설정에서 '구글 캘린더 연결'을 고른 사람만) ----------
// 서버가 오늘·내일 일정의 제목과 시각만 줌. 기기에도 서버에도 저장하지 않고 화면을 그릴 때만 씀
const cal = { events: null, at: 0, loading: false };
async function loadCalendar(force = false) {
  if (!prefs.calendar || !user || !SCAN_URL || cal.loading) return;
  if (!force && cal.events && Date.now() - cal.at < 10 * 60000) return;
  cal.loading = true;
  try {
    const from = new Date(); from.setHours(0, 0, 0, 0); from.setDate(from.getDate() - 2);
    const to = new Date(); to.setHours(0, 0, 0, 0); to.setDate(to.getDate() + 2);
    const res = await fetch(talkURL('/calendar/events'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await user.getIdToken()}` },
      body: JSON.stringify({ from: from.toISOString(), to: to.toISOString() }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(res.status);
    if (data.connected === false) { setPref('calendar', false); cal.events = null; toast('구글 캘린더 연결이 끊겼어요. 설정에서 다시 연결할 수 있어요.'); }
    else { cal.events = Array.isArray(data.events) ? data.events : []; cal.at = Date.now(); cal.needReconnect = !!data.needReconnect; }
  } catch {
    cal.at = Date.now();   // 실패해도 10분 동안은 다시 묻지 않음
    cal.events ??= [];
  } finally {
    cal.loading = false;
  }
  if (!ui.reviewStarted) renderReview();
  renderTalk();
  if (ui.tab === 'settings' && ui.settingsPage === 'talk') renderSettingsPage('talk');
}
const timeText = (d) => d.toLocaleTimeString('ko-KR', { hour: 'numeric', ...(d.getMinutes() ? { minute: '2-digit' } : {}) });
// 이미 얘기한 일정 (이 기기에만, 5일 지나면 지움): 같은 일정을 또 묻지 않으려고
const TALKED_KEY = 'freedom-talked-topics';
function talkedTopics() {
  try {
    const list = JSON.parse(localStorage.getItem(TALKED_KEY)) || {};
    const cut = Date.now() - 5 * 86400000;
    for (const k of Object.keys(list)) if (list[k] < cut) delete list[k];
    return list;
  } catch { return {}; }
}
function markTalked(topic) {
  if (!topic?.key) return;
  const list = talkedTopics();
  list[topic.key] = Date.now();
  try { localStorage.setItem(TALKED_KEY, JSON.stringify(list)); } catch {}
}
/** 오늘의 대화 후보 (넘겨 가며 고름): 오늘 끝난 일정 → 어제·그저께 일정 중 아직 얘기 안 한 것 → 오늘 남은 일정 → 내일 일정. 이미 얘기한 일정은 뺌 */
function calTopics() {
  if (!prefs.calendar || !cal.events?.length) return [];
  const now = new Date();
  const dayName = (key) => {
    for (const [n, label] of [[0, '오늘'], [-1, '어제'], [-2, '그저께'], [1, '내일']]) { const d = new Date(now); d.setDate(d.getDate() + n); if (dayKey(d) === key) return label; }
    return '';
  };
  const talked = talkedTopics();
  const evs = cal.events.map((e) => {
    const sd = new Date(e.start), ed = new Date(e.end);
    const day = e.allDay ? String(e.start).slice(0, 10) : dayKey(sd);
    const label = dayName(day);
    return { ...e, sd, ed, day, label, key: `${e.title}|${e.start}`, when: e.allDay ? label : `${label} ${timeText(sd)}` };
  }).filter((e) => e.label && !talked[e.key]);
  const today = dayKey(now);
  const pick = (e, kind) => ({ kind, title: e.title, when: e.when, key: e.key });
  const out = [];
  // 오늘 끝난 일정 (최근 것부터)
  evs.filter((e) => !e.allDay && e.day === today && e.ed <= now).sort((x, y) => y.ed - x.ed).forEach((e) => out.push(pick(e, 'plan-after')));
  // 어제·그저께 일정 (하루 종일 포함, 최근 것부터)
  evs.filter((e) => e.day < today).sort((x, y) => y.sd - x.sd).forEach((e) => out.push(pick(e, 'plan-after')));
  // 오늘 남은 일정, 오늘 하루 종일
  evs.filter((e) => !e.allDay && e.day === today && e.sd > now).sort((x, y) => x.sd - y.sd).forEach((e) => out.push(pick(e, 'plan-before')));
  evs.filter((e) => e.allDay && e.day === today).forEach((e) => out.push(pick(e, 'plan-before')));
  // 내일 일정
  evs.filter((e) => e.day > today).sort((x, y) => x.sd - y.sd).forEach((e) => out.push(pick(e, 'plan-before')));
  return out.slice(0, 6);
}
/** 오늘의 대화 카드 한 장. topic이 없으면 그냥 수다 */

    <p>${josa(bot, '이', '가')} 먼저 말을 걸어요. 한 번에 최대 ${TALK_MAX_SEC / 60}분 말로 수다 떨고, 끝나면 표현을 카드로 챙겨요.${prefs.calendar || where !== 'talk' ? '' : ' 설정에서 구글 캘린더를 연결하면 일정으로 말을 걸어요.'}</p>
    <span class="talk-go">${icon('chat')} ${josa(bot, '이랑', '랑')} 대화하기 ›</span>
  </section>`;
}
/** 오늘의 대화 카드들: 일정 후보가 있으면 옆으로 넘겨 보고, 맨 끝은 그냥 수다 */
function talkCardsHTML(where) {

// ---------- 관심사 화제 (설정에서 관심사를 넣은 사람만) ----------
// 서버가 새벽에 미리 찾아 둔 오늘 화제를 받아 옴. 이 기기에는 오늘 날짜·언어 모드와 함께 저장해 두고 다시 묻지 않음
const INT_CACHE_KEY = 'freedom-int-topics', INT_VOTE_KEY = 'freedom-int-votes';
const intState = { data: null, loading: false, failedAt: 0 };
const intSaved = new Set();   // 이번에 ＋로 카드로 저장한 표현
function intVotes() { try { return JSON.parse(localStorage.getItem(INT_VOTE_KEY)) || {}; } catch { return {}; } }
function setIntVote(key, v) {
  const all = intVotes();
  if (all[key] === v) delete all[key]; else all[key] = v;
  const keys = Object.keys(all);
  for (const k of keys.slice(0, Math.max(0, keys.length - 200))) delete all[k];   // 오래된 것부터 정리
  try { localStorage.setItem(INT_VOTE_KEY, JSON.stringify(all)); } catch {}
}
async function loadInterestTopics(force = false) {
  if (!user || !SCAN_URL || !(prefs.interests || []).length || intState.loading) return;
  const day = dayKey(new Date());
  if (!force) {
    if (intState.data?.day === day && intState.data.mode === prefs.mode) return;
    try {
      const c = JSON.parse(localStorage.getItem(INT_CACHE_KEY));
      if (c?.day === day && c.mode === prefs.mode && c.sig === prefs.interests.join('|')) { intState.data = c; return; }
    } catch {}
    if (Date.now() - intState.failedAt < 5 * 60000) return;
  }
  intState.loading = true;
  try {
    const { target, native } = modeParts(prefs.mode);
    const res = await fetch(talkURL('/interest/topics'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await user.getIdToken()}` },
      body: JSON.stringify({ target, native }),
    });
    const data = await res.json().catch(() => ({}));
    if (!res.ok) throw new Error(res.status);
    intState.data = { day, mode: prefs.mode, sig: prefs.interests.join('|'), topics: Array.isArray(data.topics) ? data.topics : [] };
    try { localStorage.setItem(INT_CACHE_KEY, JSON.stringify(intState.data)); } catch {}
  } catch {
    intState.failedAt = Date.now();
  } finally {
    intState.loading = false;
  }
  if (!ui.reviewStarted) renderReview();
  renderTalk();
}
/** 오늘 보여 줄 관심사 화제 (관심사마다 하나, 👎했거나 이미 얘기한 건 다음 후보로) */
function interestTopics() {
  if (!(prefs.interests || []).length || !intState.data?.topics) return [];
  const talked = talkedTopics(), votes = intVotes();
  return intState.data.topics.map((g) => {
    const it = (g.items || []).find((x) => !talked[`int|${x.title}`] && votes[`int|${x.title}`] !== 'down');
    return it && { kind: 'interest', interest: g.interest, title: it.title, summary: it.summary, fact: it.kind === 'fact', expressions: it.expressions || [], url: it.url, source: it.source,
      key: `int|${it.title}`, when: `관심사 · ${g.interest}` };
  }).filter(Boolean).slice(0, 2);
}
async function saveInterests(list) {
  setPref('interests', list);
  intState.data = null;
  try { localStorage.removeItem(INT_CACHE_KEY); } catch {}
  if (ui.tab === 'settings') renderSettingsPage('talk');
  if (!user) return;
  try {
    const { target, native } = modeParts(prefs.mode);
    await fetch(talkURL('/interest/save'), {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await user.getIdToken()}` },
      body: JSON.stringify({ interests: list, target, native }),
    });
  } catch { toast('관심사를 저장하지 못했어요. 인터넷 연결을 확인해 주세요.'); }
}
/** 로그인하면 서버의 관심사를 가져옴 (다른 기기에서 넣은 것도) */
async function syncInterests() {
  if (!user || !SCAN_URL) return;
  try {
    const res = await fetch(talkURL('/interest/get'), { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${await user.getIdToken()}` }, body: '{}' });
    const data = await res.json();
    if (Array.isArray(data.interests) && data.interests.join('|') !== (prefs.interests || []).join('|')) {
      if (data.interests.length || !(prefs.interests || []).length) { setPref('interests', data.interests); intState.data = null; }
      else saveInterests(prefs.interests);   // 이 기기에만 있던 관심사는 서버로
    }
  } catch {}
  loadInterestTopics();
}
function addInterest(name) {
  const v = String(name || '').trim().slice(0, 30);
  const list = prefs.interests || [];
  if (!v) return;
  if (list.some((x) => x.toLowerCase() === v.toLowerCase())) { toast('이미 있는 관심사예요.'); return; }
  if (list.length >= 5) { toast('관심사는 5개까지 넣을 수 있어요.'); return; }
  saveInterests([...list, v]);
}
/** 화제 카드의 표현을 바로 카드로 저장 */
async function saveTopicExpression(topic, e) {
  if (intSaved.has(e.expression)) return;
  const card = newCard({ korText: e.meaning, engText: e.expression, korImages: [], engImages: [], category: await keyForName(DEFAULT_CATEGORY), source: 'talk' });
  await putCard(card);
  await recordActivity([addActivity(card)]);
  intSaved.add(e.expression);
  markChanged();
  renderAll();
  toast(`'${e.expression}' 카드로 저장했어요.`);
}

/** 구글 허락 화면에서 돌아온 경우 (#calendar=connected | denied | error) */
function handleCalendarReturn() {
  const m = /[#&]calendar=(\w+)/.exec(location.hash);

  if (m[1] === 'connected') { setPref('calendar', true); cal.events = null; toast('구글 캘린더를 연결했어요. 이제 일정으로 말을 걸어요.'); }
  else toast(m[1] === 'denied' ? '캘린더 연결을 취소했어요.' : '캘린더를 연결하지 못했어요. 잠시 뒤 다시 시도해 주세요.');
}

class ScanError extends Error {}   // 사용자에게 그대로 보여 줄 안내
const SCAN_ERRORS = {
  401: '로그인이 만료됐어요. 다시 로그인해 주세요.',
  413: '사진이 너무 커요. 다른 사진으로 해 주세요.',
  422: '이 사진은 읽을 수 없어요. 다른 사진으로 해 주세요.',
  429: '오늘 쓸 수 있는 10장을 모두 썼어요. 내일 다시 쓸 수 있어요.',   // 남은 장수가 있으면 scanPhotos에서 따로 안내
  503: '지금 요청이 많아요. 잠시 뒤 다시 시도해 주세요.',
};
async function scanPhotos(files) {
  if (!editor || !user || editor.loading) return;
  const e = editor;
  if (files.length > SCAN_MAX) {
    toast(`한 번에 ${SCAN_MAX}장까지 읽을 수 있어요. 앞의 ${SCAN_MAX}장만 읽을게요.`);
    files = files.slice(0, SCAN_MAX);
  }
  if (scanRemaining !== null && files.length > scanRemaining) {
    toast(scanRemaining ? `오늘 남은 횟수는 ${scanRemaining}장이에요. ${scanRemaining}장 이하로 골라 주세요.` : SCAN_ERRORS[429]);
    return;
  }
  e.scanCount = files.length;
  e.busy = 'scan';
  e.loading += 1;
  e.found = null;
  e.checked = null;
  e.heard = null;
  e.asked = null;
  e.scanStart = Date.now();
  clearInterval(scanTimer);
  scanTimer = setInterval(() => {
    const el = $('#scan-secs');
    if (el) el.textContent = Math.floor((Date.now() - e.scanStart) / 1000);
  }, 1000);
  setScanStage(e, 0);
  let message = null;
  try {
    const blobs = (await Promise.all(files.map(compressImage))).filter(Boolean);
    if (!blobs.length) throw new ScanError('사진을 열지 못했어요. 다른 사진으로 해 주세요.');
    if (blobs.length < files.length) toast(`사진 ${files.length - blobs.length}장은 열지 못해서 빼고 읽을게요.`);
    setScanStage(e, 1);
    const images = await Promise.all(blobs.map(async (b) => ({ data: await blobBase64(b), mediaType: b.type || 'image/jpeg' })));
    const { target, native } = modeParts(e.mode);
    const body = JSON.stringify({ images, target, native });
    const token = await user.getIdToken();
    // 사진이 다 올라갈 즈음(작은 사진이라 금방) '표현 찾기'로 넘김
    const reading = setTimeout(() => setScanStage(e, 2), 700);
    let res;
    try {
      res = await fetch(`${SCAN_URL.replace(/\/$/, '')}/scan`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body,
      });
    } finally {
      clearTimeout(reading);
    }
    const data = await res.json().catch(() => ({}));
    if (typeof data.remaining === 'number') scanRemaining = data.remaining;
    if (res.status === 429 && data.remaining > 0) throw new ScanError(`오늘 남은 횟수는 ${data.remaining}장이에요. ${data.remaining}장 이하로 골라 주세요.`);
    if (!res.ok) throw new ScanError(SCAN_ERRORS[res.status] || '사진을 읽지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    if (editor !== e) return;   // 그 사이 편집 화면을 닫은 경우
    const items = Array.isArray(data.items) ? data.items : [];
    if (!items.length) message = '사진에서 외국어 표현을 찾지 못했어요.';
    else if (items.length === 1) { e.found = items; e.checked = new Set([0]); useFound(e); message = '입력칸에 채웠어요. 고쳐서 저장하세요.'; }
    else {
      e.found = items;
      // 사진에 직접 표시한 표현은 미리 고름 (수정 중에는 직접 하나 고름)
      e.checked = new Set(e.cardId ? [] : items.flatMap((it, i) => ((it.marked ?? data.marked) ? [i] : [])));
    }
  } catch (err) {
    if (err instanceof ScanError) message = err.message;
    else if (navigator.onLine === false) message = '인터넷에 연결되어 있지 않아요.';
    else message = `사진을 읽지 못했어요. (${errText(err)})`;
  } finally {
    clearInterval(scanTimer);
    e.loading -= 1;
    e.scanStage = null;
    e.busy = null;
    if (editor === e) renderEditor();
  }
  if (message) toast(message);
}
/** 고른 표현을 입력칸에 넣음: 빈 입력 묶음부터 채우고, 모자라면 새로 만듦 (수정 중에는 그 카드 하나에) */
function useFound(e) {
  const picked = e.found.filter((_, i) => e.checked.has(i)).map((it) => ({ korText: it.meaning, engText: it.expression, note: it.note || '' }));
  if (!picked.length) return;
  if (e.cardId) {
    e.entries[0] = { ...picked[0], category: e.entries[0].category };
  } else {
    for (const en of picked) {
      const slot = e.entries.findIndex((x) => entryState(e, x) === 'empty');
      if (slot >= 0) e.entries[slot] = { ...en, category: e.entries[slot].category };
      else e.entries.push({ ...en, category: e.entries[e.entries.length - 1].category });
    }
  }
  e.found = null;
  e.checked = null;
}
/** 새 카테고리 칸의 이름을 목록에 칩으로 넣고 그 카드에 고름 (카드를 저장할 때 실제로 생김) */
function addCategory() {
  const e = editor;
  const input = $('#cat-input');
  if (!e || e.catInput === null || !input) return;
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const exists = categoryList().some((c) => c.name === name) || e.newCats.includes(name);
  if (!exists) e.newCats.push(name);
  e.entries[e.catInput].category = name;
  e.popCat = exists ? null : name;
  e.catInput = null;
  renderEditor();
  if (exists) toast(`'${name}' 카테고리를 골랐어요.`);
}
function newCard(fields) {
  const now = new Date();
  const t = now.getTime();
  const card = { id: uid(), createdAt: now, contentAt: t, studyAt: t, updatedAt: t, lang: prefs.mode, ...fields, srs: createEmptyCard(now), practiceScore: 0, practiceCount: 0 };
  cards.push(card);
  return card;
}

async function saveEditor() {
  if (!editorValid()) return;
  const e = editor;
  const list = fullEntries(e);
  if (e.cardId) {
    const card = cards.find((c) => c.id === e.cardId);
    const t = Date.now();
    Object.assign(card, {
      korText: list[0].korText.trim(), engText: list[0].engText.trim(),
      korImages: e.korImages, engImages: e.engImages, category: await keyForName(list[0].category), contentAt: t, updatedAt: t,
    });
    await putCard(card);
  } else {
    const added = [];
    for (const en of list) {
      const card = newCard({ korText: en.korText.trim(), engText: en.engText.trim(), korImages: [], engImages: [], category: await keyForName(en.category), ...(e.source ? { source: e.source } : {}) });
      await putCard(card);
      added.push(card);
    }
    await recordActivity(added.map(addActivity));
  }
  markChanged();
  closeEditor();
  renderAll();
  requestPersist();
  toast(e.cardId ? '수정했어요.' : list.length > 1 ? `표현 ${list.length}개를 추가했어요.` : '추가했어요.');
}

async function deleteFromEditor() {
  const id = editor?.cardId;
  if (!id || !confirm('이 표현과 복습 기록을 삭제할까요?')) return;
  await removeCard(id);
  cards = cards.filter((c) => c.id !== id);
  syncMeta.deleted[id] = Date.now();
  markChanged();
  closeEditor();
  renderAll();
  toast('삭제했어요.');
}

// ================= Firebase 동기화 =================
// 이 기기(IndexedDB)가 원본이고, Firebase는 같은 계정의 기기들이 함께 쓰는 사본.
// Firestore: users/<uid>/cards, categories, reviews, activity (문서마다 syncAt = 서버 저장 시각)
// 사진은 올리지 않음: 각 기기에만 있고, 다른 기기에는 글과 학습 기록만 넘어감.
// 받기는 지난번 이후 syncAt이 바뀐 문서만, 올리기는 지난번 올린 뒤 이 기기에서 바뀐 것만.
// 병합은 카드 단위로, 내용(글·카테고리, contentAt)과 학습 기록(복습 일정·연습 점수, studyAt)을
// 따로 비교해 각각 더 나중에 바뀐 쪽을 씀. 그래서 한 기기에서 고치고 다른 기기에서 복습해도 둘 다 남음.
// 삭제는 카드 문서를 deletedAt만 남긴 문서로 바꿔서 알림.
const fbReady = !!FIREBASE.apiKey;
const fbApp = fbReady ? fb.initializeApp(FIREBASE) : null;
const fbAuth = fbReady ? fb.initializeAuth(fbApp, { persistence: [fb.indexedDBLocalPersistence, fb.browserLocalPersistence] }) : null;
const fstore = fbReady ? fb.getFirestore(fbApp) : null;
let user = null;                         // 로그인한 Firebase 사용자

// IndexedDB meta에 저장. uid: 마지막으로 동기화한 계정, pulledAt: 받은 문서 중 가장 늦은 syncAt(서버 시각),
// pushedAt: 마지막으로 올리기 시작한 시각(이 기기 시각)
const syncMeta = { seq: 0, syncedSeq: 0, deleted: {}, lastSyncAt: 0, uid: null, pulledAt: 0, pushedAt: 0 };
const sync = { running: false, again: false, timer: null, error: null };

const contentAt = (c) => c.contentAt ?? 0;
const studyAt = (c) => c.studyAt ?? 0;
const touchedAt = (c) => Math.max(contentAt(c), studyAt(c));
const pendingCount = () => Math.max(0, syncMeta.seq - syncMeta.syncedSeq);
const saveSyncMeta = () => putMeta('sync', { ...syncMeta });
const plain = (o) => JSON.parse(JSON.stringify(o));   // Date → 글자, undefined 값은 뺌
const userCol = (name) => fb.collection(fstore, 'users', user.uid, name);
const userDoc = (name, id) => fb.doc(fstore, 'users', user.uid, name, id);
const catDocId = (key) => `k${encodeURIComponent(key)}`;
const reviewKey = (r) => `${r.cardId}|${toDate(r.review).getTime()}`;

/** 로컬에서 무언가 바뀌었을 때: 기록해 두고 잠시 뒤 올림 */
function markChanged() {
  syncMeta.seq += 1;
  saveSyncMeta().catch(() => {});
  renderSyncStatus();
  scheduleSync();
}
function scheduleSync(delay = 3000) {
  clearTimeout(sync.timer);
  if (!user) return;
  sync.timer = setTimeout(() => syncNow(), delay);
}

// ----- 로그인 (아이폰 홈 화면 앱에서도 되도록 팝업 대신 페이지 이동 방식) -----
// Google에서 받은 토큰으로 Firebase에 로그인하면, 이후로는 Firebase가 로그인을 유지해 줌
const redirectUri = () => new URL('./', location.href).href;
function startLogin() {
  const state = uid();
  try { localStorage.setItem(OAUTH_STATE_KEY, state); } catch {}
  const params = new URLSearchParams({
    client_id: GOOGLE.clientId,
    redirect_uri: redirectUri(),
    response_type: 'token',
    scope: GOOGLE.scope,
    prompt: 'select_account',
    state,
  });
  location.assign(`https://accounts.google.com/o/oauth2/v2/auth?${params}`);
}
/** 로그인하고 돌아왔으면 주소의 #access_token으로 Firebase 로그인. 반환: 'ok' | { error } | null */
async function handleOAuthReturn() {
  if (!/[#&]state=/.test(location.hash)) return null;
  const p = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  let saved = null;
  try {
    saved = localStorage.getItem(OAUTH_STATE_KEY);
    localStorage.removeItem(OAUTH_STATE_KEY);
  } catch {}
  if (!saved || p.get('state') !== saved) return null;
  if (!p.get('access_token')) return { error: p.get('error') || 'unknown' };
  if (!fbReady) return { error: 'Firebase 설정이 비어 있어요' };
  try {
    await fb.signInWithCredential(fbAuth, fb.GoogleAuthProvider.credential(null, p.get('access_token')));
    return 'ok';
  } catch (err) {
    return { error: err.code || errText(err) };
  }
}
async function logout() {
  if (!confirm('로그아웃할까요? 이 기기의 카드는 그대로 남고, 저장된 데이터도 지워지지 않아요.')) return;
  clearTimeout(sync.timer);
  await fb.signOut(fbAuth).catch(() => {});
  toast('로그아웃했어요.');
}
/** 서버에 저장된 이 계정의 데이터와 계정을 모두 지움. 이 기기의 카드는 남김 */
async function deleteAccount() {
  if (!user || sync.running) return;
  if (!confirm('계정을 삭제할까요? 서버에 저장된 카드와 기록이 모두 지워지고 되돌릴 수 없어요. 이 기기의 카드는 그대로 남아요.')) return;
  clearTimeout(sync.timer);
  sync.running = true;
  renderSyncStatus();
  try {
    for (const name of ['cards', 'categories', 'reviews', 'activity']) {
      const snap = await fb.getDocs(userCol(name));
      for (let i = 0; i < snap.docs.length; i += 400) {
        const batch = fb.writeBatch(fstore);
        snap.docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
        await batch.commit();
      }
    }
    Object.assign(syncMeta, { uid: null, pulledAt: 0, pushedAt: 0 });
    await saveSyncMeta();
    await fb.deleteUser(user);
    toast('계정과 서버의 데이터를 삭제했어요.');
  } catch (err) {
    if (err.code === 'auth/requires-recent-login') {
      alert('서버의 데이터는 지웠어요. 계정을 지우려면 보안을 위해 한 번 더 로그인한 뒤 다시 눌러 주세요.');
      startLogin();
    } else {
      toast(`삭제하지 못했어요. (${errText(err)})`);
    }
  } finally {
    sync.running = false;
    renderSyncStatus();
  }
}

/** 지난번 이후 바뀐 문서 받기. 반환: { docs, maxAt(ms) } */
async function pullChanges(name, since) {
  const docs = [];
  let maxAt = since, last = null;
  for (;;) {
    const parts = [fb.where('syncAt', '>', fb.Timestamp.fromMillis(since)), fb.orderBy('syncAt')];
    if (last) parts.push(fb.startAfter(last));
    const snap = await fb.getDocs(fb.query(userCol(name), ...parts, fb.limit(500)));
    for (const d of snap.docs) {
      const data = d.data();
      if (data.syncAt) maxAt = Math.max(maxAt, data.syncAt.toMillis());
      delete data.syncAt;
      docs.push(data);
    }
    if (snap.size < 500) break;
    last = snap.docs[snap.size - 1];
  }
  return { docs, maxAt };
}

async function runSync() {
  // 0. 다른 계정으로 바뀌었으면 처음부터 받고 이 기기의 데이터를 모두 올림
  if (syncMeta.uid !== user.uid) {
    Object.assign(syncMeta, { uid: user.uid, pulledAt: 0, pushedAt: 0 });
  }

  // 1. 서버에서 바뀐 것 받기
  const since = syncMeta.pulledAt || 0;
  const pulled = {};
  let pulledAt = since;
  for (const name of ['cards', 'categories', 'reviews', 'activity']) {
    const { docs, maxAt } = await pullChanges(name, since);
    pulled[name] = docs;
    pulledAt = Math.max(pulledAt, maxAt);
  }
  const rCards = {}, rDeleted = {};
  for (const d of pulled.cards) {
    if (d.deletedAt) rDeleted[d.id] = d.deletedAt;
    else rCards[d.id] = d;
  }
  let localChanged = false;

  // 2. 삭제 합치기: 삭제 시각 이후에 바뀐 적 없는 카드는 지움
  const deleted = { ...syncMeta.deleted };
  for (const [id, ts] of Object.entries(rDeleted)) deleted[id] = Math.max(deleted[id] || 0, ts);
  const isDead = (id, at) => id in deleted && deleted[id] >= at;
  for (const local of [...cards]) {
    if (isDead(local.id, touchedAt(local)) && editor?.cardId !== local.id) {
      await removeCard(local.id);
      cards = cards.filter((c) => c !== local);
      localChanged = true;
    }
  }
  syncMeta.deleted = deleted;

  // 3. 카드 합치기: 내용·학습 기록 중 서버 쪽이 더 최근인 부분을 이 기기에 반영 (편집 중인 카드는 다음 번에)
  //    이미 있는 카드는 그 객체를 고쳐서 저장함 (이 기기의 사진은 그대로 둠. iOS는 저장소에서 읽은 사진을
  //    다른 카드 객체에 옮겨 담아 다시 저장하면 사진이 깨질 수 있음)
  const postponed = new Set();   // 편집 중이라 아직 반영하지 못한 카드: 다음 동기화 때 다시 받음
  for (const [id, rc] of Object.entries(rCards)) {
    if (isDead(id, touchedAt(rc))) continue;
    if (editor?.cardId === id) { postponed.add(id); continue; }
    const local = cards.find((c) => c.id === id);
    const newContent = !local || contentAt(rc) > contentAt(local);
    const newStudy = !local || studyAt(rc) > studyAt(local);
    if (!newContent && !newStudy) continue;
    const study = newStudy ? reviveCard(rc) : local;
    const studyFields = { srs: study.srs, practiceScore: study.practiceScore, practiceCount: study.practiceCount, studyAt: studyAt(study) };
    if (local) {
      Object.assign(local, studyFields);
      if (newContent) Object.assign(local, { korText: rc.korText ?? '', engText: rc.engText ?? '', category: rc.category, lang: rc.lang, contentAt: contentAt(rc) });
      local.updatedAt = touchedAt(local);
      await putCard(local);
    } else {
      const card = Object.assign(reviveCard({ ...rc, korImages: [], engImages: [] }), { updatedAt: touchedAt(rc) });
      await putCard(card);
      cards.push(card);
    }
    localChanged = true;
  }

  // 4. 카테고리 이름 합치기
  const catUpdates = [];
  for (const rk of pulled.categories) {
    if ((catStamps.get(rk.key) ?? -1) < (rk.updatedAt || 0)) catUpdates.push({ key: rk.key, name: rk.name, updatedAt: rk.updatedAt || 0 });
  }
  if (catUpdates.length) {
    await putCategoryNames(catUpdates);
    catUpdates.forEach((k) => { catNames.set(k.key, k.name); catStamps.set(k.key, k.updatedAt); });
    localChanged = true;
  }

  // 5. 복습 기록 합치기 (없는 것만 추가)
  const alive = new Set(cards.map((c) => c.id));
  let localReviews = await getAll('reviews');
  const have = new Set(localReviews.map(reviewKey));
  const newReviews = pulled.reviews
    .filter((r) => alive.has(r.cardId) && !have.has(reviewKey(r)))
    .map((r) => ({ ...r, review: reviveDate(r.review), due: reviveDate(r.due) }));
  if (newReviews.length) {
    await addReviews(newReviews);
    localReviews = await getAll('reviews');
  }

  // 6. 공부 기록 합치기 (id 기준 합집합) + 받아온 복습·카드에서 기록 만들기
  const derived = [...newReviews.map((r) => reviewActivity(r.cardId, r.review)), ...cards.map(addActivity)];
  const haveActivity = new Set(activity.map((a) => a.id));
  const newActivity = [...pulled.activity.map(({ id, at }) => ({ id, at })), ...derived]
    .filter((a) => !haveActivity.has(a.id) && (haveActivity.add(a.id), true));
  if (newActivity.length) {
    await recordActivity(newActivity);
    localChanged = true;
  }
  if (localChanged) renderAll();

  // 7. 지난번 올린 뒤 이 기기에서 바뀐 것만 올리기 (같은 시각 것은 한 번 더 올려도 결과가 같음)
  const mark = syncMeta.pushedAt || 0;
  const startedAt = Date.now();
  const writes = [];   // (batch) => void
  for (const c of cards) {
    if (touchedAt(c) < mark || postponed.has(c.id)) continue;
    const rc = rCards[c.id];
    if (rc && contentAt(rc) === contentAt(c) && studyAt(rc) === studyAt(c)) continue;   // 방금 받은 것과 같음
    const ref = userDoc('cards', c.id);
    const studyOnly = contentAt(c) < mark && !(c.id in rDeleted);
    if (studyOnly) {
      // 내용은 이미 올렸고 학습 기록만 바뀜: 학습 기록만 바꿔 씀
      const fields = plain({ updatedAt: touchedAt(c), studyAt: studyAt(c), srs: c.srs, practiceScore: c.practiceScore, practiceCount: c.practiceCount });
      writes.push((b) => b.set(ref, { ...fields, syncAt: fb.serverTimestamp() }, { merge: true }));
      continue;
    }
    const data = plain({
      id: c.id, createdAt: c.createdAt, updatedAt: touchedAt(c), contentAt: contentAt(c), studyAt: studyAt(c),
      korText: c.korText, engText: c.engText, category: c.category, lang: c.lang, source: c.source,
      srs: c.srs, practiceScore: c.practiceScore, practiceCount: c.practiceCount,
    });
    writes.push((b) => b.set(ref, { ...data, syncAt: fb.serverTimestamp() }));
  }
  for (const [id, ts] of Object.entries(syncMeta.deleted)) {
    if (ts < mark || alive.has(id) || (rDeleted[id] ?? -1) >= ts) continue;
    writes.push((b) => b.set(userDoc('cards', id), { id, deletedAt: ts, syncAt: fb.serverTimestamp() }));
  }
  const pulledCats = new Map(pulled.categories.map((k) => [k.key, k.updatedAt || 0]));
  for (const [key, name] of catNames) {
    const updatedAt = catStamps.get(key) ?? 0;
    if (updatedAt < mark || pulledCats.get(key) === updatedAt) continue;
    writes.push((b) => b.set(userDoc('categories', catDocId(key)), { key, name, updatedAt, syncAt: fb.serverTimestamp() }));
  }
  const pulledReviews = new Set(pulled.reviews.map(reviewKey));
  for (const { id, ...r } of localReviews) {
    const at = toDate(r.review).getTime();
    if (at < mark || !alive.has(r.cardId) || pulledReviews.has(reviewKey(r))) continue;
    const data = plain(r);
    writes.push((b) => b.set(userDoc('reviews', `${r.cardId}_${at}`), { ...data, syncAt: fb.serverTimestamp() }));
  }
  const pulledActivity = new Set(pulled.activity.map((a) => a.id));
  for (const a of activity) {
    if (a.at < mark || pulledActivity.has(a.id)) continue;
    writes.push((b) => b.set(userDoc('activity', a.id), { id: a.id, at: a.at, syncAt: fb.serverTimestamp() }));
  }
  for (let i = 0; i < writes.length; i += 400) {
    const batch = fb.writeBatch(fstore);
    writes.slice(i, i + 400).forEach((w) => w(batch));
    await batch.commit();
  }
  // 반영을 미룬 카드가 있으면 다음 번에 같은 범위를 다시 받음
  Object.assign(syncMeta, { pulledAt: postponed.size ? since : pulledAt, pushedAt: startedAt });
}

async function syncNow({ quiet = true, announce = false } = {}) {
  if (!user) {
    if (!quiet) startLogin();
    return;
  }
  if (sync.running) { sync.again = true; return; }
  clearTimeout(sync.timer);
  sync.running = true;
  sync.error = null;
  renderSyncStatus();
  const startSeq = syncMeta.seq;
  try {
    await runSync();
    syncMeta.syncedSeq = Math.max(syncMeta.syncedSeq, startSeq);
    syncMeta.lastSyncAt = Date.now();
    await saveSyncMeta();
    if (announce) toast('로그인했어요. 이제 자동으로 저장돼요.');
    else if (!quiet) toast('동기화했어요.');
  } catch (err) {
    sync.error = err;
    await saveSyncMeta().catch(() => {});
    if (!quiet || announce) toast(`동기화하지 못했어요. (${errText(err)})`);
  } finally {
    sync.running = false;
    renderSyncStatus();
    if (sync.again) { sync.again = false; scheduleSync(1000); }
  }
}

/** 의견 보내기: Worker가 만든 사람에게 메일로 전달. 메일을 못 보내면 Firestore feedback 모음에 남김 */
async function sendFeedback() {
  const f = ui.feedback;
  f.text = $('#fb-text').value.trim();
  f.email = $('#fb-email').value.trim();
  if (!f.text) { toast('내용을 적어 주세요.'); $('#fb-text').focus(); return; }
  if (!fbReady) { toast('지금은 보낼 수 없어요. 잠시 뒤 다시 시도해 주세요.'); return; }
  f.sending = true;
  renderSettings();
  const data = { kind: f.kind, text: f.text.slice(0, 3000), email: f.email.slice(0, 200), app: APP_VERSION, mode: prefs.mode, ua: navigator.userAgent.slice(0, 300) };
  try {
    const res = await fetch(`${SCAN_URL.replace(/\/$/, '')}/feedback`, {
      method: 'POST',
      headers: { 'Content-Type': 'application/json', ...(user ? { Authorization: `Bearer ${await user.getIdToken()}` } : {}) },
      body: JSON.stringify(data),
    });
    if (res.status === 429) throw new ScanError('오늘은 의견을 너무 많이 보냈어요. 내일 다시 보내 주세요.');
    if (!res.ok) throw new Error(`mail ${res.status}`);
  } catch (err) {
    if (err instanceof ScanError) { f.sending = false; renderSettings(); toast(err.message); return; }
    // 메일을 못 보냈으면 Firestore에 남겨 둠
    if (!(await saveFeedbackToStore(data))) return;
  }
  ui.feedback = null;
  ui.settingsPage = null;
  renderSettings();
  toast('보내 주셔서 고마워요! 💌');
}
async function saveFeedbackToStore(data) {
  const f = ui.feedback;

/** 언어 모드와 그 모드의 카드(복습 기록 포함)를 지움 */
async function removeMode(mode) {
  const targets = cards.filter((c) => modeOf(c) === mode);
  const t = Date.now();
  for (const c of targets) {
    await removeCard(c.id);
    syncMeta.deleted[c.id] = t;
  }
  const gone = new Set(targets.map((c) => c.id));
  cards = cards.filter((c) => !gone.has(c.id));
  ui.removingMode = null;
  setPref('modes', prefs.modes.filter((m) => m !== mode));
  if (prefs.mode === mode) {
    const next = modeList().find((m) => m.mode !== mode)?.mode || DEFAULT_MODE;
    setPref('mode', next);
    ui.cardsCat = null; ui.reviewStarted = false; ui.reviewShow = false; ui.reviewCardId = null;
  }
  if (targets.length) markChanged();
  renderAll();
  renderSettings();
  toast(`${studyLabel(mode)}를 지웠어요.${targets.length ? ` (카드 ${targets.length}장)` : ''}`);
}

function agoText(ts) {

const blobToDataURL = (b) => new Promise((res) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.readAsDataURL(b);
});
const dataURLToBlob = async (u) => (await fetch(u)).blob();
const reviveDate = (v) => (v ? new Date(v) : v);
/** JSON에서 읽은 카드의 날짜 값들을 Date로 */
const reviveCard = (c) => ({
  ...c,
  createdAt: new Date(c.createdAt),
  srs: { ...c.srs, due: new Date(c.srs.due), last_review: reviveDate(c.srs.last_review) },
  practiceScore: c.practiceScore ?? 0,
  practiceCount: c.practiceCount ?? 0,
});

async function exportBackup() {
  const reviews = await getAll('reviews');
  const payload = {
    app: 'freedom', version: 1, exportedAt: new Date().toISOString(),
    cards: await Promise.all(cards.map(async (c) => ({
      ...c,
      korImages: await Promise.all(c.korImages.map(blobToDataURL)),
      engImages: await Promise.all(c.engImages.map(blobToDataURL)),
    }))),
    reviews,
    categories: [...catNames].map(([key, name]) => ({ key, name, updatedAt: catStamps.get(key) ?? 0 })),
  };
  const stamp = new Date().toISOString().slice(0, 10);
  await saveFile(new File([JSON.stringify(payload)], `freedom-backup-${stamp}.json`, { type: 'application/json' }), 'freedom 백업');
}

/** 파일 저장: 아이폰은 공유 시트(파일에 저장), 그 밖에는 내려받기 */
async function saveFile(file, title) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title });
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { data = null; }
  if (!data || data.app !== 'freedom' || !Array.isArray(data.cards)) {
    toast('freedom 백업 파일이 아니에요. 파일을 다시 확인해 주세요.');
    return;
  }
  if (!confirm(`백업의 표현 ${data.cards.length}개로 지금 데이터를 바꿀까요? 현재 기기의 데이터는 지워져요.`)) return;
  // 복원한 카드는 다른 기기의 옛 버전보다 앞서도록 지금 시각으로 표시
  const now = Date.now();
  const restored = await Promise.all(data.cards.map(async (c) => reviveCard({
    ...c,
    contentAt: now, studyAt: now, updatedAt: now,
    korImages: await Promise.all((c.korImages || []).map(dataURLToBlob)),
    engImages: await Promise.all((c.engImages || []).map(dataURLToBlob)),
  })));
  const reviews = (data.reviews || []).map((r) => ({ ...r, review: reviveDate(r.review), due: reviveDate(r.due) }));
  const categories = (data.categories || []).filter((k) => k && typeof k.key === 'string' && typeof k.name === 'string');
  await replaceAll(restored, reviews, categories);
  await recordActivity([...restored.map(addActivity), ...reviews.map((r) => reviewActivity(r.cardId, r.review))]);
  cards = restored;
  catNames = new Map(categories.map((k) => [k.key, k.name]));
  catStamps = new Map(categories.map((k) => [k.key, k.updatedAt ?? 0]));
  syncMeta.pushedAt = 0;   // 복원한 복습·공부 기록은 예전 시각이라, 다음 동기화 때 전부 올림
  markChanged();
  renderAll();
  toast(`표현 ${restored.length}개를 복원했어요.`);
}

// 날짜 칸 색: 그날 푼 카드 수(복습 + 자유 연습). 0 / 1~9 / 10~29 / 30~59 / 60+
const LEVELS = [1, 10, 30, 60];
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
const pad2 = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const levelOf = (n) => LEVELS.filter((t) => n >= t).length;

/** 날짜(기기 현지 시간) → { review, practice, add, talk, talkSec } */
function dailyActivity() {
  const days = new Map();
  for (const a of activity) {
    const k = dayKey(new Date(a.at));
    const d = days.get(k) || { day: k, review: 0, practice: 0, add: 0, talk: 0, talkSec: 0 };
    if (a.id[0] === 'r') d.review += 1;
    else if (a.id[0] === 'p') d.practice += 1;
    else if (a.id[0] === 'a') d.add += 1;
    else if (a.id[0] === 't') { d.talk += 1; d.talkSec += Number(a.id.split('|')[2]) || 0; }
    days.set(k, d);
  }
  return days;
}
const solvedOf = (d) => (d ? d.review + d.practice : 0);
/** 그날 대화한 분 (30초 이상이면 1분으로 반올림) */
const talkMin = (d) => Math.round((d?.talkSec ?? 0) / 60);

// 쉬는 날: 이틀까지는 그대로, 3일째 연속으로 안 한 날부터 하루 30점씩 줄어듦 (0점 아래로는 안 내려감). 점수가 줄면 단계도 내려갈 수 있음

  [2100, '은하수 구슬'], [2700, '달빛 구슬'], [4000, '오로라 구슬 II'], [6000, '별자리 구슬'], [9000, '무지개 은하 구슬'],

/** 첫 공부한 날부터 오늘까지 하루씩: 공부한 날은 더하고, 오래 쉰 날은 뺌. 반환: { pts, idle(오늘까지 연속으로 쉰 날 수) } */
function orbScore(days = dailyActivity()) {
  const keys = [...days.keys()].sort();
  if (!keys.length) return { pts: 0, idle: 0 };

  const today = dayKey(new Date());
  for (const d = new Date(`${keys[0]}T00:00:00`); dayKey(d) <= today; d.setDate(d.getDate() + 1)) {
    const info = days.get(dayKey(d));
    if (studiedOn(info)) {
      idle = 0;
      pts += solvedOf(info) + info.add * 3 + talkMin(info) * 5 + (ringsDone(info) === 3 ? 20 : 0);
    } else {
      idle += 1;
      // 오늘은 아직 하루가 안 끝났으니 빼지 않음
      if (idle > ORB_REST_DAYS && dayKey(d) !== today) pts = Math.max(0, pts - ORB_DECAY);

function checkOrbLevelUp(days) {
  const lv = orbLevel(orbPoints(days));

  if (lv < prefs.orbLevel) { setPref('orbLevel', lv); toast(`오래 쉬어서 구슬이 ${ORB_LEVELS[lv - 1][1]}(으)로 작아졌어요. 다시 키워 봐요!`); return; }
  if (lv === prefs.orbLevel) return;

  el.className = 'orb-party';

  el.innerHTML = `<div class="orb-party-card">

  { key: 'talk', name: '대화', unit: '분', c1: '#F7A6C4', c2: '#FFB898', value: (d) => talkMin(d), goal: (d) => goalsOn(d?.day).talk },
];
let ringSeq = 0;
/** 세 겹 링 (바깥부터 복습·추가·대화). size: 지름(px). 목표를 넘으면 한 바퀴로 꽉 참 */
function ringsSVG(d, size, label = '') {
  const id = `rg${++ringSeq}`;
  const stroke = size >= 80 ? 11 : size >= 40 ? 5 : 3.2;
  const gap = size >= 80 ? stroke * 0.45 : 1.2;
  const c = size / 2;
  const defs = RINGS.map((r, i) => `<linearGradient id="${id}-${i}" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="${r.c1}"/><stop offset="1" stop-color="${r.c2}"/></linearGradient>`).join('');
  const arcs = RINGS.map((r, i) => {
    const rad = c - stroke / 2 - i * (stroke + gap);
    const len = 2 * Math.PI * rad;
    const pct = Math.min(1, r.value(d) / Math.max(1, r.goal(d)));
    return `<circle cx="${c}" cy="${c}" r="${rad.toFixed(2)}" fill="none" stroke="${r.c1}" stroke-opacity=".16" stroke-width="${stroke}"/>`
      + (pct > 0 ? `<circle cx="${c}" cy="${c}" r="${rad.toFixed(2)}" fill="none" stroke="url(#${id}-${i})" stroke-width="${stroke}" stroke-linecap="round" stroke-dasharray="${(len * pct).toFixed(2)} ${len.toFixed(2)}" transform="rotate(-90 ${c} ${c})"/>` : '');
  }).join('');
  return `<svg class="rings" width="${size}" height="${size}" viewBox="0 0 ${size} ${size}" ${label ? `role="img" aria-label="${label}"` : 'aria-hidden="true"'}><defs>${defs}</defs>${arcs}</svg>`;
}
const ringsDone = (d) => RINGS.filter((r) => r.value(d) >= r.goal(d)).length;
/** 그날 적용된 하루 목표. 목표를 바꾸면 바꾼 날부터만 새 목표 (지난날 링·점수는 그대로) */
function goalsOn(day = dayKey(new Date())) {
  const now = { review: prefs.goalReview, add: prefs.goalAdd, talk: prefs.goalTalk };
  const hist = prefs.goalHistory || [];
  let g = null;
  for (const h of hist) if (h.from <= day) g = h;
  return g || hist[0] || now;
}

/** 연속 공부일: 오늘(아직 안 했으면 어제)부터 거꾸로 1장이라도 풀었거나 복숭아와 대화한 날이 이어진 수 */
const studiedOn = (d) => solvedOf(d) > 0 || (d?.talk ?? 0) > 0;
function streakInfo(days) {
  const d = new Date();
  const doneToday = studiedOn(days.get(dayKey(d)));
  if (!doneToday) d.setDate(d.getDate() - 1);
  let n = 0;
  while (studiedOn(days.get(dayKey(d)))) { n += 1; d.setDate(d.getDate() - 1); }
  return { n, doneToday };
}

function renderStats() {
  if (ui.tab !== 'stats') return;
  const days = dailyActivity();
  const now = new Date();
  const todayKey = dayKey(now);
  if (!ui.calMonth) ui.calMonth = { y: now.getFullYear(), m: now.getMonth() };
  const { y, m } = ui.calMonth;
  const monthLabel = `${m + 1}월`;

  // 연속 기록
  const { n, doneToday } = streakInfo(days);
  let streakSub;
  if (n === 0) streakSub = '오늘 1장이라도 풀거나 대화하면 연속 기록이 시작돼요.';
  else if (doneToday) streakSub = '연속 공부 중 · 오늘도 했어요';
  else streakSub = `오늘 공부하면 ${n + 1}일째가 돼요.`;

  // 이번 달(보고 있는 달) 합계
  let monthDays = 0, monthSolved = 0;
  const last = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= last; d++) {
    const solved = solvedOf(days.get(`${y}-${pad2(m + 1)}-${pad2(d)}`));
    if (solved) { monthDays += 1; monthSolved += solved; }
  }

  // 달력: 일요일 시작
  const firstKey = [...days.keys()].sort()[0];
  const first = firstKey ? new Date(`${firstKey}T00:00:00`) : now;
  const canPrev = y > first.getFullYear() || (y === first.getFullYear() && m > first.getMonth());
  const canNext = y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth());
  const selected = ui.calDay || (y === now.getFullYear() && m === now.getMonth() ? todayKey : null);
  const lead = new Date(y, m, 1).getDay();
  let cells = WEEKDAYS.map((w) => `<span class="wd" aria-hidden="true">${w}</span>`).join('');
  cells += '<span></span>'.repeat(lead);
  for (let d = 1; d <= last; d++) {
    const k = `${y}-${pad2(m + 1)}-${pad2(d)}`;
    const info = days.get(k);
    const solved = solvedOf(info);
    const future = k > todayKey;
    const label = `${m + 1}월 ${d}일, ${RINGS.map((r) => `${r.name} ${r.value(info)}${r.unit}`).join(', ')}`;
    cells += `<button class="day ring-day${k === todayKey ? ' today' : ''}${future ? ' future' : ''}"
      data-act="cal-day" data-day="${k}" aria-pressed="${k === selected}" aria-label="${label}" ${future ? 'disabled' : ''}>
      <span class="dnum">${d}</span>${future ? '<span class="rings-blank"></span>' : ringsSVG(info, 34)}
    </button>`;
  }

  // 고른 날 상세
  let detail = '';
  if (selected) {
    const date = new Date(`${selected}T00:00:00`);
    const title = date.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
    const info = days.get(selected) || { day: selected, review: 0, practice: 0, add: 0, talk: 0, talkSec: 0 };
    const done = ringsDone(info);
    detail = `<section class="field">
      <h3>${title}${selected === todayKey ? '<span>오늘</span>' : ''}</h3>
      <div class="ring-detail">
        ${ringsSVG(info, 112, `${title} 목표 ${done}개 채움`)}
        <ul class="ring-rows">${RINGS.map((r) => `<li><i style="background:linear-gradient(120deg, ${r.c1}, ${r.c2})"></i><span>${r.name}</span><b>${r.value(info)}<small> / ${r.goal(info)}${r.unit}</small></b></li>`).join('')}</ul>
      </div>
      <p class="sync-line ring-msg">${done === 3 ? '세 링을 모두 채웠어요! ✨' : done ? `${done}개 채웠어요. ${3 - done}개 남았어요.` : selected === todayKey ? '오늘의 링을 채워 볼까요?' : studiedOn(info) || info.add ? '이날은 채운 링이 없어요.' : '이날은 기록이 없어요.'}</p>
      ${selected !== todayKey ? '' : ui.goalEdit ? `<div class="goal-edit">${goalControlsHTML()}<button class="btn primary wide" data-act="goal-open">완료</button></div>`
        : '<button class="btn wide" data-act="goal-open">목표 바꾸기</button>'}
    </section>`;
  }

  $('#stats-main').innerHTML = `
    <div class="streak">
      <b>${n > 0 ? `🔥 ${n}일 연속` : '연속 기록 0일'}</b>
      <small>${streakSub}</small>
    </div>
    <div class="tiles">
      <div class="tile"><b>${monthDays}일</b><small>${monthLabel}에 공부한 날</small></div>
      <div class="tile"><b>${monthSolved}장</b><small>${monthLabel}에 푼 카드</small></div>
    </div>
    <section class="cal" aria-label="${y}년 ${monthLabel} 공부 달력">
      <div class="cal-head">
        <button class="cal-nav" data-act="cal-prev" aria-label="이전 달" ${canPrev ? '' : 'disabled'}>‹</button>
        <h2>${y}년 ${monthLabel}</h2>
        <button class="cal-nav" data-act="cal-next" aria-label="다음 달" ${canNext ? '' : 'disabled'}>›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="legend" aria-hidden="true">
        ${RINGS.map((r) => `<span class="ring-key"><i style="background:linear-gradient(120deg, ${r.c1}, ${r.c2})"></i>${r.name}</span>`).join('')}
      </div>
    </section>
    ${detail}`;
  initWheels();
}

// ================= 화면 전환 =================
function setTab(tab) {
  ui.tab = tab;
  $('#view-review').hidden = tab !== 'review';
  $('#view-talk').hidden = tab !== 'talk';
  $('#view-cards').hidden = tab !== 'cards';
  $('#view-stats').hidden = tab !== 'stats';
  $('#view-settings').hidden = tab !== 'settings';
  if (tab === 'stats') { ui.calMonth = null; ui.calDay = null; }
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
  renderAll();
  if (tab === 'settings') { ui.settingsPage = null; renderSettings(); loadUsage(); }
}
function renderModePills() {
  document.querySelectorAll('.mode-pill').forEach((b) => { b.textContent = `${studyLabel()} ▾`; });
}
/** 아래에서 올라오는 언어 모드 목록 */
function renderModeSheet() {
  const el = $('#mode-sheet');
  el.innerHTML = `<div class="pop-dim" data-act="mode-close"></div>
    <div class="pop-card" role="dialog" aria-label="언어 모드">
      <div class="grab"></div>
      <h3>언어 모드</h3>
      ${modeList().map(({ mode, count }) => `<button class="mode-opt" data-act="mode-pick" data-mode="${mode}" aria-pressed="${mode === prefs.mode}">
        <span class="flag">${targetLang(mode).flag}</span>
        <span class="txt"><b>${targetLang(mode).name}</b><small>${meaningLabel(mode)}</small></span>
        <span class="n">${count}장</span></button>`).join('')}
      <button class="btn wide" data-act="mode-new">+ 새 언어 모드</button>
    </div>`;
  el.hidden = false;
}
function switchMode(mode) {
  if (mode === prefs.mode) return;
  setPref('mode', mode);
  ui.cardsCat = null; ui.renaming = null; ui.deleting = null;
  ui.reviewStarted = false; ui.reviewShow = false; ui.reviewCardId = null;
  renderAll();
  toast(`${studyLabel(mode)}${ro(targetLang(mode).name + ' 공부')} 바꿨어요. (${meaningLabel(mode)})`);
}

function renderAll() {
  renderModePills();
  renderStats();
  renderReview();
  renderTalk();
  renderCards();
}

// ================= 이벤트 =================
document.addEventListener('click', (ev) => {
  const tabBtn = ev.target.closest('[data-tab]');
  if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  switch (act) {
    case 'reveal':
      if (ui.reviewShow || ui.flipping) break;
      ui.flipping = true;
      flipOut('#review-main', () => { ui.flipping = false; ui.reviewShow = true; ui.flipNow = true; renderReview(); });
      break;
    case 'grade': gradeCard(Number(el.dataset.r)).catch((err) => toast(`저장하지 못했어요. (${errText(err)})`)); break;
    case 'practice': if (modeCards().length) openPractice(); break;
    case 'practice-close': closePractice(); break;
    case 'talk-reset': resetTalk(); break;
    case 'talk-go': setTab('talk'); startTalk(null); break;
    case 'talk-go-current': {   // 대화 탭 아래 버튼: 지금 보이는 카드의 화제로
      const box = $('#talk-main .talk-swipe');
      const i = box ? Math.round(box.scrollLeft / (box.firstElementChild.offsetWidth + 10)) : -1;
      startTalk(ui.talkTopics?.[i] || null);
      break;
    }
    case 'ext-link': break;   // 출처 링크는 그대로 열림 (카드 누름으로 안 넘어감)
    case 'int-expr': { const topic = ui.talkTopics?.[Number(el.dataset.index)]; const e = topic?.expressions?.[Number(el.dataset.k)]; if (e) saveTopicExpression(topic, e); break; }
    case 'int-vote': {
      const topic = ui.talkTopics?.[Number(el.dataset.index)];
      if (!topic) break;
      setIntVote(topic.key, el.dataset.v);
      if (el.dataset.v === 'down') toast('이 화제는 숨겼어요.');
      if (!ui.reviewStarted) renderReview();
      renderTalk();
      break;
    }
    case 'int-add': addInterest($('#int-input')?.value); break;
    case 'int-suggest': addInterest(el.dataset.v); break;
    case 'int-remove': saveInterests((prefs.interests || []).filter((x) => x !== el.dataset.v)); break;
    case 'talk-go-topic': { const topic = ui.talkTopics?.[Number(el.dataset.index)]; setTab('talk'); startTalk(topic || null); break; }
    case 'cal-connect': connectCalendar(); break;
    case 'cal-disconnect': disconnectCalendar(); break;
    case 'talk-start': startTalk(); break;
    case 'talk-end': endTalk(); break;
    case 'talk-cards': talkToCards(); break;
    case 'talk-toggle': { const i = Number(el.dataset.index); talk.checked.has(i) ? talk.checked.delete(i) : talk.checked.add(i); renderTalk(); break; }
    case 'set-dir': setDirection(el.dataset.dir); break;
    case 'orb-party-close': document.querySelector('.orb-party')?.remove(); break;
    case 'review-setup': ui.reviewSetup = true; renderReview(); $('#review-main').scrollTop = 0; break;
    case 'review-setup-cancel': ui.reviewSetup = false; renderReview(); break;
    case 'review-start': ui.reviewSetup = false; ui.reviewStarted = true; ui.sessionDone = 0; renderReview(); $('#review-main').scrollTop = 0; break;
    case 'review-quit': {
      const left = dueCards(new Date()).length;
      ui.reviewStarted = false;
      renderReview();
      toast(ui.sessionDone ? `${ui.sessionDone}장 복습했어요. 남은 ${left}장은 언제든 이어서 할 수 있어요.` : '복습을 그만했어요. 언제든 다시 시작할 수 있어요.');
      break;
    }
    case 'review-stop': ui.reviewStarted = false; ui.reviewSetup = true; renderReview(); break;   // 복습 중 '설정 바꾸기' → 설정 화면
    case 'practice-start':
      practice.started = true; practice.show = false; pickPractice(); renderPractice();
      $('#practice-body').scrollTop = 0;
      break;
    case 'practice-stop': practice.started = false; renderPractice(); break;
    case 'study-cat': toggleStudyCat(el.dataset.cat ?? null); break;
    case 'cal-prev': case 'cal-next': {
      const { y, m } = ui.calMonth;
      const d = new Date(y, m + (act === 'cal-next' ? 1 : -1), 1);
      ui.calMonth = { y: d.getFullYear(), m: d.getMonth() };
      ui.calDay = null;
      renderStats();
      break;
    }
    case 'cal-day': ui.calDay = el.dataset.day; renderStats(); break;
    case 'cards-cat': ui.cardsCat = el.dataset.cat ?? null; renderCards(); break;
    case 'rename-cat': {
      ui.renaming = el.dataset.cat;
      ui.deleting = null;
      renderCards();
      $('#cards-main').scrollTop = 0;
      const input = $('#rename-input');
      input.focus();
      input.select();
      break;
    }
    case 'rename-cancel': ui.renaming = null; renderCards(); break;
    case 'delete-cat-ask':
      ui.deleting = el.dataset.cat;
      ui.moveTo = catName(DEFAULT_CATEGORY);
      ui.renaming = null;
      renderCards();
      $('#cards-main').scrollTop = 0;
      break;
    case 'move-to': ui.moveTo = el.dataset.cat; renderCards(); break;
    case 'delete-cancel': ui.deleting = null; renderCards(); break;
    case 'delete-cat': deleteCategory(ui.deleting, el.dataset.mode, ui.moveTo).catch((err) => toast(`삭제하지 못했어요. (${errText(err)})`)); break;
    case 'rename-save': saveRename(); break;
    case 'pick-cat': editor.entries[Number(el.dataset.index)].category = el.dataset.cat; editor.popCat = null; renderEditor(); break;
    case 'new-cat': editor.catInput = Number(el.dataset.index); editor.popCat = null; renderEditor(); $('#cat-input')?.focus(); break;
    case 'add-cat': addCategory(); break;
    case 'cancel-cat': editor.catInput = null; renderEditor(); break;
    case 'practice-reveal':
      if (practice.show || practice.flipping) break;
      practice.flipping = true;
      flipOut('#practice-body', () => { practice.flipping = false; practice.show = true; practice.flipNow = true; renderPractice(); });
      break;
    case 'practice-answer': answerPractice(el.dataset.correct === '1').catch((err) => toast(`저장하지 못했어요. (${errText(err)})`)); break;
    case 'add': openEditor(); break;
    case 'edit': openEditor(el.dataset.id); break;
    case 'editor-cancel': closeEditor(); break;
    case 'editor-save': saveEditor().catch((err) => toast(`저장하지 못했어요. (${errText(err)})`)); break;
    case 'editor-delete': deleteFromEditor(); break;
    case 'scan': $('#scan-input').click(); break;
    case 'voice-start': startVoice(); break;
    case 'ask': sendAsk(); break;
    case 'ask-toggle': editor.typing = !editor.typing; renderEditor(); if (editor.typing) $('#ask-input')?.focus(); break;
    case 'voice-stop': stopVoice(); break;
    case 'voice-cancel': stopVoice(true); break;
    case 'speak': speak(el.dataset.text, el.dataset.lang); break;
    case 'mode-sheet': renderModeSheet(); break;
    case 'mode-close': $('#mode-sheet').hidden = true; break;
    case 'mode-pick':
      $('#mode-sheet').hidden = true;
      switchMode(el.dataset.mode);
      if (ui.tab === 'settings') renderSettings();
      break;
    case 'settings-open': openSettingsPage(el.dataset.page); break;
    case 'goal-open': ui.goalEdit = !ui.goalEdit; renderStats(); break;
    case 'fb-kind':
      ui.feedback.text = $('#fb-text').value; ui.feedback.email = $('#fb-email').value;
      ui.feedback.kind = el.dataset.kind;
      renderSettings();
      break;
    case 'fb-send': sendFeedback(); break;
    case 'settings-back': ui.settingsPage = null; renderSettings(); $('#settings-main').scrollTop = 0; break;
    case 'mode-create': {
      const t = newModeCode('target'), n = newModeCode('native');
      if (!t || !n || t === n) break;
      const mode = `${t}>${n}`;
      if (!modeList().some((m) => m.mode === mode)) setPref('modes', [...prefs.modes, mode]);
      ui.newMode = { target: null, native: 'ko' };
      switchMode(mode);
      renderSettings();
      break;
    }
    case 'mode-remove-ask': ui.removingMode = el.dataset.mode; renderSettings(); break;
    case 'mode-remove-cancel': ui.removingMode = null; renderSettings(); break;
    case 'mode-remove': removeMode(el.dataset.mode).catch((err) => toast(`삭제하지 못했어요. (${errText(err)})`)); break;
    case 'mode-new': $('#mode-sheet').hidden = true; setTab('settings'); openSettingsPage('lang', true); break;
    case 'pref': {
      const raw = el.dataset.value;
      const value = raw === 'true' ? true : raw === 'false' ? false : /^[\d.]+$/.test(raw) ? Number(raw) : raw;
      setPref(el.dataset.key, value);
      if (el.dataset.key.startsWith('goal')) { renderStats(); renderReview(); }   // 기록 탭 링·홈 링도 바로 바뀜
      renderSettingsPage(ui.settingsPage);
      if (el.dataset.key === 'speak' && value) speak(sampleOf(), targetLang().speech);
      if (el.dataset.key === 'talkVoice') playVoiceSample(value);
      break;
    }
    case 'toggle-found': {
      const i = Number(el.dataset.index);
      if (editor.checked.has(i)) editor.checked.delete(i);
      else if (editor.cardId) editor.checked = new Set([i]);
      else editor.checked.add(i);
      renderEditor();
      break;
    }
    case 'use-found': {
      const n = editor.checked.size;
      const first = editor.entries.findIndex((x) => entryState(editor, x) === 'empty');
      useFound(editor);
      renderEditor();
      $(`#kor-${first >= 0 ? first : editor.entries.length - n}`)?.closest('.entry')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      toast(n > 1 ? `카드 ${n}장에 채웠어요. 고쳐서 저장하세요.` : '입력칸에 채웠어요. 고쳐서 저장하세요.');
      break;
    }
    case 'add-entry':
      editor.entries.push({ korText: '', engText: '', note: '', category: editor.entries[editor.entries.length - 1].category });
      renderEditor();
      $(`#kor-${editor.entries.length - 1}`)?.focus();
      break;
    case 'remove-entry':
      editor.entries.splice(Number(el.dataset.index), 1);
      renderEditor();
      break;
    case 'remove-photo': {
      const list = el.dataset.side === 'kor' ? editor.korImages : editor.engImages;
      list.splice(Number(el.dataset.index), 1);
      renderEditor();
      break;
    }
    case 'login': startLogin(); break;
    case 'sync-now': syncNow({ quiet: false }); break;
    case 'logout': logout(); break;
    case 'delete-account': deleteAccount(); break;
    case 'export': exportBackup().catch(() => toast('백업 파일을 만들지 못했어요. 다시 시도해 주세요.')); break;
    case 'import': $('#backup-input').click(); break;
  }
});

document.addEventListener('input', (ev) => {
  if (ev.target.matches?.('#new-target-name, #new-native-name')) {
    ui.newMode[`${ev.target.dataset.field}Name`] = ev.target.value;
    updateCreateMode();
    return;
  }
  if (ev.target.id === 'talk-name') { setPref('talkName', ev.target.value.trim().slice(0, 20)); return; }
  if (ev.target.id === 'talk-bot-name') { setPref('talkBotName', ev.target.value.trim().slice(0, 20)); return; }
  if (ev.target.matches?.('#new-target-flag, #new-native-flag')) {
    // 국기 칸에는 이모지 하나만 남김
    const emoji = firstEmoji(ev.target.value);
    if (ev.target.value !== emoji && !ev.isComposing) ev.target.value = emoji;
    ui.newMode[`${ev.target.dataset.field}Flag`] = emoji;
    updateCreateMode();
    return;
  }
  if (!editor) return;
  if (ev.target.id === 'ask-input') { editor.askText = ev.target.value; return; }
  if (ev.target.tagName !== 'TEXTAREA') return;
  const en = editor.entries[Number(ev.target.dataset.index)];
  if (!en) return;
  if (ev.target.dataset.side === 'kor') en.korText = ev.target.value;
  else en.engText = ev.target.value;
  updateSaveState();
});

document.addEventListener('keydown', (ev) => {
  if (ev.target.id === 'cat-input' && ev.key === 'Enter' && !ev.isComposing) {
    ev.preventDefault();
    addCategory();
    return;
  }
  if (ev.target.id === 'ask-input' && ev.key === 'Enter' && !ev.shiftKey && !ev.isComposing) {
    ev.preventDefault();
    sendAsk();
    return;
  }
  if (ev.target.id === 'int-input' && ev.key === 'Enter' && !ev.isComposing) {
    ev.preventDefault();
    addInterest(ev.target.value);
    return;
  }
  if (ev.target.id === 'rename-input' && ev.key === 'Enter' && !ev.isComposing) {
    ev.preventDefault();
    saveRename();
  }
});

// 오늘의 대화 카드를 옆으로 넘기면 아래 점도 따라감
// 목표 휠: 돌리는 동안 가운데 값을 진하게, 멈추면 저장
const wheelTimers = new WeakMap();
document.addEventListener('scroll', (ev) => {
  const w = ev.target;
  if (!w.classList?.contains('wheel')) return;
  const i = Math.round(w.scrollTop / WHEEL_ROW);
  w.querySelectorAll('li').forEach((li, k) => li.classList.toggle('on', k === i));
  clearTimeout(wheelTimers.get(w));
  wheelTimers.set(w, setTimeout(() => commitWheel(w), 180));
}, true);
// 휠 칸을 눌러도 그 값으로
document.addEventListener('click', (ev) => {
  const li = ev.target.closest?.('.wheel li');
  if (!li) return;
  const w = li.parentElement;
  w.scrollTo({ top: [...w.children].indexOf(li) * WHEEL_ROW, behavior: 'smooth' });
});
document.addEventListener('scroll', (ev) => {
  const box = ev.target;
  if (!box.classList?.contains('talk-swipe')) return;
  const i = Math.round(box.scrollLeft / (box.firstElementChild.offsetWidth + 10));
  box.nextElementSibling?.querySelectorAll('i').forEach((dot, k) => dot.classList.toggle('on', k === i));
}, true);

// 새 언어 모드 드롭다운
document.addEventListener('change', (ev) => {
  if (!ev.target.matches('#new-target, #new-native')) return;
  ui.newMode[ev.target.dataset.field] = ev.target.value;
  renderSettings();
  if (ev.target.value === 'custom') $(`#new-${ev.target.dataset.field}-name`)?.focus();
});

$('#scan-input').addEventListener('change', (ev) => {
  const files = [...ev.target.files];
  ev.target.value = '';
  if (files.length) scanPhotos(files);
});
$('#backup-input').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (file) importBackup(file).catch(() => toast('복원하지 못했어요. 파일을 다시 확인해 주세요.'));
});

// 1분·10분 뒤 다시 나오는 학습 단계 카드를 위해 주기적으로 확인
function tick() {
  if (!db) return;
  const sig = dueCards(new Date()).map((c) => c.id).join(',');
  if (sig !== ui.reviewSig) renderReview();
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (db) renderAll();
  if (db && user && Date.now() - (syncMeta.lastSyncAt || 0) > 10000) syncNow();
  // iOS 홈 화면 앱은 닫아도 메모리에서 그대로 돌아오는 경우가 많아서, 돌아올 때마다 새 버전 확인
  navigator.serviceWorker?.getRegistration().then((r) => r?.update()).catch(() => {});
});

/** 새 버전이 설치되면 한 번 새로고침해서 바로 적용 (편집 중이면 편집을 닫은 뒤에) */
let updateReady = false;
function reloadForUpdate() {
  if (editor) { updateReady = true; return; }
  location.reload();
}

// ================= 시작 =================
async function init() {
  applyPrefs();
  db = await openDB();
  cards = await getAll('cards');
  const catRows = await getAll('categories');
  catNames = new Map(catRows.map((k) => [k.key, k.name]));
  catStamps = new Map(catRows.map((k) => [k.key, k.updatedAt ?? 0]));
  Object.assign(syncMeta, await getMeta('sync').catch(() => null));
  activity = await getAll('activity');
  // 공부 기록 저장소가 생기기 전의 복습 기록과 카드 추가 날짜로 채움 (한 번만)
  if (!(await getMeta('activitySeeded').catch(() => false))) {
    const reviews = await getAll('reviews');
    await recordActivity([...reviews.map((r) => reviewActivity(r.cardId, r.review)), ...cards.map(addActivity)]);
    await putMeta('activitySeeded', true);
  }
  renderAll();
  // Drive 동기화를 쓰던 이전 버전의 로그인 정보는 더 이상 쓰지 않음
  try { localStorage.removeItem('freedom-auth'); localStorage.removeItem('freedom-oauth-silent'); } catch {}
  if (fbReady) {
    handleCalendarReturn();
    // Google 로그인에서 돌아온 경우
    const login = await handleOAuthReturn().catch((err) => ({ error: errText(err) }));
    if (login && login !== 'ok') toast(login.error === 'access_denied' ? 'Google 로그인을 취소했어요.' : `로그인하지 못했어요. (${login.error})`);
    await fbAuth.authStateReady().catch(() => {});
    fb.onAuthStateChanged(fbAuth, (u) => {
      const changed = u?.uid !== user?.uid;
      user = u;
      renderSyncStatus();
      if (ui.tab === 'settings') { renderUsage(); if (changed) loadUsage(); }
      if (u && changed) syncNow({ announce: login === 'ok' });
      if (u && changed) loadCalendar(true);
      if (u && changed) syncInterests();
    });
  }
  if ('serviceWorker' in navigator) {
    // 처음 설치될 때는 이미 최신이므로 새로고침하지 않음
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      reloading = true;
      reloadForUpdate();
    });
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}
init().catch((err) => {
  $('#review-main').innerHTML = `<div class="empty"><h2>저장소를 열지 못했어요</h2><p>개인정보 보호 브라우징을 끄고 다시 열어 주세요. (${esc(err?.message || err)})</p></div>`;
});
</script>
