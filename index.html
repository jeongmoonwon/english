</svg>`;
class ScanError extends Error {}   // 사용자에게 그대로 보여 줄 안내
const SCAN_ERRORS = {
  401: '로그인이 만료됐어요. 다시 로그인해 주세요.',
  413: '사진이 너무 커요. 다른 사진으로 해 주세요.',
  422: '이 사진은 읽을 수 없어요. 다른 사진으로 해 주세요.',
  429: '오늘 쓸 수 있는 10장을 모두 썼어요. 내일 다시 쓸 수 있어요.',   // 남은 장수가 있으면 scanPhotos에서 따로 안내
  503: '지금 요청이 많아요. 잠시 뒤 다시 시도해 주세요.',
};
async function scanPhotos(files) {
  if (!editor || !user || editor.loading) return;
  const e = editor;
  if (files.length > SCAN_MAX) {
    toast(`한 번에 ${SCAN_MAX}장까지 읽을 수 있어요. 앞의 ${SCAN_MAX}장만 읽을게요.`);
    files = files.slice(0, SCAN_MAX);
  }
  if (scanRemaining !== null && files.length > scanRemaining) {
    toast(scanRemaining ? `오늘 남은 횟수는 ${scanRemaining}장이에요. ${scanRemaining}장 이하로 골라 주세요.` : SCAN_ERRORS[429]);
    return;
  }
  e.scanCount = files.length;
  e.loading += 1;
  e.found = null;
  e.checked = null;
  e.scanStart = Date.now();
  clearInterval(scanTimer);
  scanTimer = setInterval(() => {
    const el = $('#scan-secs');
    if (el) el.textContent = Math.floor((Date.now() - e.scanStart) / 1000);
  }, 1000);
  setScanStage(e, 0);
  let message = null;
  try {
    const blobs = (await Promise.all(files.map(compressImage))).filter(Boolean);
    if (!blobs.length) throw new ScanError('사진을 열지 못했어요. 다른 사진으로 해 주세요.');
    if (blobs.length < files.length) toast(`사진 ${files.length - blobs.length}장은 열지 못해서 빼고 읽을게요.`);
    setScanStage(e, 1);
    const images = await Promise.all(blobs.map(async (b) => ({ data: await blobBase64(b), mediaType: b.type || 'image/jpeg' })));
    const body = JSON.stringify({ images });
    const token = await user.getIdToken();
    // 사진이 다 올라갈 즈음(작은 사진이라 금방) '표현 찾기'로 넘김
    const reading = setTimeout(() => setScanStage(e, 2), 700);
    let res;
    try {
      res = await fetch(`${SCAN_URL.replace(/\/$/, '')}/scan`, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${token}` },
        body,
      });
    } finally {
      clearTimeout(reading);
    }
    const data = await res.json().catch(() => ({}));
    if (typeof data.remaining === 'number') scanRemaining = data.remaining;
    if (res.status === 429 && data.remaining > 0) throw new ScanError(`오늘 남은 횟수는 ${data.remaining}장이에요. ${data.remaining}장 이하로 골라 주세요.`);
    if (!res.ok) throw new ScanError(SCAN_ERRORS[res.status] || '사진을 읽지 못했어요. 잠시 뒤 다시 시도해 주세요.');
    if (editor !== e) return;   // 그 사이 편집 화면을 닫은 경우
    const items = Array.isArray(data.items) ? data.items : [];
    if (!items.length) message = '사진에서 외국어 표현을 찾지 못했어요.';
    else if (items.length === 1) { e.found = items; e.checked = new Set([0]); useFound(e); message = '입력칸에 채웠어요. 고쳐서 저장하세요.'; }
    else {
      e.found = items;
      // 사진에 직접 표시한 표현은 미리 고름 (수정 중에는 직접 하나 고름)
      e.checked = new Set(e.cardId ? [] : items.flatMap((it, i) => ((it.marked ?? data.marked) ? [i] : [])));
    }
  } catch (err) {
    if (err instanceof ScanError) message = err.message;
    else if (navigator.onLine === false) message = '인터넷에 연결되어 있지 않아요.';
    else message = `사진을 읽지 못했어요. (${errText(err)})`;
  } finally {
    clearInterval(scanTimer);
    e.loading -= 1;
    e.scanStage = null;
    if (editor === e) renderEditor();
  }
  if (message) toast(message);
}
/** 고른 표현을 입력칸에 넣음: 빈 입력 묶음부터 채우고, 모자라면 새로 만듦 (수정 중에는 그 카드 하나에) */
function useFound(e) {
  const picked = e.found.filter((_, i) => e.checked.has(i)).map((it) => ({ korText: it.meaning, engText: it.expression, note: it.note || '' }));
  if (!picked.length) return;
  if (e.cardId) {
    e.entries[0] = { ...picked[0], category: e.entries[0].category };
  } else {
    for (const en of picked) {
      const slot = e.entries.findIndex((x) => entryState(e, x) === 'empty');
      if (slot >= 0) e.entries[slot] = { ...en, category: e.entries[slot].category };
      else e.entries.push({ ...en, category: e.entries[e.entries.length - 1].category });
    }
  }
  e.found = null;
  e.checked = null;
}
/** 새 카테고리 칸의 이름을 목록에 칩으로 넣고 그 카드에 고름 (카드를 저장할 때 실제로 생김) */
function addCategory() {
  const e = editor;
  const input = $('#cat-input');
  if (!e || e.catInput === null || !input) return;
  const name = input.value.trim();
  if (!name) { input.focus(); return; }
  const exists = categoryList().some((c) => c.name === name) || e.newCats.includes(name);
  if (!exists) e.newCats.push(name);
  e.entries[e.catInput].category = name;
  e.popCat = exists ? null : name;
  e.catInput = null;
  renderEditor();
  if (exists) toast(`'${name}' 카테고리를 골랐어요.`);
}
function newCard(fields) {
  const now = new Date();
  const t = now.getTime();
  const card = { id: uid(), createdAt: now, contentAt: t, studyAt: t, updatedAt: t, ...fields, srs: createEmptyCard(now), practiceScore: 0, practiceCount: 0 };
  cards.push(card);
  return card;
}

async function saveEditor() {
  if (!editorValid()) return;
  const e = editor;
  const list = fullEntries(e);
  if (e.cardId) {
    const card = cards.find((c) => c.id === e.cardId);
    const t = Date.now();
    Object.assign(card, {
      korText: list[0].korText.trim(), engText: list[0].engText.trim(),
      korImages: e.korImages, engImages: e.engImages, category: await keyForName(list[0].category), contentAt: t, updatedAt: t,
    });
    await putCard(card);
  } else {
    const added = [];
    for (const en of list) {
      const card = newCard({ korText: en.korText.trim(), engText: en.engText.trim(), korImages: [], engImages: [], category: await keyForName(en.category) });
      await putCard(card);
      added.push(card);
    }
    await recordActivity(added.map(addActivity));
  }
  markChanged();
  closeEditor();
  renderAll();
  requestPersist();
  toast(e.cardId ? '수정했어요.' : list.length > 1 ? `표현 ${list.length}개를 추가했어요.` : '추가했어요.');
}

async function deleteFromEditor() {
  const id = editor?.cardId;
  if (!id || !confirm('이 표현과 복습 기록을 삭제할까요?')) return;
  await removeCard(id);
  cards = cards.filter((c) => c.id !== id);
  syncMeta.deleted[id] = Date.now();
  markChanged();
  closeEditor();
  renderAll();
  toast('삭제했어요.');
}

// ================= Firebase 동기화 =================
// 이 기기(IndexedDB)가 원본이고, Firebase는 같은 계정의 기기들이 함께 쓰는 사본.
// Firestore: users/<uid>/cards, categories, reviews, activity (문서마다 syncAt = 서버 저장 시각)
// 사진은 올리지 않음: 각 기기에만 있고, 다른 기기에는 글과 학습 기록만 넘어감.
// 받기는 지난번 이후 syncAt이 바뀐 문서만, 올리기는 지난번 올린 뒤 이 기기에서 바뀐 것만.
// 병합은 카드 단위로, 내용(글·카테고리, contentAt)과 학습 기록(복습 일정·연습 점수, studyAt)을
// 따로 비교해 각각 더 나중에 바뀐 쪽을 씀. 그래서 한 기기에서 고치고 다른 기기에서 복습해도 둘 다 남음.
// 삭제는 카드 문서를 deletedAt만 남긴 문서로 바꿔서 알림.
const fbReady = !!FIREBASE.apiKey;
const fbApp = fbReady ? fb.initializeApp(FIREBASE) : null;
const fbAuth = fbReady ? fb.initializeAuth(fbApp, { persistence: [fb.indexedDBLocalPersistence, fb.browserLocalPersistence] }) : null;
const fstore = fbReady ? fb.getFirestore(fbApp) : null;
let user = null;                         // 로그인한 Firebase 사용자

// IndexedDB meta에 저장. uid: 마지막으로 동기화한 계정, pulledAt: 받은 문서 중 가장 늦은 syncAt(서버 시각),
// pushedAt: 마지막으로 올리기 시작한 시각(이 기기 시각)
const syncMeta = { seq: 0, syncedSeq: 0, deleted: {}, lastSyncAt: 0, uid: null, pulledAt: 0, pushedAt: 0 };
const sync = { running: false, again: false, timer: null, error: null };

const contentAt = (c) => c.contentAt ?? 0;
const studyAt = (c) => c.studyAt ?? 0;
const touchedAt = (c) => Math.max(contentAt(c), studyAt(c));
const pendingCount = () => Math.max(0, syncMeta.seq - syncMeta.syncedSeq);
const saveSyncMeta = () => putMeta('sync', { ...syncMeta });
const plain = (o) => JSON.parse(JSON.stringify(o));   // Date → 글자, undefined 값은 뺌
const userCol = (name) => fb.collection(fstore, 'users', user.uid, name);
const userDoc = (name, id) => fb.doc(fstore, 'users', user.uid, name, id);
const catDocId = (key) => `k${encodeURIComponent(key)}`;
const reviewKey = (r) => `${r.cardId}|${toDate(r.review).getTime()}`;

/** 로컬에서 무언가 바뀌었을 때: 기록해 두고 잠시 뒤 올림 */
function markChanged() {
  syncMeta.seq += 1;
  saveSyncMeta().catch(() => {});
  renderSyncStatus();
  scheduleSync();
}
function scheduleSync(delay = 3000) {
  clearTimeout(sync.timer);
  if (!user) return;
  sync.timer = setTimeout(() => syncNow(), delay);
}

// ----- 로그인 (아이폰 홈 화면 앱에서도 되도록 팝업 대신 페이지 이동 방식) -----
// Google에서 받은 토큰으로 Firebase에 로그인하면, 이후로는 Firebase가 로그인을 유지해 줌
const redirectUri = () => new URL('./', location.href).href;
function startLogin() {
  const state = uid();
  try { localStorage.setItem(OAUTH_STATE_KEY, state); } catch {}
  const params = new URLSearchParams({
    client_id: GOOGLE.clientId,
    redirect_uri: redirectUri(),
    response_type: 'token',
    scope: GOOGLE.scope,
    prompt: 'select_account',
    state,
  });
  location.assign(`https://accounts.google.com/o/oauth2/v2/auth?${params}`);
}
/** 로그인하고 돌아왔으면 주소의 #access_token으로 Firebase 로그인. 반환: 'ok' | { error } | null */
async function handleOAuthReturn() {
  if (!/[#&]state=/.test(location.hash)) return null;
  const p = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  let saved = null;
  try {
    saved = localStorage.getItem(OAUTH_STATE_KEY);
    localStorage.removeItem(OAUTH_STATE_KEY);
  } catch {}
  if (!saved || p.get('state') !== saved) return null;
  if (!p.get('access_token')) return { error: p.get('error') || 'unknown' };
  if (!fbReady) return { error: 'Firebase 설정이 비어 있어요' };
  try {
    await fb.signInWithCredential(fbAuth, fb.GoogleAuthProvider.credential(null, p.get('access_token')));
    return 'ok';
  } catch (err) {
    return { error: err.code || errText(err) };
  }
}
async function logout() {
  if (!confirm('로그아웃할까요? 이 기기의 카드는 그대로 남고, 저장된 데이터도 지워지지 않아요.')) return;
  clearTimeout(sync.timer);
  await fb.signOut(fbAuth).catch(() => {});
  toast('로그아웃했어요.');
}
/** 서버에 저장된 이 계정의 데이터와 계정을 모두 지움. 이 기기의 카드는 남김 */
async function deleteAccount() {
  if (!user || sync.running) return;
  if (!confirm('계정을 삭제할까요? 서버에 저장된 카드와 기록이 모두 지워지고 되돌릴 수 없어요. 이 기기의 카드는 그대로 남아요.')) return;
  clearTimeout(sync.timer);
  sync.running = true;
  renderSyncStatus();
  try {
    for (const name of ['cards', 'categories', 'reviews', 'activity']) {
      const snap = await fb.getDocs(userCol(name));
      for (let i = 0; i < snap.docs.length; i += 400) {
        const batch = fb.writeBatch(fstore);
        snap.docs.slice(i, i + 400).forEach((d) => batch.delete(d.ref));
        await batch.commit();
      }
    }
    Object.assign(syncMeta, { uid: null, pulledAt: 0, pushedAt: 0 });
    await saveSyncMeta();
    await fb.deleteUser(user);
    toast('계정과 서버의 데이터를 삭제했어요.');
  } catch (err) {
    if (err.code === 'auth/requires-recent-login') {
      alert('서버의 데이터는 지웠어요. 계정을 지우려면 보안을 위해 한 번 더 로그인한 뒤 다시 눌러 주세요.');
      startLogin();
    } else {
      toast(`삭제하지 못했어요. (${errText(err)})`);
    }
  } finally {
    sync.running = false;
    renderSyncStatus();
  }
}

/** 지난번 이후 바뀐 문서 받기. 반환: { docs, maxAt(ms) } */
async function pullChanges(name, since) {
  const docs = [];
  let maxAt = since, last = null;
  for (;;) {
    const parts = [fb.where('syncAt', '>', fb.Timestamp.fromMillis(since)), fb.orderBy('syncAt')];
    if (last) parts.push(fb.startAfter(last));
    const snap = await fb.getDocs(fb.query(userCol(name), ...parts, fb.limit(500)));
    for (const d of snap.docs) {
      const data = d.data();
      if (data.syncAt) maxAt = Math.max(maxAt, data.syncAt.toMillis());
      delete data.syncAt;
      docs.push(data);
    }
    if (snap.size < 500) break;
    last = snap.docs[snap.size - 1];
  }
  return { docs, maxAt };
}

async function runSync() {
  // 0. 다른 계정으로 바뀌었으면 처음부터 받고 이 기기의 데이터를 모두 올림
  if (syncMeta.uid !== user.uid) {
    Object.assign(syncMeta, { uid: user.uid, pulledAt: 0, pushedAt: 0 });
  }

  // 1. 서버에서 바뀐 것 받기
  const since = syncMeta.pulledAt || 0;
  const pulled = {};
  let pulledAt = since;
  for (const name of ['cards', 'categories', 'reviews', 'activity']) {
    const { docs, maxAt } = await pullChanges(name, since);
    pulled[name] = docs;
    pulledAt = Math.max(pulledAt, maxAt);
  }
  const rCards = {}, rDeleted = {};
  for (const d of pulled.cards) {
    if (d.deletedAt) rDeleted[d.id] = d.deletedAt;
    else rCards[d.id] = d;
  }
  let localChanged = false;

  // 2. 삭제 합치기: 삭제 시각 이후에 바뀐 적 없는 카드는 지움
  const deleted = { ...syncMeta.deleted };
  for (const [id, ts] of Object.entries(rDeleted)) deleted[id] = Math.max(deleted[id] || 0, ts);
  const isDead = (id, at) => id in deleted && deleted[id] >= at;
  for (const local of [...cards]) {
    if (isDead(local.id, touchedAt(local)) && editor?.cardId !== local.id) {
      await removeCard(local.id);
      cards = cards.filter((c) => c !== local);
      localChanged = true;
    }
  }
  syncMeta.deleted = deleted;

  // 3. 카드 합치기: 내용·학습 기록 중 서버 쪽이 더 최근인 부분을 이 기기에 반영 (편집 중인 카드는 다음 번에)
  //    이미 있는 카드는 그 객체를 고쳐서 저장함 (이 기기의 사진은 그대로 둠. iOS는 저장소에서 읽은 사진을
  //    다른 카드 객체에 옮겨 담아 다시 저장하면 사진이 깨질 수 있음)
  const postponed = new Set();   // 편집 중이라 아직 반영하지 못한 카드: 다음 동기화 때 다시 받음
  for (const [id, rc] of Object.entries(rCards)) {
    if (isDead(id, touchedAt(rc))) continue;
    if (editor?.cardId === id) { postponed.add(id); continue; }
    const local = cards.find((c) => c.id === id);
    const newContent = !local || contentAt(rc) > contentAt(local);
    const newStudy = !local || studyAt(rc) > studyAt(local);
    if (!newContent && !newStudy) continue;
    const study = newStudy ? reviveCard(rc) : local;
    const studyFields = { srs: study.srs, practiceScore: study.practiceScore, practiceCount: study.practiceCount, studyAt: studyAt(study) };
    if (local) {
      Object.assign(local, studyFields);
      if (newContent) Object.assign(local, { korText: rc.korText ?? '', engText: rc.engText ?? '', category: rc.category, contentAt: contentAt(rc) });
      local.updatedAt = touchedAt(local);
      await putCard(local);
    } else {
      const card = Object.assign(reviveCard({ ...rc, korImages: [], engImages: [] }), { updatedAt: touchedAt(rc) });
      await putCard(card);
      cards.push(card);
    }
    localChanged = true;
  }

  // 4. 카테고리 이름 합치기
  const catUpdates = [];
  for (const rk of pulled.categories) {
    if ((catStamps.get(rk.key) ?? -1) < (rk.updatedAt || 0)) catUpdates.push({ key: rk.key, name: rk.name, updatedAt: rk.updatedAt || 0 });
  }
  if (catUpdates.length) {
    await putCategoryNames(catUpdates);
    catUpdates.forEach((k) => { catNames.set(k.key, k.name); catStamps.set(k.key, k.updatedAt); });
    localChanged = true;
  }

  // 5. 복습 기록 합치기 (없는 것만 추가)
  const alive = new Set(cards.map((c) => c.id));
  let localReviews = await getAll('reviews');
  const have = new Set(localReviews.map(reviewKey));
  const newReviews = pulled.reviews
    .filter((r) => alive.has(r.cardId) && !have.has(reviewKey(r)))
    .map((r) => ({ ...r, review: reviveDate(r.review), due: reviveDate(r.due) }));
  if (newReviews.length) {
    await addReviews(newReviews);
    localReviews = await getAll('reviews');
  }

  // 6. 공부 기록 합치기 (id 기준 합집합) + 받아온 복습·카드에서 기록 만들기
  const derived = [...newReviews.map((r) => reviewActivity(r.cardId, r.review)), ...cards.map(addActivity)];
  const haveActivity = new Set(activity.map((a) => a.id));
  const newActivity = [...pulled.activity.map(({ id, at }) => ({ id, at })), ...derived]
    .filter((a) => !haveActivity.has(a.id) && (haveActivity.add(a.id), true));
  if (newActivity.length) {
    await recordActivity(newActivity);
    localChanged = true;
  }
  if (localChanged) renderAll();

  // 7. 지난번 올린 뒤 이 기기에서 바뀐 것만 올리기 (같은 시각 것은 한 번 더 올려도 결과가 같음)
  const mark = syncMeta.pushedAt || 0;
  const startedAt = Date.now();
  const writes = [];   // (batch) => void
  for (const c of cards) {
    if (touchedAt(c) < mark || postponed.has(c.id)) continue;
    const rc = rCards[c.id];
    if (rc && contentAt(rc) === contentAt(c) && studyAt(rc) === studyAt(c)) continue;   // 방금 받은 것과 같음
    const ref = userDoc('cards', c.id);
    const studyOnly = contentAt(c) < mark && !(c.id in rDeleted);
    if (studyOnly) {
      // 내용은 이미 올렸고 학습 기록만 바뀜: 학습 기록만 바꿔 씀
      const fields = plain({ updatedAt: touchedAt(c), studyAt: studyAt(c), srs: c.srs, practiceScore: c.practiceScore, practiceCount: c.practiceCount });
      writes.push((b) => b.set(ref, { ...fields, syncAt: fb.serverTimestamp() }, { merge: true }));
      continue;
    }
    const data = plain({
      id: c.id, createdAt: c.createdAt, updatedAt: touchedAt(c), contentAt: contentAt(c), studyAt: studyAt(c),
      korText: c.korText, engText: c.engText, category: c.category,
      srs: c.srs, practiceScore: c.practiceScore, practiceCount: c.practiceCount,
    });
    writes.push((b) => b.set(ref, { ...data, syncAt: fb.serverTimestamp() }));
  }
  for (const [id, ts] of Object.entries(syncMeta.deleted)) {
    if (ts < mark || alive.has(id) || (rDeleted[id] ?? -1) >= ts) continue;
    writes.push((b) => b.set(userDoc('cards', id), { id, deletedAt: ts, syncAt: fb.serverTimestamp() }));
  }
  const pulledCats = new Map(pulled.categories.map((k) => [k.key, k.updatedAt || 0]));
  for (const [key, name] of catNames) {
    const updatedAt = catStamps.get(key) ?? 0;
    if (updatedAt < mark || pulledCats.get(key) === updatedAt) continue;
    writes.push((b) => b.set(userDoc('categories', catDocId(key)), { key, name, updatedAt, syncAt: fb.serverTimestamp() }));
  }
  const pulledReviews = new Set(pulled.reviews.map(reviewKey));
  for (const { id, ...r } of localReviews) {
    const at = toDate(r.review).getTime();
    if (at < mark || !alive.has(r.cardId) || pulledReviews.has(reviewKey(r))) continue;
    const data = plain(r);
    writes.push((b) => b.set(userDoc('reviews', `${r.cardId}_${at}`), { ...data, syncAt: fb.serverTimestamp() }));
  }
  const pulledActivity = new Set(pulled.activity.map((a) => a.id));
  for (const a of activity) {
    if (a.at < mark || pulledActivity.has(a.id)) continue;
    writes.push((b) => b.set(userDoc('activity', a.id), { id: a.id, at: a.at, syncAt: fb.serverTimestamp() }));
  }
  for (let i = 0; i < writes.length; i += 400) {
    const batch = fb.writeBatch(fstore);
    writes.slice(i, i + 400).forEach((w) => w(batch));
    await batch.commit();
  }
  // 반영을 미룬 카드가 있으면 다음 번에 같은 범위를 다시 받음
  Object.assign(syncMeta, { pulledAt: postponed.size ? since : pulledAt, pushedAt: startedAt });
}

async function syncNow({ quiet = true, announce = false } = {}) {
  if (!user) {
    if (!quiet) startLogin();
    return;
  }
  if (sync.running) { sync.again = true; return; }
  clearTimeout(sync.timer);
  sync.running = true;
  sync.error = null;
  renderSyncStatus();
  const startSeq = syncMeta.seq;
  try {
    await runSync();
    syncMeta.syncedSeq = Math.max(syncMeta.syncedSeq, startSeq);
    syncMeta.lastSyncAt = Date.now();
    await saveSyncMeta();
    if (announce) toast('로그인했어요. 이제 자동으로 저장돼요.');
    else if (!quiet) toast('동기화했어요.');
  } catch (err) {
    sync.error = err;
    await saveSyncMeta().catch(() => {});
    if (!quiet || announce) toast(`동기화하지 못했어요. (${errText(err)})`);
  } finally {
    sync.running = false;
    renderSyncStatus();
    if (sync.again) { sync.again = false; scheduleSync(1000); }
  }
}

function agoText(ts) {
  const sec = (Date.now() - ts) / 1000;
  if (sec < 60) return '방금';
  if (sec < 3600) return `${Math.round(sec / 60)}분 전`;
  if (sec < 86400) return `${Math.round(sec / 3600)}시간 전`;
  return `${Math.round(sec / 86400)}일 전`;
}
function renderSyncStatus() {
  const pending = pendingCount();
  const needsAttention = !!user && !!sync.error && !sync.running;
  const pill = $('#sync-pill');
  if (pill) pill.innerHTML = `동기화${needsAttention ? '<span class="dot" aria-label="확인 필요"></span>' : ''}`;
  const box = $('#sync-box');
  if (!box || $('#backup').hidden) return;
  if (!fbReady) {
    box.innerHTML = `<div class="field">
      <h3>동기화</h3>
      <p class="sync-line">동기화는 준비 중이에요. 그동안은 아래의 백업 파일로 옮겨 주세요.</p>
    </div>`;
    return;
  }
  if (!user) {
    box.innerHTML = `<div class="field">
      <h3>동기화</h3>
      <p class="sync-line">로그인하면 카드와 복습 기록이 자동으로 저장돼요. 같은 계정으로 로그인한 다른 기기와도 맞춰져요. (사진은 이 기기에만 있어요)</p>
      <button class="btn primary wide" data-act="login">Google로 로그인</button>
    </div>`;
    return;
  }
  let line, warn = false;
  if (sync.running) line = '동기화하는 중…';
  else if (sync.error) {
    warn = true;
    line = `동기화하지 못했어요. (${esc(errText(sync.error))})${pending ? ` · 안 올라간 변경 ${pending}개` : ''}`;
  } else if (pending) line = `올리는 중이에요 · 변경 ${pending}개`;
  else line = syncMeta.lastSyncAt ? `모두 저장됨 · 마지막 동기화 ${agoText(syncMeta.lastSyncAt)}` : '아직 동기화하지 않았어요.';
  box.innerHTML = `<div class="field">
    <h3>동기화<span>${esc(user.email || '로그인됨')}</span></h3>
    <p class="sync-line${warn ? ' warn' : ''}">${line}</p>
    <button class="btn wide" data-act="sync-now" ${sync.running ? 'disabled' : ''}>지금 동기화</button>
    <button class="btn wide" data-act="logout" ${sync.running ? 'disabled' : ''}>로그아웃</button>
    <button class="btn danger wide" data-act="delete-account" ${sync.running ? 'disabled' : ''}>계정 삭제</button>
  </div>`;
}

// ================= 백업 =================
const blobToDataURL = (b) => new Promise((res) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.readAsDataURL(b);
});
const dataURLToBlob = async (u) => (await fetch(u)).blob();
const reviveDate = (v) => (v ? new Date(v) : v);
/** JSON에서 읽은 카드의 날짜 값들을 Date로 */
const reviveCard = (c) => ({
  ...c,
  createdAt: new Date(c.createdAt),
  srs: { ...c.srs, due: new Date(c.srs.due), last_review: reviveDate(c.srs.last_review) },
  practiceScore: c.practiceScore ?? 0,
  practiceCount: c.practiceCount ?? 0,
});

async function exportBackup() {
  const reviews = await getAll('reviews');
  const payload = {
    app: 'freedom', version: 1, exportedAt: new Date().toISOString(),
    cards: await Promise.all(cards.map(async (c) => ({
      ...c,
      korImages: await Promise.all(c.korImages.map(blobToDataURL)),
      engImages: await Promise.all(c.engImages.map(blobToDataURL)),
    }))),
    reviews,
    categories: [...catNames].map(([key, name]) => ({ key, name, updatedAt: catStamps.get(key) ?? 0 })),
  };
  const stamp = new Date().toISOString().slice(0, 10);
  await saveFile(new File([JSON.stringify(payload)], `freedom-backup-${stamp}.json`, { type: 'application/json' }), 'freedom 백업');
}

/** 파일 저장: 아이폰은 공유 시트(파일에 저장), 그 밖에는 내려받기 */
async function saveFile(file, title) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title });
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { data = null; }
  if (!data || data.app !== 'freedom' || !Array.isArray(data.cards)) {
    toast('freedom 백업 파일이 아니에요. 파일을 다시 확인해 주세요.');
    return;
  }
  if (!confirm(`백업의 표현 ${data.cards.length}개로 지금 데이터를 바꿀까요? 현재 기기의 데이터는 지워져요.`)) return;
  // 복원한 카드는 다른 기기의 옛 버전보다 앞서도록 지금 시각으로 표시
  const now = Date.now();
  const restored = await Promise.all(data.cards.map(async (c) => reviveCard({
    ...c,
    contentAt: now, studyAt: now, updatedAt: now,
    korImages: await Promise.all((c.korImages || []).map(dataURLToBlob)),
    engImages: await Promise.all((c.engImages || []).map(dataURLToBlob)),
  })));
  const reviews = (data.reviews || []).map((r) => ({ ...r, review: reviveDate(r.review), due: reviveDate(r.due) }));
  const categories = (data.categories || []).filter((k) => k && typeof k.key === 'string' && typeof k.name === 'string');
  await replaceAll(restored, reviews, categories);
  await recordActivity([...restored.map(addActivity), ...reviews.map((r) => reviewActivity(r.cardId, r.review))]);
  cards = restored;
  catNames = new Map(categories.map((k) => [k.key, k.name]));
  catStamps = new Map(categories.map((k) => [k.key, k.updatedAt ?? 0]));
  syncMeta.pushedAt = 0;   // 복원한 복습·공부 기록은 예전 시각이라, 다음 동기화 때 전부 올림
  markChanged();
  $('#backup').hidden = true;
  renderAll();
  toast(`표현 ${restored.length}개를 복원했어요.`);
}

// ================= 기록 (캘린더) =================
// 날짜 칸 색: 그날 푼 카드 수(복습 + 자유 연습). 0 / 1~9 / 10~29 / 30~59 / 60+
const LEVELS = [1, 10, 30, 60];
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
const pad2 = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const levelOf = (n) => LEVELS.filter((t) => n >= t).length;

/** 날짜(기기 현지 시간) → { review, practice, add } */
function dailyActivity() {
  const days = new Map();
  for (const a of activity) {
    const k = dayKey(new Date(a.at));
    const d = days.get(k) || { review: 0, practice: 0, add: 0 };
    if (a.id[0] === 'r') d.review += 1;
    else if (a.id[0] === 'p') d.practice += 1;
    else if (a.id[0] === 'a') d.add += 1;
    days.set(k, d);
  }
  return days;
}
const solvedOf = (d) => (d ? d.review + d.practice : 0);

/** 연속 공부일: 오늘(아직 안 했으면 어제)부터 거꾸로 1장이라도 한 날이 이어진 수 */
function streakInfo(days) {
  const d = new Date();
  const doneToday = solvedOf(days.get(dayKey(d))) > 0;
  if (!doneToday) d.setDate(d.getDate() - 1);
  let n = 0;
  while (solvedOf(days.get(dayKey(d))) > 0) { n += 1; d.setDate(d.getDate() - 1); }
  return { n, doneToday };
}

function renderStats() {
  if (ui.tab !== 'stats') return;
  const days = dailyActivity();
  const now = new Date();
  const todayKey = dayKey(now);
  if (!ui.calMonth) ui.calMonth = { y: now.getFullYear(), m: now.getMonth() };
  const { y, m } = ui.calMonth;
  const monthLabel = `${m + 1}월`;

  // 연속 기록
  const { n, doneToday } = streakInfo(days);
  let streakSub;
  if (n === 0) streakSub = '오늘 1장이라도 풀면 연속 기록이 시작돼요.';
  else if (doneToday) streakSub = '연속 공부 중 · 오늘도 했어요';
  else streakSub = `오늘 공부하면 ${n + 1}일째가 돼요.`;

  // 이번 달(보고 있는 달) 합계
  let monthDays = 0, monthSolved = 0;
  const last = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= last; d++) {
    const solved = solvedOf(days.get(`${y}-${pad2(m + 1)}-${pad2(d)}`));
    if (solved) { monthDays += 1; monthSolved += solved; }
  }

  // 달력: 일요일 시작
  const firstKey = [...days.keys()].sort()[0];
  const first = firstKey ? new Date(`${firstKey}T00:00:00`) : now;
  const canPrev = y > first.getFullYear() || (y === first.getFullYear() && m > first.getMonth());
  const canNext = y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth());
  const selected = ui.calDay || (y === now.getFullYear() && m === now.getMonth() ? todayKey : null);
  const lead = new Date(y, m, 1).getDay();
  let cells = WEEKDAYS.map((w) => `<span class="wd" aria-hidden="true">${w}</span>`).join('');
  cells += '<span></span>'.repeat(lead);
  for (let d = 1; d <= last; d++) {
    const k = `${y}-${pad2(m + 1)}-${pad2(d)}`;
    const info = days.get(k);
    const solved = solvedOf(info);
    const future = k > todayKey;
    const label = `${m + 1}월 ${d}일, ${solved ? `${solved}장 풀었어요` : '공부 기록 없음'}${info?.add ? `, 새 표현 ${info.add}개` : ''}`;
    cells += `<button class="day${solved ? ` l${levelOf(solved)}` : ''}${k === todayKey ? ' today' : ''}${future ? ' future' : ''}"
      data-act="cal-day" data-day="${k}" aria-pressed="${k === selected}" aria-label="${label}" ${future ? 'disabled' : ''}>
      ${d}${!solved && info?.add ? '<span class="add-dot"></span>' : ''}
    </button>`;
  }

  // 고른 날 상세
  let detail = '';
  if (selected) {
    const info = days.get(selected);
    const date = new Date(`${selected}T00:00:00`);
    const title = date.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
    detail = `<section class="field">
      <h3>${title}${selected === todayKey ? '<span>오늘</span>' : ''}</h3>
      ${info && (solvedOf(info) || info.add)
        ? `<ul class="day-rows">
            <li><span>복습</span><b>${info.review}장</b></li>
            <li><span>자유 연습</span><b>${info.practice}장</b></li>
            <li><span>새 표현</span><b>${info.add}개</b></li>
          </ul>`
        : '<p class="sync-line">공부 기록이 없어요.</p>'}
    </section>`;
  }

  $('#stats-main').innerHTML = `
    <div class="streak">
      <b>${n > 0 ? `🔥 ${n}일 연속` : '연속 기록 0일'}</b>
      <small>${streakSub}</small>
    </div>
    <div class="tiles">
      <div class="tile"><b>${monthDays}일</b><small>${monthLabel}에 공부한 날</small></div>
      <div class="tile"><b>${monthSolved}장</b><small>${monthLabel}에 푼 카드</small></div>
    </div>
    <section class="cal" aria-label="${y}년 ${monthLabel} 공부 달력">
      <div class="cal-head">
        <button class="cal-nav" data-act="cal-prev" aria-label="이전 달" ${canPrev ? '' : 'disabled'}>‹</button>
        <h2>${y}년 ${monthLabel}</h2>
        <button class="cal-nav" data-act="cal-next" aria-label="다음 달" ${canNext ? '' : 'disabled'}>›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="legend" aria-hidden="true">
        적음 <i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> 많음
        <span class="gap"></span><i class="dot"></i> 표현만 추가
      </div>
    </section>
    ${detail}`;
}

// ================= 화면 전환 =================
function setTab(tab) {
  ui.tab = tab;
  $('#view-review').hidden = tab !== 'review';
  $('#view-cards').hidden = tab !== 'cards';
  $('#view-stats').hidden = tab !== 'stats';
  if (tab === 'stats') { ui.calMonth = null; ui.calDay = null; }
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
  renderAll();
}
function renderAll() {
  renderStats();
  renderReview();
  renderCards();
}

// ================= 이벤트 =================
document.addEventListener('click', (ev) => {
  const tabBtn = ev.target.closest('[data-tab]');
  if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  switch (act) {
    case 'reveal': ui.reviewShow = true; renderReview(); break;
    case 'grade': gradeCard(Number(el.dataset.r)).catch((err) => toast(`저장하지 못했어요. (${errText(err)})`)); break;
    case 'practice': if (cards.length) openPractice(); break;
    case 'practice-close': closePractice(); break;
    case 'set-dir': setDirection(el.dataset.dir); break;
    case 'review-start': ui.reviewStarted = true; renderReview(); $('#review-main').scrollTop = 0; break;
    case 'review-stop': ui.reviewStarted = false; renderReview(); break;
    case 'practice-start':
      practice.started = true; practice.show = false; pickPractice(); renderPractice();
      $('#practice-body').scrollTop = 0;
      break;
    case 'practice-stop': practice.started = false; renderPractice(); break;
    case 'study-cat': toggleStudyCat(el.dataset.cat ?? null); break;
    case 'cal-prev': case 'cal-next': {
      const { y, m } = ui.calMonth;
      const d = new Date(y, m + (act === 'cal-next' ? 1 : -1), 1);
      ui.calMonth = { y: d.getFullYear(), m: d.getMonth() };
      ui.calDay = null;
      renderStats();
      break;
    }
    case 'cal-day': ui.calDay = el.dataset.day; renderStats(); break;
    case 'cards-cat': ui.cardsCat = el.dataset.cat ?? null; renderCards(); break;
    case 'rename-cat': {
      ui.renaming = el.dataset.cat;
      ui.deleting = null;
      renderCards();
      $('#cards-main').scrollTop = 0;
      const input = $('#rename-input');
      input.focus();
      input.select();
      break;
    }
    case 'rename-cancel': ui.renaming = null; renderCards(); break;
    case 'delete-cat-ask': ui.deleting = el.dataset.cat; ui.renaming = null; renderCards(); $('#cards-main').scrollTop = 0; break;
    case 'delete-cancel': ui.deleting = null; renderCards(); break;
    case 'delete-cat': deleteCategory(ui.deleting, el.dataset.mode).catch((err) => toast(`삭제하지 못했어요. (${errText(err)})`)); break;
    case 'rename-save': saveRename(); break;
    case 'pick-cat': editor.entries[Number(el.dataset.index)].category = el.dataset.cat; editor.popCat = null; renderEditor(); break;
    case 'new-cat': editor.catInput = Number(el.dataset.index); editor.popCat = null; renderEditor(); $('#cat-input')?.focus(); break;
    case 'add-cat': addCategory(); break;
    case 'cancel-cat': editor.catInput = null; renderEditor(); break;
    case 'practice-reveal': practice.show = true; renderPractice(); break;
    case 'practice-answer': answerPractice(el.dataset.correct === '1').catch((err) => toast(`저장하지 못했어요. (${errText(err)})`)); break;
    case 'add': openEditor(); break;
    case 'edit': openEditor(el.dataset.id); break;
    case 'editor-cancel': closeEditor(); break;
    case 'editor-save': saveEditor().catch((err) => toast(`저장하지 못했어요. (${errText(err)})`)); break;
    case 'editor-delete': deleteFromEditor(); break;
    case 'scan': $('#scan-input').click(); break;
    case 'toggle-found': {
      const i = Number(el.dataset.index);
      if (editor.checked.has(i)) editor.checked.delete(i);
      else if (editor.cardId) editor.checked = new Set([i]);
      else editor.checked.add(i);
      renderEditor();
      break;
    }
    case 'use-found': {
      const n = editor.checked.size;
      const first = editor.entries.findIndex((x) => entryState(editor, x) === 'empty');
      useFound(editor);
      renderEditor();
      $(`#kor-${first >= 0 ? first : editor.entries.length - n}`)?.closest('.entry')?.scrollIntoView({ behavior: 'smooth', block: 'start' });
      toast(n > 1 ? `카드 ${n}장에 채웠어요. 고쳐서 저장하세요.` : '입력칸에 채웠어요. 고쳐서 저장하세요.');
      break;
    }
    case 'add-entry':
      editor.entries.push({ korText: '', engText: '', note: '', category: editor.entries[editor.entries.length - 1].category });
      renderEditor();
      $(`#kor-${editor.entries.length - 1}`)?.focus();
      break;
    case 'remove-entry':
      editor.entries.splice(Number(el.dataset.index), 1);
      renderEditor();
      break;
    case 'remove-photo': {
      const list = el.dataset.side === 'kor' ? editor.korImages : editor.engImages;
      list.splice(Number(el.dataset.index), 1);
      renderEditor();
      break;
    }
    case 'backup': $('#backup').hidden = false; renderSyncStatus(); break;
    case 'login': startLogin(); break;
    case 'sync-now': syncNow({ quiet: false }); break;
    case 'logout': logout(); break;
    case 'delete-account': deleteAccount(); break;
    case 'backup-close': $('#backup').hidden = true; break;
    case 'export': exportBackup().catch(() => toast('백업 파일을 만들지 못했어요. 다시 시도해 주세요.')); break;
    case 'import': $('#backup-input').click(); break;
  }
});

document.addEventListener('input', (ev) => {
  if (!editor) return;
  if (ev.target.tagName !== 'TEXTAREA') return;
  const en = editor.entries[Number(ev.target.dataset.index)];
  if (!en) return;
  if (ev.target.dataset.side === 'kor') en.korText = ev.target.value;
  else en.engText = ev.target.value;
  updateSaveState();
});

document.addEventListener('keydown', (ev) => {
  if (ev.target.id === 'cat-input' && ev.key === 'Enter' && !ev.isComposing) {
    ev.preventDefault();
    addCategory();
    return;
  }
  if (ev.target.id === 'rename-input' && ev.key === 'Enter' && !ev.isComposing) {
    ev.preventDefault();
    saveRename();
  }
});

$('#scan-input').addEventListener('change', (ev) => {
  const files = [...ev.target.files];
  ev.target.value = '';
  if (files.length) scanPhotos(files);
});
$('#backup-input').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (file) importBackup(file).catch(() => toast('복원하지 못했어요. 파일을 다시 확인해 주세요.'));
});

// 1분·10분 뒤 다시 나오는 학습 단계 카드를 위해 주기적으로 확인
function tick() {
  if (!db) return;
  const sig = dueCards(new Date()).map((c) => c.id).join(',');
  if (sig !== ui.reviewSig) renderReview();
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (db) renderAll();
  if (db && user && Date.now() - (syncMeta.lastSyncAt || 0) > 10000) syncNow();
  // iOS 홈 화면 앱은 닫아도 메모리에서 그대로 돌아오는 경우가 많아서, 돌아올 때마다 새 버전 확인
  navigator.serviceWorker?.getRegistration().then((r) => r?.update()).catch(() => {});
});

/** 새 버전이 설치되면 한 번 새로고침해서 바로 적용 (편집 중이면 편집을 닫은 뒤에) */
let updateReady = false;
function reloadForUpdate() {
  if (editor) { updateReady = true; return; }
  location.reload();
}

// ================= 시작 =================
async function init() {
  db = await openDB();
  cards = await getAll('cards');
  const catRows = await getAll('categories');
  catNames = new Map(catRows.map((k) => [k.key, k.name]));
  catStamps = new Map(catRows.map((k) => [k.key, k.updatedAt ?? 0]));
  Object.assign(syncMeta, await getMeta('sync').catch(() => null));
  activity = await getAll('activity');
  // 공부 기록 저장소가 생기기 전의 복습 기록과 카드 추가 날짜로 채움 (한 번만)
  if (!(await getMeta('activitySeeded').catch(() => false))) {
    const reviews = await getAll('reviews');
    await recordActivity([...reviews.map((r) => reviewActivity(r.cardId, r.review)), ...cards.map(addActivity)]);
    await putMeta('activitySeeded', true);
  }
  renderAll();
  // Drive 동기화를 쓰던 이전 버전의 로그인 정보는 더 이상 쓰지 않음
  try { localStorage.removeItem('freedom-auth'); localStorage.removeItem('freedom-oauth-silent'); } catch {}
  if (fbReady) {
    // Google 로그인에서 돌아온 경우
    const login = await handleOAuthReturn().catch((err) => ({ error: errText(err) }));
    if (login && login !== 'ok') toast(login.error === 'access_denied' ? 'Google 로그인을 취소했어요.' : `로그인하지 못했어요. (${login.error})`);
    await fbAuth.authStateReady().catch(() => {});
    fb.onAuthStateChanged(fbAuth, (u) => {
      const changed = u?.uid !== user?.uid;
      user = u;
      renderSyncStatus();
      if (u && changed) syncNow({ announce: login === 'ok' });
    });
  }
  $('#app-version').textContent = `앱 버전 ${APP_VERSION}`;
  if ('serviceWorker' in navigator) {
    // 처음 설치될 때는 이미 최신이므로 새로고침하지 않음
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      reloading = true;
      reloadForUpdate();
    });
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}
init().catch((err) => {
  $('#review-main').innerHTML = `<div class="empty"><h2>저장소를 열지 못했어요</h2><p>개인정보 보호 브라우징을 끄고 다시 열어 주세요. (${esc(err?.message || err)})</p></div>`;
});
</script>
