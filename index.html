<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#EEF1F4" media="(prefers-color-scheme: light)">
<meta name="theme-color" content="#13161B" media="(prefers-color-scheme: dark)">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="mooni의 단어장">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" href="icons/icon-192.png">
<title>mooni의 단어장</title>
<style>
:root {
  --bg: #EEF1F4;
  --surface: #FFFFFF;
  --ink: #1B2430;
  --muted: #657080;
  --line: #D5DBE2;
  --accent: #4B4FD6;
  --accent-ink: #FFFFFF;
  --soft: #E3E6F8;
  --caption-bg: rgba(16, 20, 26, 0.88);
  --caption-ink: #FFFFFF;
  --again: #CC453C;
  --hard: #B97A10;
  --good: #218B5B;
  --easy: #3470C9;
  --sans: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Pretendard", "Noto Sans KR", "Malgun Gothic", system-ui, sans-serif;
  --serif: ui-serif, "New York", "Iowan Old Style", Georgia, "Times New Roman", serif;
  color-scheme: light dark;
  box-sizing: border-box;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #13161B; --surface: #1D2229; --ink: #E7EBF0; --muted: #97A1AD; --line: #2B323B;
    --accent: #8C8FF5; --accent-ink: #11131A; --soft: #262B45; --caption-bg: rgba(0, 0, 0, 0.72);
    --again: #F07068; --hard: #E0A23A; --good: #4CC08A; --easy: #6FA2F0;
  }
}
:root[data-theme="dark"] {
  --bg: #13161B; --surface: #1D2229; --ink: #E7EBF0; --muted: #97A1AD; --line: #2B323B;
  --accent: #8C8FF5; --accent-ink: #11131A; --soft: #262B45; --caption-bg: rgba(0, 0, 0, 0.72);
  --again: #F07068; --hard: #E0A23A; --good: #4CC08A; --easy: #6FA2F0;
}
*, *::before, *::after { box-sizing: inherit; }
html, body { height: 100%; margin: 0; }
html { -webkit-text-size-adjust: 100%; }
body {
  background: var(--bg); color: var(--ink);
  font: 16px/1.5 var(--sans);
  overscroll-behavior: none;
  -webkit-tap-highlight-color: transparent;
  word-break: keep-all; overflow-wrap: anywhere;
}
button { font: inherit; color: inherit; cursor: pointer; touch-action: manipulation; }
button:focus-visible, textarea:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
button:disabled { opacity: 0.4; cursor: default; }
img { max-width: 100%; }

/* ---------- 앱 뼈대 ---------- */
.app { height: 100%; display: flex; flex-direction: column; }
.view { flex: 1; display: flex; flex-direction: column; min-height: 0; }
[hidden] { display: none !important; }

.topbar {
  display: flex; align-items: center; gap: 10px;
  padding: calc(env(safe-area-inset-top, 0px) + 12px) 20px 10px;
}
.topbar h1 { flex: 1; margin: 0; font-size: 30px; font-weight: 800; letter-spacing: -0.02em; line-height: 1.15; }
.count { color: var(--muted); font-size: 14px; }
.pill {
  border: 0; border-radius: 999px; padding: 7px 14px;
  background: var(--soft); color: var(--accent); font-weight: 600; font-size: 15px;
}
.pill.solid { background: var(--accent); color: var(--accent-ink); }

.scroll { flex: 1; min-height: 0; overflow-y: auto; -webkit-overflow-scrolling: touch; padding: 6px 20px 28px; }
.actions { padding: 12px 20px; border-top: 1px solid var(--line); background: var(--bg); }

.tabbar {
  display: flex; background: var(--surface); border-top: 1px solid var(--line);
  padding-bottom: env(safe-area-inset-bottom, 0px);
}
.tab {
  flex: 1; border: 0; background: none; padding: 8px 0 6px;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 11px; color: var(--muted);
}
.tab svg { width: 24px; height: 24px; }
.tab[aria-selected="true"] { color: var(--accent); }

/* ---------- 카드 앞면(뜻) / 뒷면(자막) ---------- */
.prompt {
  background: var(--surface); border-radius: 18px; padding: 22px 20px;
  border: 1px solid var(--line);
}
.prompt-text {
  margin: 0; font-size: 22px; line-height: 1.45; font-weight: 650;
  white-space: pre-wrap; word-break: keep-all; overflow-wrap: anywhere;
}
.shots { display: flex; flex-direction: column; gap: 10px; }
.shots img { display: block; width: 100%; height: auto; border-radius: 10px; }
.prompt .shots + .prompt-text { margin-top: 16px; }
.prompt-text.serif { font-family: var(--serif); font-weight: 500; }
.answer-text { margin-top: 16px; text-align: center; }

.answer { margin-top: 22px; }
.answer .shots { margin-bottom: 4px; }
.caption {
  margin: 16px 0 0; text-align: center;
  font-family: var(--serif); font-size: 25px; line-height: 1.7;
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.caption span {
  background: var(--caption-bg); color: var(--caption-ink);
  padding: 5px 12px; border-radius: 6px;
  -webkit-box-decoration-break: clone; box-decoration-break: clone;
}
.reveal { animation: rise 0.22s ease-out; }
@keyframes rise { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }

/* ---------- 버튼 ---------- */
.btn {
  appearance: none; border: 0; border-radius: 12px; padding: 14px 18px;
  font-weight: 650; font-size: 16px; line-height: 1.2;
  background: var(--soft); color: var(--accent);
}
.btn.primary { background: var(--accent); color: var(--accent-ink); }
.btn.wide { width: 100%; }
.btn.danger { background: transparent; color: var(--again); border: 1px solid var(--line); }

.grades { display: grid; grid-template-columns: repeat(4, 1fr); gap: 8px; }
.grades.two { grid-template-columns: 1fr 1fr; gap: 10px; }
.grade {
  --c: var(--accent);
  border: 0; border-radius: 12px; padding: 9px 4px 10px;
  background: var(--surface);
  background: color-mix(in srgb, var(--c) 14%, var(--surface));
  color: var(--c);
  display: flex; flex-direction: column; align-items: center; gap: 1px;
}
.grade small { font-size: 12px; opacity: 0.85; }
.grade span { font-size: 16px; font-weight: 700; }
.grade.again { --c: var(--again); }
.grade.hard { --c: var(--hard); }
.grade.good { --c: var(--good); }
.grade.easy { --c: var(--easy); }

/* ---------- 빈 화면 ---------- */
.empty { padding: 48px 8px 0; text-align: center; }
.empty h2 { margin: 0 0 6px; font-size: 20px; }
.empty p { margin: 0 0 22px; color: var(--muted); }

/* ---------- 카드 목록 ---------- */
.card-list { list-style: none; margin: 0; padding: 0; background: var(--surface); border-radius: 18px; border: 1px solid var(--line); overflow: hidden; }
.card-list li + li .row { border-top: 1px solid var(--line); }
.row {
  display: flex; align-items: center; gap: 12px; width: 100%;
  border: 0; background: none; text-align: left; padding: 13px 16px;
}
.thumb { position: relative; flex: none; width: 52px; height: 52px; }
.thumb img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
.thumb b {
  position: absolute; right: 3px; bottom: 3px; font-size: 11px; line-height: 1;
  padding: 3px 5px; border-radius: 999px; background: rgba(0,0,0,.62); color: #fff;
}
.row-text { flex: 1; min-width: 0; display: flex; flex-direction: column; gap: 1px; }
.row-kor, .row-eng { white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.row-kor { font-weight: 600; }
.row-eng { font-family: var(--serif); color: var(--muted); }
.row-meta { display: flex; gap: 12px; font-size: 12px; color: var(--muted); margin-top: 2px; }
.row-meta .due-now { color: var(--accent); font-weight: 600; }

/* ---------- 전체화면 시트 (편집, 연습, 백업) ---------- */
.sheet {
  position: fixed; inset: 0; z-index: 20; background: var(--bg);
  display: flex; flex-direction: column;
  animation: slideup 0.24s ease-out;
}
@keyframes slideup { from { transform: translateY(24px); opacity: 0; } to { transform: none; opacity: 1; } }
.sheet-head {
  display: flex; align-items: center; gap: 6px;
  padding: calc(env(safe-area-inset-top, 0px) + 8px) 10px 8px;
  border-bottom: 1px solid var(--line); background: var(--bg);
}
.sheet-head h2 { flex: 1; margin: 0; text-align: center; font-size: 17px; font-weight: 700; }
.link { border: 0; background: none; color: var(--accent); font-size: 17px; padding: 8px 10px; min-width: 70px; }
.link.strong { font-weight: 700; }
.link.end { text-align: right; }
.link.start { text-align: left; }
.head-note { min-width: 70px; text-align: right; padding-right: 10px; color: var(--muted); font-size: 14px; }
.sheet-body { flex: 1; min-height: 0; overflow-y: auto; padding: 16px 20px calc(env(safe-area-inset-bottom, 0px) + 28px); }
.sheet .actions { padding-bottom: calc(env(safe-area-inset-bottom, 0px) + 12px); }

.field { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px; margin-bottom: 18px; display: flex; flex-direction: column; gap: 12px; }
.field h3 { margin: 0; font-size: 15px; font-weight: 700; }
.field h3 span { color: var(--muted); font-weight: 500; margin-left: 6px; }
textarea {
  width: 100%; min-height: 3.4em; resize: vertical;
  font: 18px/1.45 var(--sans); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
textarea.eng { font-family: var(--serif); }
.thumbs { display: flex; gap: 8px; overflow-x: auto; padding: 2px 0 4px; }
.thumbs figure { position: relative; flex: none; width: 96px; height: 96px; margin: 0; }
.thumbs img { width: 100%; height: 100%; object-fit: cover; border-radius: 8px; display: block; }
.thumbs figcaption {
  position: absolute; left: 4px; bottom: 4px; font-size: 11px; line-height: 1;
  padding: 3px 6px; border-radius: 999px; background: rgba(0,0,0,.62); color: #fff;
}
.thumbs .x {
  position: absolute; top: 4px; right: 4px; width: 26px; height: 26px; border-radius: 50%;
  border: 0; background: rgba(0,0,0,.62); color: #fff; font-size: 18px; line-height: 26px; padding: 0;
}
.hint { color: var(--muted); font-size: 14px; margin: -6px 0 16px; }
.chip { display: inline-block; margin-bottom: 12px; padding: 3px 11px; border-radius: 999px; background: var(--soft); color: var(--accent); font-size: 13px; font-weight: 600; }

/* ---------- 학습 방향 / 카테고리 칩 ---------- */
.filters { display: flex; gap: 8px; padding: 2px 20px 10px; overflow-x: auto; -webkit-overflow-scrolling: touch; scrollbar-width: none; }
.filters::-webkit-scrollbar { display: none; }
.sheet .filters { padding-top: 12px; }
.chips { display: flex; flex-wrap: wrap; gap: 8px; }
.cat {
  flex: none; border: 1px solid var(--line); border-radius: 999px; padding: 6px 13px;
  background: var(--surface); color: var(--ink); font-size: 14px; line-height: 1.3; white-space: nowrap;
}
.cat small { margin-left: 5px; opacity: 0.7; }
.cat[aria-pressed="true"] { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); font-weight: 600; }
.cat.ghost { background: none; border-style: dashed; color: var(--muted); }
.seg { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.seg-btn {
  border: 1px solid var(--line); border-radius: 14px; padding: 12px 10px;
  background: var(--bg); color: var(--ink); text-align: center;
  display: flex; flex-direction: column; align-items: center; gap: 2px;
  font-size: 17px; font-weight: 700;
}
.seg-btn small { font-size: 12px; font-weight: 500; color: var(--muted); }
.seg-btn[aria-pressed="true"] { background: var(--soft); border-color: var(--accent); color: var(--accent); }
.seg-btn[aria-pressed="true"] small { color: var(--accent); }
.setup-title { margin: 8px 0 14px; font-size: 20px; font-weight: 750; }
.setup-note { margin: -8px 0 16px; color: var(--muted); }
.summary { flex: 1; min-width: 0; align-self: center; color: var(--muted); font-size: 14px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
/* ---------- 기록(캘린더) ---------- */
.streak { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 16px 18px; margin-bottom: 10px; display: flex; flex-direction: column; gap: 2px; }
.streak b { font-size: 26px; font-weight: 800; line-height: 1.2; }
.streak small, .tile small { color: var(--muted); font-size: 14px; }
.tiles { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
.tile { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 12px 14px; display: flex; flex-direction: column; }
.tile b { font-size: 21px; font-weight: 750; }
.cal { background: var(--surface); border: 1px solid var(--line); border-radius: 18px; padding: 10px 12px 14px; margin-bottom: 10px; }
.cal-head { display: flex; align-items: center; justify-content: space-between; margin-bottom: 6px; }
.cal-head h2 { margin: 0; font-size: 17px; font-weight: 700; }
.cal-nav { border: 0; background: none; color: var(--accent); font-size: 26px; line-height: 1; width: 44px; height: 40px; border-radius: 10px; }
.cal-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.wd { text-align: center; font-size: 12px; color: var(--muted); padding: 2px 0 4px; }
.day {
  position: relative; aspect-ratio: 1; border: 0; border-radius: 8px; padding: 0;
  display: flex; align-items: center; justify-content: center;
  background: var(--bg); color: var(--ink); font-size: 14px; font-variant-numeric: tabular-nums;
}
.day.l1 { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.day.l2 { background: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.day.l3 { background: color-mix(in srgb, var(--accent) 70%, var(--surface)); }
.day.l4 { background: var(--accent); color: var(--accent-ink); font-weight: 700; }
.day.future { opacity: 0.35; }
.day.today { box-shadow: inset 0 0 0 2px var(--ink); }
.day[aria-pressed="true"] { outline: 2px solid var(--accent); outline-offset: 2px; }
.day .add-dot { position: absolute; bottom: 4px; left: 50%; width: 4px; height: 4px; margin-left: -2px; border-radius: 50%; background: var(--muted); }
.legend { display: flex; align-items: center; justify-content: flex-end; flex-wrap: wrap; gap: 4px; margin-top: 10px; font-size: 12px; color: var(--muted); }
.legend i { display: inline-block; width: 12px; height: 12px; border-radius: 3px; }
.legend i.l1 { background: color-mix(in srgb, var(--accent) 22%, var(--surface)); }
.legend i.l2 { background: color-mix(in srgb, var(--accent) 45%, var(--surface)); }
.legend i.l3 { background: color-mix(in srgb, var(--accent) 70%, var(--surface)); }
.legend i.l4 { background: var(--accent); }
.legend .gap { width: 10px; }
.legend i.dot { width: 5px; height: 5px; border-radius: 50%; background: var(--muted); }
.day-rows { list-style: none; margin: 0; padding: 0; }
.day-rows li { display: flex; justify-content: space-between; padding: 7px 0; border-top: 1px solid var(--line); }
.day-rows li:first-child { border-top: 0; }
.day-rows b { font-variant-numeric: tabular-nums; }
input.text {
  width: 100%; font: 17px/1.4 var(--sans); color: var(--ink);
  background: var(--bg); border: 1px solid var(--line); border-radius: 10px; padding: 10px 12px;
}
input.text:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }

.backup-text { color: var(--muted); margin: 0 0 18px; }
.version { margin: 28px 0 0; text-align: center; color: var(--muted); font-size: 13px; }
.section-title { margin: 26px 0 8px; font-size: 15px; font-weight: 700; }
.sync-line { margin: 0; color: var(--muted); font-size: 15px; }
.sync-line.warn { color: var(--hard); }
.pill .dot { display: inline-block; width: 7px; height: 7px; margin-left: 5px; border-radius: 50%; background: var(--hard); vertical-align: 2px; }
.stack { display: flex; flex-direction: column; gap: 10px; }

.toast {
  position: fixed; left: 50%; top: calc(env(safe-area-inset-top, 0px) + 64px); transform: translateX(-50%);
  z-index: 40; max-width: calc(100% - 40px);
  background: var(--ink); color: var(--bg); padding: 10px 16px; border-radius: 12px; font-size: 14px;
}

@media (prefers-reduced-motion: reduce) {
  .reveal, .sheet { animation: none; }
}
@media (min-width: 700px) {
  .scroll, .sheet-body, .actions, .filters { padding-left: max(20px, calc(50% - 300px)); padding-right: max(20px, calc(50% - 300px)); }
}
</style>
</head>
<body>
<div class="app">
  <!-- 복습 -->
  <section class="view" id="view-review">
    <header class="topbar">
      <h1>복습</h1>
      <span class="count" id="due-count"></span>
      <button class="pill" data-act="practice" id="practice-open">자유 연습</button>
    </header>
    <div class="filters" id="review-filters" hidden></div>
    <main class="scroll" id="review-main"></main>
    <div class="actions" id="review-actions" hidden></div>
  </section>

  <!-- 카드 목록 -->
  <section class="view" id="view-cards" hidden>
    <header class="topbar">
      <h1 id="cards-title">표현</h1>
      <button class="pill" data-act="backup" id="sync-pill">동기화</button>
      <button class="pill solid" data-act="add" aria-label="표현 추가">추가</button>
    </header>
    <div class="filters" id="cards-filters" hidden></div>
    <main class="scroll" id="cards-main"></main>
  </section>

  <!-- 기록 (캘린더) -->
  <section class="view" id="view-stats" hidden>
    <header class="topbar">
      <h1>기록</h1>
    </header>
    <main class="scroll" id="stats-main"></main>
  </section>

  <nav class="tabbar" role="tablist">
    <button class="tab" role="tab" data-tab="review" aria-selected="true">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="4" y="3.5" width="16" height="11" rx="2.5"/><path d="M7 18h10M9 21h6"/></svg>
      복습
    </button>
    <button class="tab" role="tab" data-tab="cards" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M8 6h12M8 12h12M8 18h12"/><circle cx="4" cy="6" r="1"/><circle cx="4" cy="12" r="1"/><circle cx="4" cy="18" r="1"/></svg>
      카드
    </button>
    <button class="tab" role="tab" data-tab="stats" aria-selected="false">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3.5" y="5" width="17" height="15.5" rx="2.5"/><path d="M3.5 10h17M8 3v4M16 3v4"/><path d="M8 14h2M14 14h2M8 17.5h2"/></svg>
      기록
    </button>
  </nav>
</div>

<div class="sheet" id="editor" hidden></div>
<div class="sheet" id="practice" hidden></div>
<div class="sheet" id="backup" hidden>
  <header class="sheet-head">
    <button class="link start" data-act="backup-close">닫기</button>
    <h2>동기화 · 백업</h2>
    <span class="head-note"></span>
  </header>
  <div class="sheet-body">
    <div id="sync-box"></div>
    <h3 class="section-title">파일로 백업</h3>
    <p class="backup-text">Drive와 별개로, 지금 데이터를 파일 하나로 저장하거나 그 파일에서 되살릴 수 있어요.</p>
    <div class="stack">
      <button class="btn primary wide" data-act="export">백업 파일 만들기</button>
      <button class="btn wide" data-act="import">백업 파일에서 복원하기</button>
    </div>
    <p class="version" id="app-version"></p>
  </div>
</div>

<input type="file" id="photo-input" accept="image/*" multiple hidden>
<input type="file" id="backup-input" accept="application/json,.json" hidden>
<div class="toast" id="toast" role="status" aria-live="polite" hidden></div>

<script type="module">
import { fsrs, generatorParameters, createEmptyCard, Rating } from './vendor/ts-fsrs.mjs';

// ================= 설정 =================
// FSRS-6 기본 파라미터, 목표 유지율 90%, 간격에 약간의 랜덤(fuzz)
const scheduler = fsrs(generatorParameters({ request_retention: 0.9, enable_fuzz: true }));
const GRADES = [
  { r: Rating.Again, label: '다시', cls: 'again' },
  { r: Rating.Hard, label: '어려움', cls: 'hard' },
  { r: Rating.Good, label: '알맞음', cls: 'good' },
  { r: Rating.Easy, label: '쉬움', cls: 'easy' },
];
// 자유 연습: 맞음 +1, 틀림 -2, 최근 본 3장은 바로 다시 안 나옴
const PRACTICE = { correct: 1, wrong: -2, recentExclude: 3 };
const IMAGE_MAX = 1600;      // 사진 긴 변 최대 픽셀
const IMAGE_QUALITY = 0.8;   // JPEG 품질

// ================= 저장소 (IndexedDB) =================
let db;
function openDB() {
  return new Promise((resolve, reject) => {
    // v2: categories, v3: meta(동기화 상태), v4: activity(공부 기록) 저장소 추가. 기존 cards, reviews는 그대로
    const req = indexedDB.open('freedom', 4);
    req.onupgradeneeded = () => {
      const d = req.result;
      if (!d.objectStoreNames.contains('cards')) d.createObjectStore('cards', { keyPath: 'id' });
      if (!d.objectStoreNames.contains('reviews')) {
        const s = d.createObjectStore('reviews', { keyPath: 'id', autoIncrement: true });
        s.createIndex('cardId', 'cardId');
      }
      if (!d.objectStoreNames.contains('categories')) d.createObjectStore('categories', { keyPath: 'key' });
      if (!d.objectStoreNames.contains('meta')) d.createObjectStore('meta');
      if (!d.objectStoreNames.contains('activity')) d.createObjectStore('activity', { keyPath: 'id' });
    };
    req.onsuccess = () => {
      const d = req.result;
      d.onversionchange = () => d.close();
      resolve(d);
    };
    req.onerror = () => reject(req.error);
  });
}
const done = (t) => new Promise((res, rej) => {
  t.oncomplete = () => res();
  t.onerror = () => rej(t.error);
  t.onabort = () => rej(t.error);
});
const getAll = (name) => new Promise((res, rej) => {
  const r = db.transaction(name).objectStore(name).getAll();
  r.onsuccess = () => res(r.result);
  r.onerror = () => rej(r.error);
});
/** iOS는 앱이 백그라운드에 있는 동안 저장소 연결을 끊기도 해서, 실패하면 다시 연결해 한 번 더 시도 */
async function withReconnect(run) {
  try {
    return await run();
  } catch (err) {
    try { db.close(); } catch {}
    db = await openDB();
    return await run();
  }
}
const errText = (err) => (err ? `${err.name || ''} ${err.message || err}`.trim() : '알 수 없는 오류');

function putCard(card) {
  return withReconnect(async () => {
    const t = db.transaction('cards', 'readwrite');
    t.objectStore('cards').put(card);
    await done(t);
  });
}
function putCategoryNames(entries) {
  return withReconnect(async () => {
    const t = db.transaction('categories', 'readwrite');
    entries.forEach((e) => t.objectStore('categories').put(e));
    await done(t);
  });
}
function addReview(review) {
  return withReconnect(async () => {
    const t = db.transaction('reviews', 'readwrite');
    t.objectStore('reviews').add(review);
    await done(t);
  });
}
function addReviews(list) {
  return withReconnect(async () => {
    const t = db.transaction('reviews', 'readwrite');
    list.forEach((r) => t.objectStore('reviews').add(r));
    await done(t);
  });
}
/** 공부 기록 저장. id가 정해져 있어서 같은 기록을 여러 번 넣어도 하나로 남음 */
function putActivity(list) {
  if (!list.length) return Promise.resolve();
  return withReconnect(async () => {
    const t = db.transaction('activity', 'readwrite');
    list.forEach((a) => t.objectStore('activity').put(a));
    await done(t);
  });
}
function getMeta(key) {
  return withReconnect(() => new Promise((res, rej) => {
    const r = db.transaction('meta').objectStore('meta').get(key);
    r.onsuccess = () => res(r.result);
    r.onerror = () => rej(r.error);
  }));
}
function putMeta(key, value) {
  return withReconnect(async () => {
    const t = db.transaction('meta', 'readwrite');
    t.objectStore('meta').put(value, key);
    await done(t);
  });
}
function removeCard(id) {
  return withReconnect(() => removeCardOnce(id));
}
async function removeCardOnce(id) {
  const t = db.transaction(['cards', 'reviews'], 'readwrite');
  t.objectStore('cards').delete(id);
  const reviews = t.objectStore('reviews');
  reviews.index('cardId').openKeyCursor(IDBKeyRange.only(id)).onsuccess = (e) => {
    const cursor = e.target.result;
    if (cursor) { reviews.delete(cursor.primaryKey); cursor.continue(); }
  };
  await done(t);
}
async function replaceAll(newCards, newReviews, newCategories) {
  const t = db.transaction(['cards', 'reviews', 'categories'], 'readwrite');
  const cs = t.objectStore('cards'), rs = t.objectStore('reviews'), ks = t.objectStore('categories');
  cs.clear(); rs.clear(); ks.clear();
  newCards.forEach((c) => cs.put(c));
  newReviews.forEach(({ id, ...rest }) => rs.add(rest));
  newCategories.forEach((k) => ks.put(k));
  await done(t);
}

const $ = (sel) => document.querySelector(sel);
const esc = (s) => String(s ?? '').replace(/[&<>"']/g, (c) => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
const toDate = (d) => (d instanceof Date ? d : new Date(d));
const uid = () => (crypto.randomUUID ? crypto.randomUUID() : Date.now().toString(36) + Math.random().toString(36).slice(2));

function intervalText(due, now) {
  const minutes = Math.max(0, toDate(due) - now) / 60000;
  if (minutes < 60) return `${Math.max(1, Math.round(minutes))}분`;
  const hours = minutes / 60;
  if (hours < 24) return `${Math.round(hours)}시간`;
  const days = hours / 24;
  if (days < 30) return `${Math.round(days)}일`;
  if (days < 365) return `${(days / 30).toFixed(1)}개월`;
  return `${(days / 365).toFixed(1)}년`;
}
const formatDay = (d) => toDate(d).toLocaleDateString('ko-KR', { month: 'long', day: 'numeric' });

const urlCache = new WeakMap();
function blobURL(blob) {
  let url = urlCache.get(blob);
  if (!url) { url = URL.createObjectURL(blob); urlCache.set(blob, url); }
  return url;
}

let toastTimer;
function toast(message) {
  const el = $('#toast');
  el.textContent = message;
  el.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(() => { el.hidden = true; }, 2600);
}

/** 사진을 긴 변 1600px 이하 JPEG로 줄이기 */
function compressImage(file) {
  return new Promise((resolve) => {
    const url = URL.createObjectURL(file);
    const img = new Image();
    img.onload = () => {
      const scale = Math.min(1, IMAGE_MAX / Math.max(img.naturalWidth, img.naturalHeight));
      const w = Math.round(img.naturalWidth * scale), h = Math.round(img.naturalHeight * scale);
      const canvas = document.createElement('canvas');
      canvas.width = w; canvas.height = h;
      canvas.getContext('2d').drawImage(img, 0, 0, w, h);
      URL.revokeObjectURL(url);
      canvas.toBlob((blob) => resolve(blob || file), 'image/jpeg', IMAGE_QUALITY);
    };
    img.onerror = () => { URL.revokeObjectURL(url); resolve(null); };
    img.src = url;
  });
}

// ================= 카테고리 =================
const catKey = (c) => c.category || DEFAULT_CATEGORY;
const catName = (key) => catNames.get(key) ?? key;
const catOf = (c) => catName(catKey(c));

/** 이름으로 카테고리 키 찾기. 없으면 새 키를 만들고, 키와 이름이 다르면 이름도 저장 */
async function keyForName(name) {
  const keys = new Set([...cards.map(catKey), ...catNames.keys()]);
  const found = [...keys].find((k) => catName(k) === name);
  if (found) return found;
  const key = keys.has(name) ? `${name}~${uid().slice(0, 8)}` : name;
  if (key !== name) {
    const updatedAt = Date.now();
    await putCategoryNames([{ key, name, updatedAt }]);
    catNames.set(key, name);
    catStamps.set(key, updatedAt);
  }
  return key;
}

function categoryList() {
  const counts = new Map();
  cards.forEach((c) => counts.set(catOf(c), (counts.get(catOf(c)) || 0) + 1));
  return [...counts.keys()]
    .sort((a, b) => (a === DEFAULT_CATEGORY ? -1 : b === DEFAULT_CATEGORY ? 1 : a.localeCompare(b, 'ko')))
    .map((name) => ({ name, count: counts.get(name) }));
}

/** 복습·자유 연습에 고른 카테고리 (지금 있는 것만). 비어 있으면 전체 */
function selectedCats() {
  const names = new Set(categoryList().map((c) => c.name));
  return (study.cats || []).filter((c) => names.has(c));
}
function studyCards() {
  const sel = new Set(selectedCats());
  return sel.size ? cards.filter((c) => sel.has(catOf(c))) : cards;
}

function toggleStudyCat(name) {
  const all = categoryList();
  const sel = new Set(selectedCats());
  if (name == null) sel.clear();
  else if (sel.has(name)) sel.delete(name);
  else sel.add(name);
  study.cats = sel.size && sel.size < all.length ? [...sel] : null;
  saveStudy();
  studyChanged();
}
function setDirection(dir) {
  if (!DIRECTIONS[dir]) return;
  study.dir = dir;
  saveStudy();
  studyChanged();
}

/** 진행 중에 보이는 설정 요약 + 설정으로 돌아가기 */
function studySummaryHTML(stopAct) {
  const sel = selectedCats();
  const cats = categoryList().length > 1 ? ` · ${sel.length ? sel.map(esc).join(', ') : '전체'}` : '';
  return `<span class="summary">${DIRECTIONS[study.dir].label}${cats}</span>
    <button class="cat ghost" data-act="${stopAct}">설정 바꾸기</button>`;
}

async function renameCategory(from, name) {
  ui.renaming = null;
  if (!name || name === from) { renderCards(); return; }
  const keys = [...new Set([...cards.map(catKey), ...catNames.keys()])].filter((k) => catName(k) === from);
  const updatedAt = Date.now();
  await putCategoryNames(keys.map((key) => ({ key, name, updatedAt })));
  keys.forEach((key) => { catNames.set(key, name); catStamps.set(key, updatedAt); });
  markChanged();
  if (study.cats) {
    study.cats = [...new Set(study.cats.map((c) => (c === from ? name : c)))];
    saveStudy();
  }
  ui.cardsCat = name;
  renderAll();
  toast(`카테고리 이름을 '${name}'(으)로 바꿨어요.`);
}

// ================= 복습 =================
function dueCards(now) {
  return studyCards()
    .filter((c) => toDate(c.srs.due) <= now)
    .sort((a, b) => toDate(a.srs.due) - toDate(b.srs.due));
}

function renderReview() {
  const now = new Date();
  const due = dueCards(now);
  ui.reviewSig = due.map((c) => c.id).join(',');
  $('#due-count').textContent = due.length ? `${due.length}장 남음` : '';
  $('#practice-open').disabled = cards.length === 0;
  const main = $('#review-main'), bar = $('#review-actions'), filters = $('#review-filters');
  if (!due.length) ui.reviewStarted = false;

  if (!cards.length) {
    filters.hidden = true;
    main.innerHTML = `<div class="empty">
      <h2>아직 표현이 없어요</h2>
      <p>카드 탭에서 유튜브에서 본 표현을 추가해 보세요.</p>
      <button class="btn primary" data-act="add">표현 추가하기</button>
    </div>`;
    bar.hidden = true; bar.innerHTML = '';
    return;
  }

  // 시작 전: 방향·카테고리를 고르는 화면 (카드는 아직 안 보여 줌)
  if (!ui.reviewStarted) {
    ui.reviewShow = false; ui.reviewCardId = null;
    filters.hidden = true;
    let head = `<h2 class="setup-title">지금 복습할 카드 ${due.length}장</h2>`;
    if (!due.length) {
      const next = studyCards().map((c) => toDate(c.srs.due)).filter((d) => d > now).sort((a, b) => a - b)[0];
      head = `<h2 class="setup-title">지금 복습할 카드가 없어요</h2>
        <p class="setup-note">${next ? `다음 복습은 ${intervalText(next, now)} 뒤예요. ` : ''}그 전에 풀고 싶으면 자유 연습을 해 보세요.</p>`;
    }
    main.innerHTML = head + setupHTML();
    bar.hidden = false;
    bar.innerHTML = due.length
      ? `<button class="btn primary wide" data-act="review-start">복습 시작 · ${due.length}장</button>`
      : '<button class="btn wide" data-act="practice">자유 연습하기</button>';
    return;
  }

  filters.hidden = false;
  filters.innerHTML = studySummaryHTML('review-stop');
  const card = due[0];
  if (ui.reviewCardId !== card.id) { ui.reviewCardId = card.id; ui.reviewShow = false; }
  main.innerHTML = promptHTML(card) + (ui.reviewShow ? answerHTML(card) : '');
  bar.hidden = false;
  if (!ui.reviewShow) {
    bar.innerHTML = '<button class="btn primary wide" data-act="reveal">정답 보기</button>';
  } else {
    const preview = scheduler.repeat(card.srs, now);
    bar.innerHTML = `<div class="grades">${GRADES.map((g) => `
      <button class="grade ${g.cls}" data-act="grade" data-r="${g.r}">
        <small>${intervalText(preview[g.r].card.due, now)}</small><span>${g.label}</span>
      </button>`).join('')}</div>`;
  }
}

async function gradeCard(rating) {
  const card = cards.find((c) => c.id === ui.reviewCardId);
  if (!card) return;
  const now = new Date();
  const { card: next, log } = scheduler.next(card.srs, now, rating);
  card.srs = next;
  card.studyAt = card.updatedAt = Date.now();
  await putCard(card);
  await addReview({ cardId: card.id, ...log });
  await recordActivity([reviewActivity(card.id, now)]);
  markChanged();
  ui.reviewShow = false;
  renderReview();
  $('#review-main').scrollTop = 0;
}

// ================= 자유 연습 =================
function pickPractice() {
  const studyList = studyCards();
  if (!studyList.length) { practice.currentId = null; return; }
  const n = Math.min(PRACTICE.recentExclude, studyList.length - 1);
  const recent = practice.recent.filter((id) => studyList.some((c) => c.id === id));
  const excluded = new Set(n > 0 ? recent.slice(-n) : []);
  const candidates = studyList.filter((c) => !excluded.has(c.id));
  const lowest = Math.min(...candidates.map((c) => c.practiceScore));
  const pool = candidates.filter((c) => c.practiceScore === lowest);
  practice.currentId = pool[Math.floor(Math.random() * pool.length)].id;
}

function openPractice() {
  practice.recent = []; practice.solved = 0; practice.show = false; practice.open = true; practice.started = false;
  const el = $('#practice');
  el.innerHTML = `<header class="sheet-head">
      <button class="link start" data-act="practice-close">끝내기</button>
      <h2>자유 연습</h2>
      <span class="head-note" id="practice-solved"></span>
    </header>
    <div class="filters" id="practice-filters"></div>
    <div class="sheet-body" id="practice-body"></div>
    <div class="actions" id="practice-actions"></div>`;
  el.hidden = false;
  renderPractice();
}
function closePractice() {
  practice.open = false;
  $('#practice').hidden = true;
  $('#practice').innerHTML = '';
  renderAll();
}

function renderPractice() {
  const card = cards.find((c) => c.id === practice.currentId);
  const body = $('#practice-body'), bar = $('#practice-actions'), filters = $('#practice-filters');
  $('#practice-solved').textContent = practice.solved ? `${practice.solved}장 풀었어요` : '';
  if (!practice.started) {
    filters.hidden = true;
    body.innerHTML = `<h2 class="setup-title">연습할 카드 ${studyCards().length}장</h2>` + setupHTML();
    bar.hidden = false;
    bar.innerHTML = '<button class="btn primary wide" data-act="practice-start">연습 시작</button>';
    return;
  }
  filters.hidden = false;
  filters.innerHTML = studySummaryHTML('practice-stop');
  if (!card) {

async function answerPractice(correct) {
  const card = cards.find((c) => c.id === practice.currentId);
  if (!card) return;
  card.practiceScore += correct ? PRACTICE.correct : PRACTICE.wrong;
  card.practiceCount += 1;
  card.studyAt = card.updatedAt = Date.now();
  await putCard(card);
  await recordActivity([{ id: `p|${card.id}|${card.studyAt}`, at: card.studyAt }]);
  markChanged();
  practice.recent.push(card.id);
  if (practice.recent.length > 10) practice.recent.shift();

// ================= Google Drive 동기화 =================
// 이 기기(IndexedDB)가 원본이고, Drive는 같은 계정의 기기들이 함께 쓰는 사본.
// Drive에는 data.json(카드·기록·카테고리)과 사진 파일(img-<해시>.jpg)을 둠.
// 병합은 카드 단위로, 내용(글·사진·카테고리, contentAt)과 학습 기록(복습 일정·연습 점수, studyAt)을
// 따로 비교해 각각 더 나중에 바뀐 쪽을 씀. 그래서 한 기기에서 고치고 다른 기기에서 복습해도 둘 다 남음.
// 삭제는 deleted에 시각과 함께 기록.
const DRIVE_API = 'https://www.googleapis.com/drive/v3';
const DRIVE_UPLOAD = 'https://www.googleapis.com/upload/drive/v3';
const DATA_FILE = 'data.json';

const auth = loadAuth();                 // { connected, email, token, exp } (이 기기에만 저장)
const syncMeta = { seq: 0, syncedSeq: 0, deleted: {}, lastSyncAt: 0 };   // IndexedDB meta에 저장
const sync = { running: false, again: false, timer: null, error: null, gcDone: false };

function loadAuth() {
  try {
    const a = JSON.parse(localStorage.getItem(AUTH_KEY));
    if (a && a.connected) return a;
  } catch {}
  return { connected: false };
}
function saveAuth() {
  try { localStorage.setItem(AUTH_KEY, JSON.stringify(auth)); } catch {}
}
const tokenValid = () => !!(auth.connected && auth.token && auth.exp - Date.now() > 60000);
const contentAt = (c) => c.contentAt ?? 0;
const studyAt = (c) => c.studyAt ?? 0;
const touchedAt = (c) => Math.max(contentAt(c), studyAt(c));
const pendingCount = () => Math.max(0, syncMeta.seq - syncMeta.syncedSeq);
const saveSyncMeta = () => putMeta('sync', { ...syncMeta });

/** 로컬에서 무언가 바뀌었을 때: 기록해 두고 잠시 뒤 Drive에 올림 */
function markChanged() {
  syncMeta.seq += 1;
  saveSyncMeta().catch(() => {});
  renderSyncStatus();
  scheduleSync();
}
function scheduleSync(delay = 3000) {
  clearTimeout(sync.timer);
  if (!tokenValid()) return;
  sync.timer = setTimeout(() => syncNow(), delay);
}

// ----- 로그인 (아이폰 홈 화면 앱에서도 되도록 팝업 대신 페이지 이동 방식) -----
const redirectUri = () => new URL('./', location.href).href;
function startLogin(silent) {
  const state = uid();
  try { localStorage.setItem(OAUTH_STATE_KEY, JSON.stringify({ state, silent })); } catch {}
  const params = new URLSearchParams({
    client_id: GOOGLE.clientId,
    redirect_uri: redirectUri(),
    response_type: 'token',
    scope: GOOGLE.scope,
    include_granted_scopes: 'true',
    state,
  });
  if (silent) params.set('prompt', 'none');
  if (auth.email) params.set('login_hint', auth.email);
  location.assign(`https://accounts.google.com/o/oauth2/v2/auth?${params}`);
}
/** 로그인하고 돌아왔으면 주소의 #access_token 처리. 반환: 'ok' | { error, silent } | null */
function handleOAuthReturn() {
  if (!/[#&]state=/.test(location.hash)) return null;
  const p = new URLSearchParams(location.hash.slice(1));
  history.replaceState(null, '', location.pathname + location.search);
  let saved = null;
  try {
    saved = JSON.parse(localStorage.getItem(OAUTH_STATE_KEY));
    localStorage.removeItem(OAUTH_STATE_KEY);
  } catch {}
  if (!saved || p.get('state') !== saved.state) return null;
  if (p.get('access_token')) {
    auth.connected = true;
    auth.token = p.get('access_token');
    auth.exp = Date.now() + Number(p.get('expires_in') || 3600) * 1000;
    saveAuth();
    return 'ok';
  }
  return { error: p.get('error') || 'unknown', silent: !!saved.silent };
}
/** 로그인이 만료됐으면 화면 전환 없이(사용자 입력 없이) 다시 받아오기. 공부·편집 중이거나 최근에 시도했으면 안 함 */
function trySilentLogin() {
  if (!auth.connected || tokenValid() || !navigator.onLine) return false;
  if (editor || practice.open || ui.reviewStarted || !$('#backup').hidden) return false;
  let last = 0;
  try { last = Number(localStorage.getItem(SILENT_LOGIN_KEY)) || 0; } catch {}
  if (Date.now() - last < 10 * 60000) return false;
  try { localStorage.setItem(SILENT_LOGIN_KEY, String(Date.now())); } catch {}
  startLogin(true);
  return true;
}
async function disconnectDrive() {
  if (!confirm('Google Drive 연결을 해제할까요? 이 기기의 카드는 그대로 남고, Drive에 저장된 데이터도 지워지지 않아요.')) return;
  const token = auth.token;
  auth.connected = false; auth.token = null; auth.email = null;
  saveAuth();
  clearTimeout(sync.timer);
  if (token) {
    fetch(`https://oauth2.googleapis.com/revoke?token=${encodeURIComponent(token)}`, {
      method: 'POST', headers: { 'Content-Type': 'application/x-www-form-urlencoded' },
    }).catch(() => {});
  }
  renderSyncStatus();
  toast('Google Drive 연결을 해제했어요.');
}

// ----- Drive API -----
class AuthNeeded extends Error {
  constructor() { super('Google 로그인이 필요해요'); this.name = 'AuthNeeded'; }
}
async function gfetch(url, opts = {}) {
  if (!tokenValid()) throw new AuthNeeded();
  const res = await fetch(url, { ...opts, headers: { ...(opts.headers || {}), Authorization: `Bearer ${auth.token}` } });
  if (res.status === 401) {
    auth.token = null;
    saveAuth();
    throw new AuthNeeded();
  }
  if (!res.ok) throw new Error(`Drive 오류 ${res.status}`);
  return res;
}
async function driveList(q, fields = 'id,name') {
  const files = [];
  let pageToken = '';
  do {
    const params = new URLSearchParams({ spaces: 'appDataFolder', q, fields: `nextPageToken,files(${fields})`, pageSize: '1000' });
    if (pageToken) params.set('pageToken', pageToken);
    const data = await (await gfetch(`${DRIVE_API}/files?${params}`)).json();
    files.push(...(data.files || []));
    pageToken = data.nextPageToken || '';
  } while (pageToken);
  return files;
}
const driveDownload = (id) => gfetch(`${DRIVE_API}/files/${id}?alt=media`);
// 본문은 Blob 대신 바이트(ArrayBuffer)로 보냄 (iOS에서 저장소의 사진 Blob을 바로 보내면 실패하는 경우가 있음)
async function driveUpload({ id, name, type, data }) {
  if (id) {
    const res = await gfetch(`${DRIVE_UPLOAD}/files/${id}?uploadType=media&fields=id`, {
      method: 'PATCH', headers: { 'Content-Type': type }, body: await data.arrayBuffer(),
    });
    return (await res.json()).id;
  }
  const boundary = `mooni${uid().replace(/-/g, '')}`;
  const body = new Blob([
    `--${boundary}\r\nContent-Type: application/json; charset=UTF-8\r\n\r\n`,
    JSON.stringify({ name, parents: ['appDataFolder'] }),
    `\r\n--${boundary}\r\nContent-Type: ${type}\r\n\r\n`,
    data,
    `\r\n--${boundary}--`,
  ]);
  const res = await gfetch(`${DRIVE_UPLOAD}/files?uploadType=multipart&fields=id`, {
    method: 'POST', headers: { 'Content-Type': `multipart/related; boundary=${boundary}` }, body: await body.arrayBuffer(),
  });
  return (await res.json()).id;
}

// ----- 사진: 내용 해시로 구분해서 같은 사진은 한 번만 올림 -----
const hashCache = new WeakMap();
function blobHash(blob) {
  let h = hashCache.get(blob);
  if (!h) {
    h = blob.arrayBuffer()
      .then((buf) => crypto.subtle.digest('SHA-256', buf))
      .then((d) => [...new Uint8Array(d)].slice(0, 16).map((b) => b.toString(16).padStart(2, '0')).join(''));
    hashCache.set(blob, h);
  }
  return h;
}

/** Drive의 카드 → 이 기기의 카드. 이미 가진 사진은 다시 받지 않음.
    iOS는 저장소에서 읽은 사진 Blob을 다른 카드 객체에 담아 다시 저장하면 사진이 깨질 수 있어서,
    가진 사진도 바이트를 복사한 새 Blob으로 만들어 새 카드를 추가할 때와 같은 방식으로 저장함 */
async function cardFromRemote(rc, local, imageIds) {
  const localByHash = new Map();
  if (local) {
    for (const b of [...local.korImages, ...local.engImages]) localByHash.set(await blobHash(b), b);
  }
  const load = async (h) => {
    if (localByHash.has(h)) {
      const old = localByHash.get(h);
      const copy = new Blob([await old.arrayBuffer()], { type: old.type || 'image/jpeg' });
      hashCache.set(copy, Promise.resolve(h));
      return copy;
    }
    if (!imageIds[h]) return null;
    const got = await (await driveDownload(imageIds[h])).blob();
    const blob = got.type.startsWith('image/') ? got : new Blob([got], { type: 'image/jpeg' });
    hashCache.set(blob, Promise.resolve(h));
    return blob;
  };
  const korImages = (await Promise.all((rc.korImages || []).map(load))).filter(Boolean);
  const engImages = (await Promise.all((rc.engImages || []).map(load))).filter(Boolean);
  return reviveCard({ ...rc, korImages, engImages });
}

const reviewKey = (r) => `${r.cardId}|${toDate(r.review).getTime()}`;

async function runSync() {
  // 1. Drive에서 받기
  const [file] = await driveList(`name='${DATA_FILE}' and trashed=false`);
  let remote = {};
  if (file) remote = await (await driveDownload(file.id)).json();
  const rCards = remote.cards || {};
  const imageIds = { ...(remote.images || {}) };   // 해시 → Drive 파일 ID
  if (!auth.email) {
    try {
      auth.email = (await (await gfetch(`${DRIVE_API}/about?fields=user(emailAddress)`)).json()).user?.emailAddress || null;
      saveAuth();
    } catch {}
  }
  let localChanged = false;

  // 2. 삭제 합치기: 삭제 시각 이후에 바뀐 적 없는 카드는 지움
  const deleted = { ...(remote.deleted || {}) };
  for (const [id, ts] of Object.entries(syncMeta.deleted)) deleted[id] = Math.max(deleted[id] || 0, ts);
  const isDead = (id, at) => id in deleted && deleted[id] >= at;
  for (const local of [...cards]) {
    if (isDead(local.id, touchedAt(local)) && editor?.cardId !== local.id) {
      await removeCard(local.id);
      cards = cards.filter((c) => c !== local);
      localChanged = true;
    }
  }
  syncMeta.deleted = deleted;

  // 3. 카드 합치기: 내용·학습 기록 중 Drive 쪽이 더 최근인 부분을 이 기기에 반영 (편집 중인 카드는 다음 번에)
  for (const [id, rc] of Object.entries(rCards)) {
    if (isDead(id, touchedAt(rc)) || editor?.cardId === id) continue;
    const local = cards.find((c) => c.id === id);
    const newContent = !local || contentAt(rc) > contentAt(local);
    const newStudy = !local || studyAt(rc) > studyAt(local);
    if (!newContent && !newStudy) continue;
    const study = newStudy ? reviveCard(rc) : local;
    const studyFields = { srs: study.srs, practiceScore: study.practiceScore, practiceCount: study.practiceCount, studyAt: studyAt(study) };
    if (!newContent) {
      // 학습 기록만 바뀜: 복습할 때처럼 지금 카드 객체를 고쳐서 그대로 저장
      Object.assign(local, studyFields);
      local.updatedAt = touchedAt(local);
      await putCard(local);
    } else {
      const card = Object.assign(await cardFromRemote(rc, local, imageIds), studyFields, { contentAt: contentAt(rc) });
      card.updatedAt = touchedAt(card);
      await putCard(card);
      const i = cards.findIndex((c) => c.id === id);
      if (i >= 0) cards[i] = card; else cards.push(card);
    }
    localChanged = true;
  }

  // 4. 카테고리 이름 합치기
  const catUpdates = [];
  for (const [key, rk] of Object.entries(remote.categories || {})) {
    if ((catStamps.get(key) ?? -1) < (rk.updatedAt || 0)) catUpdates.push({ key, name: rk.name, updatedAt: rk.updatedAt || 0 });
  }
  if (catUpdates.length) {
    await putCategoryNames(catUpdates);
    catUpdates.forEach((k) => { catNames.set(k.key, k.name); catStamps.set(k.key, k.updatedAt); });
    localChanged = true;
  }

  // 5. 복습 기록 합치기 (없는 것만 추가)
  const alive = new Set(cards.map((c) => c.id));
  let localReviews = await getAll('reviews');
  const have = new Set(localReviews.map(reviewKey));
  const newReviews = (remote.reviews || [])
    .filter((r) => alive.has(r.cardId) && !have.has(reviewKey(r)))
    .map((r) => ({ ...r, review: reviveDate(r.review), due: reviveDate(r.due) }));
  if (newReviews.length) {
    await addReviews(newReviews);
    localReviews = await getAll('reviews');
  }
  // 6-0. 공부 기록 합치기 (id 기준 합집합) + 받아온 복습·카드에서 기록 만들기 (이전 버전 기기 대비)
  const fromRemote = (remote.activity || []).map(([id, at]) => ({ id, at }));
  const derived = [...newReviews.map((r) => reviewActivity(r.cardId, r.review)), ...cards.map(addActivity)];
  const haveActivity = new Set(activity.map((a) => a.id));
  const newActivity = [...fromRemote, ...derived].filter((a) => !haveActivity.has(a.id) && (haveActivity.add(a.id), true));
  if (newActivity.length) {
    await recordActivity(newActivity);
    localChanged = true;
  }
  if (localChanged) renderAll();

  // 6. 이 기기 기준으로 Drive에 올릴 내용 만들기 (새 사진은 먼저 올림)
  const out = { app: 'freedom', version: 1, cards: {}, deleted, categories: {}, images: {}, reviews: [], activity: [] };
  for (const c of cards) {
    const rc = rCards[c.id];
    const remoteAhead = rc && (contentAt(rc) > contentAt(c) || studyAt(rc) > studyAt(c));
    const same = rc && contentAt(rc) === contentAt(c) && studyAt(rc) === studyAt(c);
    // 같거나, 편집 중이라 아직 반영 못 한 Drive 쪽이 앞서 있으면 Drive 것을 유지 (다음 동기화 때 합침)
    if (same || remoteAhead) { out.cards[c.id] = rc; continue; }
    const pack = async (list) => {
      const hashes = [];
      for (const blob of list) {
        const h = await blobHash(blob);
        if (!imageIds[h]) imageIds[h] = await driveUpload({ name: `img-${h}.jpg`, type: blob.type || 'image/jpeg', data: blob });
        hashes.push(h);
      }
      return hashes;
    };
    out.cards[c.id] = {
      id: c.id, createdAt: c.createdAt, updatedAt: touchedAt(c), contentAt: contentAt(c), studyAt: studyAt(c),
      korText: c.korText, engText: c.engText, category: c.category,
      srs: c.srs, practiceScore: c.practiceScore, practiceCount: c.practiceCount,
      korImages: await pack(c.korImages), engImages: await pack(c.engImages),
    };
  }
  // 편집 중이라 아직 반영하지 못한 Drive 카드도 그대로 유지
  for (const [id, rc] of Object.entries(rCards)) {
    if (!out.cards[id] && !isDead(id, touchedAt(rc))) out.cards[id] = rc;
  }
  for (const rc of Object.values(out.cards)) {
    for (const h of [...(rc.korImages || []), ...(rc.engImages || [])]) if (imageIds[h]) out.images[h] = imageIds[h];
  }
  for (const [key, name] of catNames) out.categories[key] = { name, updatedAt: catStamps.get(key) ?? 0 };
  const inOut = new Set(Object.keys(out.cards));
  out.reviews = localReviews.filter((r) => inOut.has(r.cardId)).map(({ id, ...r }) => r);
  out.activity = activity.map((a) => [a.id, a.at]).sort((x, y) => x[1] - y[1] || (x[0] < y[0] ? -1 : 1));

  // 7. 바뀐 게 있을 때만 data.json 저장 (순서를 정렬해서 내용이 같으면 같은 글자가 되게)
  const sorted = (obj) => Object.fromEntries(Object.keys(obj).sort().map((k) => [k, obj[k]]));
  out.cards = sorted(out.cards); out.deleted = sorted(out.deleted);
  out.categories = sorted(out.categories); out.images = sorted(out.images);
  out.reviews.sort((a, b) => toDate(a.review) - toDate(b.review) || String(a.cardId).localeCompare(String(b.cardId)));
  const text = JSON.stringify(out);
  if (!file || text !== JSON.stringify(remote)) {
    await driveUpload({ id: file?.id, name: DATA_FILE, type: 'application/json', data: new Blob([text], { type: 'application/json' }) });
  }

  // 8. 더 이상 쓰지 않는 사진 정리 (한 세션에 한 번, 다른 기기가 막 올린 것은 남겨 둠)
  if (!sync.gcDone) {
    sync.gcDone = true;
    const used = new Set(Object.values(out.images));
    const files = await driveList(`name contains 'img-' and trashed=false`, 'id,name,createdTime');
    const hourAgo = Date.now() - 3600000;
    for (const f of files) {
      if (!used.has(f.id) && new Date(f.createdTime).getTime() < hourAgo) {
        await gfetch(`${DRIVE_API}/files/${f.id}`, { method: 'DELETE' }).catch(() => {});
      }
    }
  }
}

async function syncNow({ quiet = true, announce = false } = {}) {
  if (!auth.connected) return;
  if (sync.running) { sync.again = true; return; }
  if (!tokenValid()) {
    if (!quiet) startLogin(false);
    renderSyncStatus();
    return;
  }
  clearTimeout(sync.timer);
  sync.running = true;
  sync.error = null;
  renderSyncStatus();
  const startSeq = syncMeta.seq;
  try {
    await runSync();
    syncMeta.syncedSeq = Math.max(syncMeta.syncedSeq, startSeq);
    syncMeta.lastSyncAt = Date.now();
    await saveSyncMeta();
    if (announce) toast('Google Drive에 연결했어요. 이제 자동으로 저장돼요.');
    else if (!quiet) toast('동기화했어요.');
  } catch (err) {
    sync.error = err;
    await saveSyncMeta().catch(() => {});
    if (!quiet || announce) toast(err instanceof AuthNeeded ? 'Google 로그인이 만료됐어요. 다시 연결해 주세요.' : `동기화하지 못했어요. (${errText(err)})`);
  } finally {
    sync.running = false;
    renderSyncStatus();
    if (sync.again) { sync.again = false; scheduleSync(1000); }
  }
}

function agoText(ts) {
  const sec = (Date.now() - ts) / 1000;
  if (sec < 60) return '방금';
  if (sec < 3600) return `${Math.round(sec / 60)}분 전`;
  if (sec < 86400) return `${Math.round(sec / 3600)}시간 전`;
  return `${Math.round(sec / 86400)}일 전`;
}
function renderSyncStatus() {
  const pending = pendingCount();
  const needsAttention = auth.connected && ((!tokenValid() && pending > 0) || (sync.error && !sync.running));
  const pill = $('#sync-pill');
  if (pill) pill.innerHTML = `동기화${needsAttention ? '<span class="dot" aria-label="확인 필요"></span>' : ''}`;
  const box = $('#sync-box');
  if (!box || $('#backup').hidden) return;
  if (!auth.connected) {
    box.innerHTML = `<div class="field">
      <h3>Google Drive 동기화</h3>
      <p class="sync-line">로그인하면 카드와 사진, 복습 기록이 내 Google Drive에 자동으로 저장돼요. 같은 계정으로 로그인한 다른 기기와도 맞춰져요.</p>
      <button class="btn primary wide" data-act="drive-login">Google로 로그인</button>
    </div>`;
    return;
  }
  let line, warn = false;
  if (sync.running) line = '동기화하는 중…';
  else if (!tokenValid()) {
    warn = true;
    line = `로그인이 만료됐어요. 다시 연결하면 이어서 저장돼요.${pending ? ` (Drive에 안 올라간 변경 ${pending}개)` : ''}`;
  } else if (sync.error) {
    warn = true;
    line = `동기화하지 못했어요. (${esc(errText(sync.error))})`;
  } else if (pending) line = `Drive에 올리는 중이에요 · 변경 ${pending}개`;
  else line = syncMeta.lastSyncAt ? `모두 저장됨 · 마지막 동기화 ${agoText(syncMeta.lastSyncAt)}` : '아직 동기화하지 않았어요.';
  box.innerHTML = `<div class="field">
    <h3>Google Drive 동기화<span>${esc(auth.email || '연결됨')}</span></h3>
    <p class="sync-line${warn ? ' warn' : ''}">${line}</p>
    ${tokenValid()
      ? `<button class="btn wide" data-act="drive-sync" ${sync.running ? 'disabled' : ''}>지금 동기화</button>`
      : '<button class="btn primary wide" data-act="drive-login">다시 연결</button>'}
    <button class="btn danger wide" data-act="drive-disconnect">연결 해제</button>
  </div>`;
}

// ================= 백업 =================
const blobToDataURL = (b) => new Promise((res) => {
  const r = new FileReader();
  r.onload = () => res(r.result);
  r.readAsDataURL(b);
});
const dataURLToBlob = async (u) => (await fetch(u)).blob();
const reviveDate = (v) => (v ? new Date(v) : v);
/** JSON에서 읽은 카드의 날짜 값들을 Date로 */
const reviveCard = (c) => ({
  ...c,
  createdAt: new Date(c.createdAt),
  srs: { ...c.srs, due: new Date(c.srs.due), last_review: reviveDate(c.srs.last_review) },
  practiceScore: c.practiceScore ?? 0,
  practiceCount: c.practiceCount ?? 0,
});

async function exportBackup() {
  const reviews = await getAll('reviews');
  const payload = {
    app: 'freedom', version: 1, exportedAt: new Date().toISOString(),
    cards: await Promise.all(cards.map(async (c) => ({
      ...c,
      korImages: await Promise.all(c.korImages.map(blobToDataURL)),
      engImages: await Promise.all(c.engImages.map(blobToDataURL)),
    }))),
    reviews,
    categories: [...catNames].map(([key, name]) => ({ key, name, updatedAt: catStamps.get(key) ?? 0 })),
  };
  const stamp = new Date().toISOString().slice(0, 10);
  const file = new File([JSON.stringify(payload)], `freedom-backup-${stamp}.json`, { type: 'application/json' });
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title: 'freedom 백업' });
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { data = null; }
  if (!data || data.app !== 'freedom' || !Array.isArray(data.cards)) {
    toast('freedom 백업 파일이 아니에요. 파일을 다시 확인해 주세요.');
    return;
  }
  if (!confirm(`백업의 표현 ${data.cards.length}개로 지금 데이터를 바꿀까요? 현재 기기의 데이터는 지워져요.`)) return;
  // 복원한 카드는 다른 기기의 옛 버전보다 앞서도록 지금 시각으로 표시
  const now = Date.now();
  const restored = await Promise.all(data.cards.map(async (c) => reviveCard({
    ...c,
    contentAt: now, studyAt: now, updatedAt: now,
    korImages: await Promise.all((c.korImages || []).map(dataURLToBlob)),
    engImages: await Promise.all((c.engImages || []).map(dataURLToBlob)),
  })));
  const reviews = (data.reviews || []).map((r) => ({ ...r, review: reviveDate(r.review), due: reviveDate(r.due) }));
  const categories = (data.categories || []).filter((k) => k && typeof k.key === 'string' && typeof k.name === 'string');
  await replaceAll(restored, reviews, categories);
  await recordActivity([...restored.map(addActivity), ...reviews.map((r) => reviewActivity(r.cardId, r.review))]);
  cards = restored;
  catNames = new Map(categories.map((k) => [k.key, k.name]));
  catStamps = new Map(categories.map((k) => [k.key, k.updatedAt ?? 0]));
  markChanged();
  $('#backup').hidden = true;
  renderAll();
  toast(`표현 ${restored.length}개를 복원했어요.`);
}

// ================= 기록 (캘린더) =================
// 날짜 칸 색: 그날 푼 카드 수(복습 + 자유 연습). 0 / 1~9 / 10~29 / 30~59 / 60+
const LEVELS = [1, 10, 30, 60];
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
const pad2 = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const levelOf = (n) => LEVELS.filter((t) => n >= t).length;

/** 날짜(기기 현지 시간) → { review, practice, add } */
function dailyActivity() {
  const days = new Map();
  for (const a of activity) {
    const k = dayKey(new Date(a.at));
    const d = days.get(k) || { review: 0, practice: 0, add: 0 };
    if (a.id[0] === 'r') d.review += 1;
    else if (a.id[0] === 'p') d.practice += 1;
    else if (a.id[0] === 'a') d.add += 1;
    days.set(k, d);
  }
  return days;
}
const solvedOf = (d) => (d ? d.review + d.practice : 0);

/** 연속 공부일: 오늘(아직 안 했으면 어제)부터 거꾸로 1장이라도 한 날이 이어진 수 */
function streakInfo(days) {
  const d = new Date();
  const doneToday = solvedOf(days.get(dayKey(d))) > 0;
  if (!doneToday) d.setDate(d.getDate() - 1);
  let n = 0;
  while (solvedOf(days.get(dayKey(d))) > 0) { n += 1; d.setDate(d.getDate() - 1); }
  return { n, doneToday };
}

function renderStats() {
  if (ui.tab !== 'stats') return;
  const days = dailyActivity();
  const now = new Date();
  const todayKey = dayKey(now);
  if (!ui.calMonth) ui.calMonth = { y: now.getFullYear(), m: now.getMonth() };
  const { y, m } = ui.calMonth;
  const monthLabel = `${m + 1}월`;

  // 연속 기록
  const { n, doneToday } = streakInfo(days);
  let streakSub;
  if (n === 0) streakSub = '오늘 1장이라도 풀면 연속 기록이 시작돼요.';
  else if (doneToday) streakSub = '연속 공부 중 · 오늘도 했어요';
  else streakSub = `오늘 공부하면 ${n + 1}일째가 돼요.`;

  // 이번 달(보고 있는 달) 합계
  let monthDays = 0, monthSolved = 0;
  const last = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= last; d++) {
    const solved = solvedOf(days.get(`${y}-${pad2(m + 1)}-${pad2(d)}`));
    if (solved) { monthDays += 1; monthSolved += solved; }
  }

  // 달력: 일요일 시작
  const firstKey = [...days.keys()].sort()[0];
  const first = firstKey ? new Date(`${firstKey}T00:00:00`) : now;
  const canPrev = y > first.getFullYear() || (y === first.getFullYear() && m > first.getMonth());
  const canNext = y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth());
  const selected = ui.calDay || (y === now.getFullYear() && m === now.getMonth() ? todayKey : null);
  const lead = new Date(y, m, 1).getDay();
  let cells = WEEKDAYS.map((w) => `<span class="wd" aria-hidden="true">${w}</span>`).join('');
  cells += '<span></span>'.repeat(lead);
  for (let d = 1; d <= last; d++) {
    const k = `${y}-${pad2(m + 1)}-${pad2(d)}`;
    const info = days.get(k);
    const solved = solvedOf(info);
    const future = k > todayKey;
    const label = `${m + 1}월 ${d}일, ${solved ? `${solved}장 풀었어요` : '공부 기록 없음'}${info?.add ? `, 새 표현 ${info.add}개` : ''}`;
    cells += `<button class="day${solved ? ` l${levelOf(solved)}` : ''}${k === todayKey ? ' today' : ''}${future ? ' future' : ''}"
      data-act="cal-day" data-day="${k}" aria-pressed="${k === selected}" aria-label="${label}" ${future ? 'disabled' : ''}>
      ${d}${!solved && info?.add ? '<span class="add-dot"></span>' : ''}
    </button>`;
  }

  // 고른 날 상세
  let detail = '';
  if (selected) {
    const info = days.get(selected);
    const date = new Date(`${selected}T00:00:00`);
    const title = date.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
    detail = `<section class="field">
      <h3>${title}${selected === todayKey ? '<span>오늘</span>' : ''}</h3>
      ${info && (solvedOf(info) || info.add)
        ? `<ul class="day-rows">
            <li><span>복습</span><b>${info.review}장</b></li>
            <li><span>자유 연습</span><b>${info.practice}장</b></li>
            <li><span>새 표현</span><b>${info.add}개</b></li>
          </ul>`
        : '<p class="sync-line">공부 기록이 없어요.</p>'}
    </section>`;
  }

  $('#stats-main').innerHTML = `
    <div class="streak">
      <b>${n > 0 ? `🔥 ${n}일 연속` : '연속 기록 0일'}</b>
      <small>${streakSub}</small>
    </div>
    <div class="tiles">
      <div class="tile"><b>${monthDays}일</b><small>${monthLabel}에 공부한 날</small></div>
      <div class="tile"><b>${monthSolved}장</b><small>${monthLabel}에 푼 카드</small></div>
    </div>
    <section class="cal" aria-label="${y}년 ${monthLabel} 공부 달력">
      <div class="cal-head">
        <button class="cal-nav" data-act="cal-prev" aria-label="이전 달" ${canPrev ? '' : 'disabled'}>‹</button>
        <h2>${y}년 ${monthLabel}</h2>
        <button class="cal-nav" data-act="cal-next" aria-label="다음 달" ${canNext ? '' : 'disabled'}>›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="legend" aria-hidden="true">
        적음 <i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> 많음
        <span class="gap"></span><i class="dot"></i> 표현만 추가
      </div>
    </section>
    ${detail}`;
}

function setTab(tab) {
  ui.tab = tab;
  $('#view-review').hidden = tab !== 'review';
  $('#view-cards').hidden = tab !== 'cards';
  $('#view-stats').hidden = tab !== 'stats';
  if (tab === 'stats') { ui.calMonth = null; ui.calDay = null; }
  document.querySelectorAll('.tab').forEach((t) => t.setAttribute('aria-selected', String(t.dataset.tab === tab)));
  renderAll();
}
function renderAll() {
  renderStats();
  renderReview();
  renderCards();
}

// ================= 이벤트 =================
document.addEventListener('click', (ev) => {
  const tabBtn = ev.target.closest('[data-tab]');
  if (tabBtn) { setTab(tabBtn.dataset.tab); return; }
  const el = ev.target.closest('[data-act]');
  if (!el || el.disabled) return;
  const act = el.dataset.act;
  switch (act) {
    case 'reveal': ui.reviewShow = true; renderReview(); break;
    case 'grade': gradeCard(Number(el.dataset.r)).catch((err) => toast(`저장하지 못했어요. (${errText(err)})`)); break;
    case 'practice': if (cards.length) openPractice(); break;
    case 'practice-close': closePractice(); break;
    case 'set-dir': setDirection(el.dataset.dir); break;
    case 'review-start': ui.reviewStarted = true; renderReview(); $('#review-main').scrollTop = 0; break;
    case 'review-stop': ui.reviewStarted = false; renderReview(); break;
    case 'practice-start':
      practice.started = true; practice.show = false; pickPractice(); renderPractice();
      $('#practice-body').scrollTop = 0;
      break;
    case 'practice-stop': practice.started = false; renderPractice(); break;
    case 'study-cat': toggleStudyCat(el.dataset.cat ?? null); break;
    case 'cal-prev': case 'cal-next': {
      const { y, m } = ui.calMonth;
      const d = new Date(y, m + (act === 'cal-next' ? 1 : -1), 1);
      ui.calMonth = { y: d.getFullYear(), m: d.getMonth() };
      ui.calDay = null;
      renderStats();
      break;
    }
    case 'cal-day': ui.calDay = el.dataset.day; renderStats(); break;
    case 'cards-cat': ui.cardsCat = el.dataset.cat ?? null; renderCards(); break;
    case 'rename-cat': {
      ui.renaming = el.dataset.cat;
      renderCards();
      $('#cards-main').scrollTop = 0;
      const input = $('#rename-input');
      input.focus();
      input.select();
      break;
    }
    case 'rename-cancel': ui.renaming = null; renderCards(); break;
    case 'rename-save': saveRename(); break;
    case 'pick-cat': editor.category = el.dataset.cat; editor.catNew = false; renderEditor(); break;
    case 'new-cat': editor.catNew = true; renderEditor(); $('#cat-input')?.focus(); break;
    case 'practice-reveal': practice.show = true; renderPractice(); break;
    case 'practice-answer': answerPractice(el.dataset.correct === '1').catch((err) => toast(`저장하지 못했어요. (${errText(err)})`)); break;
    case 'add': openEditor(); break;
    case 'edit': openEditor(el.dataset.id); break;
    case 'editor-cancel': closeEditor(); break;
    case 'editor-save': saveEditor().catch((err) => toast(`저장하지 못했어요. (${errText(err)})`)); break;
    case 'editor-delete': deleteFromEditor(); break;
    case 'add-photos': photoSide = el.dataset.side; $('#photo-input').click(); break;
    case 'remove-photo': {
      const list = el.dataset.side === 'kor' ? editor.korImages : editor.engImages;
      list.splice(Number(el.dataset.index), 1);
      renderEditor();
      break;
    }
    case 'backup': $('#backup').hidden = false; renderSyncStatus(); break;
    case 'drive-login': startLogin(false); break;
    case 'drive-sync': syncNow({ quiet: false }); break;
    case 'drive-disconnect': disconnectDrive(); break;
    case 'backup-close': $('#backup').hidden = true; break;
    case 'export': exportBackup().catch(() => toast('백업 파일을 만들지 못했어요. 다시 시도해 주세요.')); break;
    case 'import': $('#backup-input').click(); break;
  }
});

document.addEventListener('input', (ev) => {
  if (!editor) return;
  if (ev.target.dataset.field === 'category') {
    editor.newCatText = ev.target.value;
    updateSaveState();
    return;
  }
  if (ev.target.tagName !== 'TEXTAREA') return;
  if (ev.target.dataset.side === 'kor') editor.korText = ev.target.value;
  else editor.engText = ev.target.value;
  updateSaveState();
});

document.addEventListener('keydown', (ev) => {
  if (ev.target.id === 'rename-input' && ev.key === 'Enter' && !ev.isComposing) {
    ev.preventDefault();
    saveRename();
  }
});

$('#photo-input').addEventListener('change', (ev) => {
  const files = [...ev.target.files];
  ev.target.value = '';
  addPhotos(files);
});
$('#backup-input').addEventListener('change', (ev) => {
  const file = ev.target.files[0];
  ev.target.value = '';
  if (file) importBackup(file).catch(() => toast('복원하지 못했어요. 파일을 다시 확인해 주세요.'));
});

// 1분·10분 뒤 다시 나오는 학습 단계 카드를 위해 주기적으로 확인
function tick() {
  if (!db) return;
  const sig = dueCards(new Date()).map((c) => c.id).join(',');
  if (sig !== ui.reviewSig) renderReview();
}
setInterval(tick, 20000);
document.addEventListener('visibilitychange', () => {
  if (document.visibilityState !== 'visible') return;
  if (db) renderAll();
  if (db && auth.connected) {
    if (tokenValid()) { if (Date.now() - (syncMeta.lastSyncAt || 0) > 10000) syncNow(); }
    else trySilentLogin();
  }
  // iOS 홈 화면 앱은 닫아도 메모리에서 그대로 돌아오는 경우가 많아서, 돌아올 때마다 새 버전 확인
  navigator.serviceWorker?.getRegistration().then((r) => r?.update()).catch(() => {});
});

/** 새 버전이 설치되면 한 번 새로고침해서 바로 적용 (편집 중이면 편집을 닫은 뒤에) */
let updateReady = false;
function reloadForUpdate() {
  if (editor) { updateReady = true; return; }
  location.reload();
}

// ================= 시작 =================
async function init() {
  db = await openDB();
  cards = await getAll('cards');
  const catRows = await getAll('categories');
  catNames = new Map(catRows.map((k) => [k.key, k.name]));
  catStamps = new Map(catRows.map((k) => [k.key, k.updatedAt ?? 0]));
  Object.assign(syncMeta, await getMeta('sync').catch(() => null));
  activity = await getAll('activity');
  // 공부 기록 저장소가 생기기 전의 복습 기록과 카드 추가 날짜로 채움 (한 번만)
  if (!(await getMeta('activitySeeded').catch(() => false))) {
    const reviews = await getAll('reviews');
    await recordActivity([...reviews.map((r) => reviewActivity(r.cardId, r.review)), ...cards.map(addActivity)]);
    await putMeta('activitySeeded', true);
  }
  renderAll();
  // Google 로그인에서 돌아온 경우
  const login = handleOAuthReturn();
  if (login === 'ok') {
    syncMeta.seq += 1;   // 처음 연결이면 이 기기의 카드를 모두 올리도록
    syncNow({ quiet: false, announce: true });
  } else if (login) {
    if (!login.silent) toast(login.error === 'access_denied' ? 'Google 로그인을 취소했어요.' : `Google에 연결하지 못했어요. (${login.error})`);
    renderSyncStatus();
  } else if (auth.connected) {
    if (tokenValid()) syncNow();
    else if (!trySilentLogin()) renderSyncStatus();
  }
  $('#app-version').textContent = `앱 버전 ${APP_VERSION}`;
  if ('serviceWorker' in navigator) {
    // 처음 설치될 때는 이미 최신이므로 새로고침하지 않음
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      reloading = true;
      reloadForUpdate();
    });
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}
init().catch((err) => {
  $('#review-main').innerHTML = `<div class="empty"><h2>저장소를 열지 못했어요</h2><p>개인정보 보호 브라우징을 끄고 다시 열어 주세요. (${esc(err?.message || err)})</p></div>`;
});
</script>
