# 사진 → 표현·뜻 Worker. 배포 방법은 README의 "사진으로 자동 입력 (Cloudflare Worker)"를 보세요.
name = "mooni-scan"
main = "src/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# 항상 미국에서 실행: 한국 사용자 요청이 홍콩 등 AI API가 막힌 지역에서 나가면 403으로 거절됨
[placement]
region = "aws:us-east-1"

[vars]
FIREBASE_PROJECT_ID = "mooni-wordbook-66dd9"
ALLOWED_ORIGINS = "https://jeongmoonwon.github.io,http://localhost:8000"
# 구글 캘린더 연결 (OAuth 웹 클라이언트 ID). 비밀번호는 `npx wrangler secret put GOOGLE_CLIENT_SECRET`
GOOGLE_CLIENT_ID = "380302763226-0d20kn99tt1u53s8jqbn6t1u27fmi5no.apps.googleusercontent.com"

# 하루 사용량 기록. `npx wrangler kv namespace create USAGE`로 만든 id를 넣으세요
[[kv_namespaces]]
binding = "USAGE"
id = "52092527be724991a2c1b994ac997896"

# 말해서 넣기의 음성 인식 (Workers AI Whisper, 하루 무료 사용량 안에서)
[ai]
binding = "AI"

# 5분마다: 정해 둔 시간이 된 푸시 알림 보내기 (관심사 화제는 앱을 연 날에만 만듦)
[triggers]
crons = ["*/5 * * * *"]
