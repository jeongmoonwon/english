    }))),
    reviews,
    categories: [...catNames].map(([key, name]) => ({ key, name, updatedAt: catStamps.get(key) ?? 0 })),
  };
  const stamp = new Date().toISOString().slice(0, 10);
  await saveFile(new File([JSON.stringify(payload)], `freedom-backup-${stamp}.json`, { type: 'application/json' }), 'freedom 백업');
}

/** 파일 저장: 아이폰은 공유 시트(파일에 저장), 그 밖에는 내려받기 */
async function saveFile(file, title) {
  if (navigator.canShare && navigator.canShare({ files: [file] })) {
    try {
      await navigator.share({ files: [file], title });
      return;
    } catch (err) {
      if (err.name === 'AbortError') return;
    }
  }
  const a = document.createElement('a');
  a.href = URL.createObjectURL(file);
  a.download = file.name;
  document.body.append(a);
  a.click();
  a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

async function importBackup(file) {
  let data;
  try { data = JSON.parse(await file.text()); } catch { data = null; }
  if (!data || data.app !== 'freedom' || !Array.isArray(data.cards)) {
    toast('freedom 백업 파일이 아니에요. 파일을 다시 확인해 주세요.');
    return;
  }
  if (!confirm(`백업의 표현 ${data.cards.length}개로 지금 데이터를 바꿀까요? 현재 기기의 데이터는 지워져요.`)) return;
  // 복원한 카드는 다른 기기의 옛 버전보다 앞서도록 지금 시각으로 표시
  const now = Date.now();
  const restored = await Promise.all(data.cards.map(async (c) => reviveCard({
    ...c,
    contentAt: now, studyAt: now, updatedAt: now,
    korImages: await Promise.all((c.korImages || []).map(dataURLToBlob)),
    engImages: await Promise.all((c.engImages || []).map(dataURLToBlob)),
  })));
  const reviews = (data.reviews || []).map((r) => ({ ...r, review: reviveDate(r.review), due: reviveDate(r.due) }));
  const categories = (data.categories || []).filter((k) => k && typeof k.key === 'string' && typeof k.name === 'string');
  await replaceAll(restored, reviews, categories);
  await recordActivity([...restored.map(addActivity), ...reviews.map((r) => reviewActivity(r.cardId, r.review))]);
  cards = restored;
  catNames = new Map(categories.map((k) => [k.key, k.name]));
  catStamps = new Map(categories.map((k) => [k.key, k.updatedAt ?? 0]));
  syncMeta.pushedAt = 0;   // 복원한 복습·공부 기록은 예전 시각이라, 다음 동기화 때 전부 올림
  markChanged();
  renderAll();
  toast(`표현 ${restored.length}개를 복원했어요.`);
}

// ================= 기록 (캘린더) =================
// 날짜 칸 색: 그날 푼 카드 수(복습 + 자유 연습). 0 / 1~9 / 10~29 / 30~59 / 60+
const LEVELS = [1, 10, 30, 60];
const WEEKDAYS = ['일', '월', '화', '수', '목', '금', '토'];
const pad2 = (n) => String(n).padStart(2, '0');
const dayKey = (d) => `${d.getFullYear()}-${pad2(d.getMonth() + 1)}-${pad2(d.getDate())}`;
const levelOf = (n) => LEVELS.filter((t) => n >= t).length;

/** 날짜(기기 현지 시간) → { review, practice, add } */
function dailyActivity() {
  const days = new Map();
  for (const a of activity) {
    const k = dayKey(new Date(a.at));
    const d = days.get(k) || { review: 0, practice: 0, add: 0 };
    if (a.id[0] === 'r') d.review += 1;
    else if (a.id[0] === 'p') d.practice += 1;
    else if (a.id[0] === 'a') d.add += 1;
    days.set(k, d);
  }
  return days;
}
const solvedOf = (d) => (d ? d.review + d.practice : 0);

/** 연속 공부일: 오늘(아직 안 했으면 어제)부터 거꾸로 1장이라도 한 날이 이어진 수 */
function streakInfo(days) {
  const d = new Date();
  const doneToday = solvedOf(days.get(dayKey(d))) > 0;
  if (!doneToday) d.setDate(d.getDate() - 1);
  let n = 0;
  while (solvedOf(days.get(dayKey(d))) > 0) { n += 1; d.setDate(d.getDate() - 1); }
  return { n, doneToday };
}

function renderStats() {
  if (ui.tab !== 'stats') return;
  const days = dailyActivity();
  const now = new Date();
  const todayKey = dayKey(now);
  if (!ui.calMonth) ui.calMonth = { y: now.getFullYear(), m: now.getMonth() };
  const { y, m } = ui.calMonth;
  const monthLabel = `${m + 1}월`;

  // 연속 기록
  const { n, doneToday } = streakInfo(days);
  let streakSub;
  if (n === 0) streakSub = '오늘 1장이라도 풀면 연속 기록이 시작돼요.';
  else if (doneToday) streakSub = '연속 공부 중 · 오늘도 했어요';
  else streakSub = `오늘 공부하면 ${n + 1}일째가 돼요.`;

  // 이번 달(보고 있는 달) 합계
  let monthDays = 0, monthSolved = 0;
  const last = new Date(y, m + 1, 0).getDate();
  for (let d = 1; d <= last; d++) {
    const solved = solvedOf(days.get(`${y}-${pad2(m + 1)}-${pad2(d)}`));
    if (solved) { monthDays += 1; monthSolved += solved; }
  }

  // 달력: 일요일 시작
  const firstKey = [...days.keys()].sort()[0];
  const first = firstKey ? new Date(`${firstKey}T00:00:00`) : now;
  const canPrev = y > first.getFullYear() || (y === first.getFullYear() && m > first.getMonth());
  const canNext = y < now.getFullYear() || (y === now.getFullYear() && m < now.getMonth());
  const selected = ui.calDay || (y === now.getFullYear() && m === now.getMonth() ? todayKey : null);
  const lead = new Date(y, m, 1).getDay();
  let cells = WEEKDAYS.map((w) => `<span class="wd" aria-hidden="true">${w}</span>`).join('');
  cells += '<span></span>'.repeat(lead);
  for (let d = 1; d <= last; d++) {
    const k = `${y}-${pad2(m + 1)}-${pad2(d)}`;
    const info = days.get(k);
    const solved = solvedOf(info);
    const future = k > todayKey;
    const label = `${m + 1}월 ${d}일, ${solved ? `${solved}장 풀었어요` : '공부 기록 없음'}${info?.add ? `, 새 표현 ${info.add}개` : ''}`;
    cells += `<button class="day${solved ? ` l${levelOf(solved)}` : ''}${k === todayKey ? ' today' : ''}${future ? ' future' : ''}"
      data-act="cal-day" data-day="${k}" aria-pressed="${k === selected}" aria-label="${label}" ${future ? 'disabled' : ''}>
      ${d}${!solved && info?.add ? '<span class="add-dot"></span>' : ''}
    </button>`;
  }

  // 고른 날 상세
  let detail = '';
  if (selected) {
    const info = days.get(selected);
    const date = new Date(`${selected}T00:00:00`);
    const title = date.toLocaleDateString('ko-KR', { month: 'long', day: 'numeric', weekday: 'long' });
    detail = `<section class="field">
      <h3>${title}${selected === todayKey ? '<span>오늘</span>' : ''}</h3>
      ${info && (solvedOf(info) || info.add)
        ? `<ul class="day-rows">
            <li><span>복습</span><b>${info.review}장</b></li>
            <li><span>자유 연습</span><b>${info.practice}장</b></li>
            <li><span>새 표현</span><b>${info.add}개</b></li>
          </ul>`
        : '<p class="sync-line">공부 기록이 없어요.</p>'}
    </section>`;
  }

  $('#stats-main').innerHTML = `
    <div class="streak">
      <b>${n > 0 ? `🔥 ${n}일 연속` : '연속 기록 0일'}</b>
      <small>${streakSub}</small>
    </div>
    <div class="tiles">
      <div class="tile"><b>${monthDays}일</b><small>${monthLabel}에 공부한 날</small></div>
      <div class="tile"><b>${monthSolved}장</b><small>${monthLabel}에 푼 카드</small></div>
    </div>
    <section class="cal" aria-label="${y}년 ${monthLabel} 공부 달력">
      <div class="cal-head">
        <button class="cal-nav" data-act="cal-prev" aria-label="이전 달" ${canPrev ? '' : 'disabled'}>‹</button>
        <h2>${y}년 ${monthLabel}</h2>
        <button class="cal-nav" data-act="cal-next" aria-label="다음 달" ${canNext ? '' : 'disabled'}>›</button>
      </div>
      <div class="cal-grid">${cells}</div>
      <div class="legend" aria-hidden="true">
        적음 <i class="l1"></i><i class="l2"></i><i class="l3"></i><i class="l4"></i> 많음
        <span class="gap"></span><i class="dot"></i> 표현만 추가
      </div>
    </section>
    ${detail}`;
}

    case 'rename-save': saveRename(); break;
    case 'pick-cat': editor.entries[Number(el.dataset.index)].category = el.dataset.cat; editor.popCat = null; renderEditor(); break;
    case 'new-cat': editor.catInput = Number(el.dataset.index); editor.popCat = null; renderEditor(); $('#cat-input')?.focus(); break;
    case 'add-cat': addCategory(); break;
    case 'cancel-cat': editor.catInput = null; renderEditor(); break;

      practice.flipping = true;
      flipOut('#practice-body', () => { practice.flipping = false; practice.show = true; practice.flipNow = true; renderPractice(); });

      switchMode(el.dataset.mode);

      ui.feedback.text = $('#fb-text').value; ui.feedback.email = $('#fb-email').value;

      renderSettings();
      break;

    case 'mode-create': {
      const t = newModeCode('target'), n = newModeCode('native');
      if (!t || !n || t === n) break;
      const mode = `${t}>${n}`;
      if (!modeList().some((m) => m.mode === mode)) setPref('modes', [...prefs.modes, mode]);
      ui.newMode = { target: null, native: 'ko' };
      switchMode(mode);
      renderSettings();
      break;

    case 'mode-remove-ask': ui.removingMode = el.dataset.mode; renderSettings(); break;
    case 'mode-remove-cancel': ui.removingMode = null; renderSettings(); break;
    case 'mode-remove': removeMode(el.dataset.mode).catch((err) => toast(`삭제하지 못했어요. (${errText(err)})`)); break;
    case 'mode-new': $('#mode-sheet').hidden = true; setTab('settings'); openSettingsPage('lang', true); break;
    case 'pref': {
      const raw = el.dataset.value;
      const value = raw === 'true' ? true : raw === 'false' ? false : /^[\d.]+$/.test(raw) ? Number(raw) : raw;
      setPref(el.dataset.key, value);
      renderSettingsPage(ui.settingsPage);
      if (el.dataset.key === 'speak' && value) speak(sampleOf(), targetLang().speech);
      break;
    }
    case 'toggle-found': {
      const i = Number(el.dataset.index);
      if (editor.checked.has(i)) editor.checked.delete(i);
      else if (editor.cardId) editor.checked = new Set([i]);
      else editor.checked.add(i);
      renderEditor();
      break;
    }
    case 'use-found': {
      const n = editor.checked.size;
      const first = editor.entries.findIndex((x) => entryState(editor, x) === 'empty');
      useFound(editor);
      renderEditor();
      $(`#kor-${first >= 0 ? first : editor.entries.length - n}`)?.closest('.entry')?.scrollIntoView({ behavior: 'smooth', block: 'start' });

    case 'add-entry':
      editor.entries.push({ korText: '', engText: '', note: '', category: editor.entries[editor.entries.length - 1].category });
      renderEditor();
      $(`#kor-${editor.entries.length - 1}`)?.focus();

      editor.entries.splice(Number(el.dataset.index), 1);

      const list = el.dataset.side === 'kor' ? editor.korImages : editor.engImages;
      list.splice(Number(el.dataset.index), 1);
      renderEditor();
      break;
    }
    case 'login': startLogin(); break;
    case 'sync-now': syncNow({ quiet: false }); break;
    case 'logout': logout(); break;
    case 'delete-account': deleteAccount(); break;
    case 'export': exportBackup().catch(() => toast('백업 파일을 만들지 못했어요. 다시 시도해 주세요.')); break;
    case 'import': $('#backup-input').click(); break;

});

  location.reload();
}

// ================= 시작 =================
async function init() {
  applyPrefs();
  db = await openDB();
  cards = await getAll('cards');
  const catRows = await getAll('categories');
  catNames = new Map(catRows.map((k) => [k.key, k.name]));
  catStamps = new Map(catRows.map((k) => [k.key, k.updatedAt ?? 0]));
  Object.assign(syncMeta, await getMeta('sync').catch(() => null));
  activity = await getAll('activity');
  // 공부 기록 저장소가 생기기 전의 복습 기록과 카드 추가 날짜로 채움 (한 번만)
  if (!(await getMeta('activitySeeded').catch(() => false))) {
    const reviews = await getAll('reviews');
    await recordActivity([...reviews.map((r) => reviewActivity(r.cardId, r.review)), ...cards.map(addActivity)]);
    await putMeta('activitySeeded', true);
  }
  renderAll();
  // Drive 동기화를 쓰던 이전 버전의 로그인 정보는 더 이상 쓰지 않음
  try { localStorage.removeItem('freedom-auth'); localStorage.removeItem('freedom-oauth-silent'); } catch {}
  if (fbReady) {
    // Google 로그인에서 돌아온 경우
    const login = await handleOAuthReturn().catch((err) => ({ error: errText(err) }));
    if (login && login !== 'ok') toast(login.error === 'access_denied' ? 'Google 로그인을 취소했어요.' : `로그인하지 못했어요. (${login.error})`);
    await fbAuth.authStateReady().catch(() => {});
    fb.onAuthStateChanged(fbAuth, (u) => {
      const changed = u?.uid !== user?.uid;
      user = u;
      renderSyncStatus();
      if (ui.tab === 'settings') { renderUsage(); if (changed) loadUsage(); }
      if (u && changed) syncNow({ announce: login === 'ok' });
    });
  }
  if ('serviceWorker' in navigator) {
    // 처음 설치될 때는 이미 최신이므로 새로고침하지 않음
    const hadController = !!navigator.serviceWorker.controller;
    let reloading = false;
    navigator.serviceWorker.addEventListener('controllerchange', () => {
      if (!hadController || reloading) return;
      reloading = true;
      reloadForUpdate();
    });
    navigator.serviceWorker.register('./sw.js').catch(() => {});
  }
}
init().catch((err) => {
  $('#review-main').innerHTML = `<div class="empty"><h2>저장소를 열지 못했어요</h2><p>개인정보 보호 브라우징을 끄고 다시 열어 주세요. (${esc(err?.message || err)})</p></div>`;
});
</script>
